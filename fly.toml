# fly.toml app configuration file generated for primers on 2026-08-29T23:14:22+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'primers'
primary_region = 'lax'

[build]
[env]
  DATA_DIR = '/data'
  HOST = '0.0.0.0'
  PORT = '8787'

[[mounts]]
  source = 'primer_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
