# fly.toml app configuration file generated for primers on 2026-08-29T23:14:22+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'primers'
primary_region = 'lax'

[build]
[env]
  DATA_DIR = '/data'
  HOST = '0.0.0.0'
  PORT = '8787'
  # Subscription calls seated at once: each is a Claude Code subprocess of
  # roughly 300 MB, so this follows the machine's memory below.
  CALLS_AT_ONCE = '8'

[[mounts]]
  source = 'primer_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    timeout = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '4gb'
  cpus = 2
  memory_mb = 4096

# Room to spill into when the seated calls all peak at once: slow, but
# not a killed process.
swap_size_mb = 512
