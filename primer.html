<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Primer</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<script>/* theme before first paint */
(function(){try{var t=localStorage.getItem("primer:theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;}catch(e){}})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

<style>
/* ══ tokens ═══════════════════════════════════════════════════
   Paper, ink, and one editor's-red. Nothing else.               */
:root{
  --paper:#F5F0E6; --paper-2:#ECE5D6; --card:#FBF8F1;
  --ink:#1E1A15; --ink-2:#564A3F; --ink-3:#8E8375;
  --rule:#E0D8C8; --rule-2:#CBC0AC;
  --red:#A23B2A; --red-2:#7E2C1F; --red-soft:#F0DCD4; --red-tint:rgba(162,59,42,.08);
  --sel:rgba(162,59,42,.18);
  --fold:rgba(50,35,20,.06);
  --on-ink:#F5F0E6; --on-ink-act:#F2B09E;
  --shadow:0 12px 32px rgba(50,35,20,.14),0 1px 2px rgba(50,35,20,.10);
  --col:44rem; --marg:8rem; --gap:1.25rem; --side:13rem; --sgap:2.25rem;
  --head:3.6rem;
  --disp:"Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --body:"Literata","Charter","Iowan Old Style",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#191613; --paper-2:#12100E; --card:#221E1A;
  --ink:#EAE2D4; --ink-2:#B7AC9D; --ink-3:#7E7468;
  --rule:#2D2721; --rule-2:#3D352D;
  --red:#E2836B; --red-2:#F0A18C; --red-soft:#3A241E; --red-tint:rgba(226,131,107,.12);
  --sel:rgba(226,131,107,.28);
  --fold:rgba(0,0,0,.20);
  --on-ink:#191613; --on-ink-act:#A23B2A;
  --shadow:0 14px 36px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ══ base ═════════════════════════════════════════════════════ */
*{box-sizing:border-box}
html{background:var(--paper)}
body{
  margin:0; min-height:100dvh; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:18px; line-height:1.6;
  font-optical-sizing:auto; font-kerning:normal;
  font-variant-numeric:oldstyle-nums proportional-nums;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background-color .35s var(--ease),color .35s var(--ease);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
::selection{background:var(--sel)}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:2px}
[hidden]{display:none!important}

/* ══ header ═══════════════════════════════════════════════════ */
.head{
  position:sticky; top:0; z-index:40; height:var(--head);
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1rem;
  padding:0 1.6rem; background:var(--paper);
  transition:background-color .35s var(--ease);
}
.head::after{
  content:""; position:absolute; left:0; right:0; top:100%; height:1.4rem;
  background:linear-gradient(var(--paper),transparent); pointer-events:none;
}
.wordmark{
  justify-self:start; position:relative; font-family:var(--disp); font-style:italic;
  font-weight:400; font-size:1.5rem; line-height:1; letter-spacing:-.01em;
  font-variation-settings:"SOFT" 100,"WONK" 1; color:var(--ink); padding:.3rem 0;
  display:flex; align-items:center; gap:.4em;
}
.wordmark .logo{font-size:1.05em}
.wordmark::after{
  content:""; position:absolute; right:-.5em; bottom:.42em; width:.26em; height:.26em;
  border-radius:50%; background:var(--red); opacity:0; transform:scale(.3);
  transition:.25s var(--ease);
}
.wordmark:hover::after{opacity:1;transform:none}
body[data-route="cover"] .wordmark{visibility:hidden}
.runhead{
  justify-self:center; max-width:min(46vw,34rem); font-size:.92rem; color:var(--ink-2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:.25rem .5rem;
  opacity:0; transform:translateY(-3px); transition:.3s var(--ease); pointer-events:none;
  border-radius:4px;
}
.runhead.show{opacity:1;transform:none;pointer-events:auto}
.runhead:hover{color:var(--ink);background:var(--paper-2)}
.runhead .n{font-family:var(--disp);font-style:italic;color:var(--red);margin-right:.5em}
.acts{justify-self:end;display:flex;align-items:center;gap:1.4rem}
.act{
  font-size:.88rem; font-variant-caps:all-small-caps; letter-spacing:.09em; color:var(--ink-2);
  padding:.2rem 0 .1rem; border-bottom:1px solid transparent; transition:.2s var(--ease);
}
.act:hover{color:var(--red)}
.act.on{color:var(--red);border-bottom-color:var(--red)}
.act.hide{display:none}
.act.stop{color:var(--red)}
.act.stop::before{
  content:""; display:inline-block; width:.42em; height:.42em; border-radius:50%; background:var(--red);
  margin-right:.45em; vertical-align:middle; position:relative; top:-.1em; animation:breathe 1.5s ease-in-out infinite;
}
.act.prime{
  color:var(--on-ink); background:var(--ink); padding:.32rem .85rem .38rem; border-radius:999px;
  border:0; transition:.2s var(--ease);
}
.act.prime:hover{background:var(--red);color:#fff}
body[data-route="cover"] .act.prime{display:none}
.glyph{
  width:1.7rem; height:1.7rem; border-radius:50%; display:grid; place-items:center;
  font-size:1rem; line-height:1; color:var(--ink-3); transition:.2s var(--ease);
}
.glyph:hover,.glyph.on{color:var(--ink);background:var(--paper-2)}
.glyph.on{color:var(--red)}
.glyph svg{width:1rem;height:1rem;display:block}

main{padding:1.2rem 1.6rem 10rem}

/* ══ the mark ═════════════════════════════════════════════════
   An open two-page spread with the editor's red rule in the margin of the
   recto: the shape of the cover below, and of a revised block. Sized in em
   so each use site sets it with font-size. favicon.svg is the same drawing
   on a paper ground.                                                     */
.logo{width:1em;height:1em;display:block;flex:0 0 auto}
.logo .nib{stroke:var(--red)}

/* ══ cover ════════════════════════════════════════════════════
   A title page over an open book: the composer on the verso, the library
   on the recto, a folded gutter between them.                           */
.cover{max-width:76rem;margin:6vh auto 0}
.cover-head{text-align:center;margin:0 0 3.4rem}
.cover-head .logo{font-size:2.5rem;margin:0 auto .9rem}
.masthead{
  font-family:var(--disp); font-style:italic; font-weight:300; margin:0;
  font-size:clamp(3rem,6.4vw,4.6rem); line-height:.95; letter-spacing:-.025em; color:var(--ink);
  font-variation-settings:"SOFT" 100,"WONK" 1;
}
.masthead i{font-style:normal;color:var(--red)}
.spread{display:grid;grid-template-columns:1fr 1px 1fr;min-height:26rem}
.spread .page{min-width:0;padding:0 3.4rem}
.spread .page:first-child{padding-left:0}
.spread .page:last-child{padding-right:0}
/* The fold: a rule with the paper darkening into it from both sides,
   fading out at the head and the tail so it reads as a fold, not a bar. */
.gutter{
  position:relative; background:var(--rule);
  -webkit-mask-image:linear-gradient(transparent,#000 7%,#000 93%,transparent);
  mask-image:linear-gradient(transparent,#000 7%,#000 93%,transparent);
}
.gutter::before,.gutter::after{content:"";position:absolute;top:0;bottom:0;width:1.5rem;pointer-events:none}
.gutter::before{right:100%;background:linear-gradient(to right,transparent,var(--fold))}
.gutter::after{left:100%;background:linear-gradient(to left,transparent,var(--fold))}
.lab{
  display:block; font-size:.8rem; font-variant-caps:all-small-caps; letter-spacing:.13em;
  color:var(--ink-3); margin:0 0 .3rem; font-weight:500;
}
.topic{
  width:100%; display:block; font-family:var(--disp); font-weight:400; color:var(--ink);
  font-size:clamp(1.7rem,3.6vw,2.4rem); line-height:1.18; letter-spacing:-.012em;
  font-variation-settings:"SOFT" 40; background:none; border:0; border-bottom:1px solid var(--rule-2);
  padding:.1rem 0 .5rem; resize:none; overflow:hidden; margin-bottom:1.9rem;
  transition:border-color .25s var(--ease);
}
.topic:focus{outline:none;border-bottom-color:var(--red)}
.known{
  width:100%; display:block; font-size:1.02rem; line-height:1.55; color:var(--ink);
  background:none; border:0; border-bottom:1px solid var(--rule); padding:.15rem 0 .45rem;
  resize:none; overflow:hidden; transition:border-color .25s var(--ease);
}
.known:focus{outline:none;border-bottom-color:var(--red)}
.known::placeholder{color:var(--ink-3);opacity:1}
.known + .lab{margin-top:1.6rem}
/* Common instructions, one click each; they add up and toggle back off. */
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.chip{
  font-size:.78rem; font-variant-caps:all-small-caps; letter-spacing:.09em; color:var(--ink-2);
  border:1px solid var(--rule-2); border-radius:999px; padding:.16rem .6rem .22rem; transition:.15s var(--ease);
}
.chip:hover{color:var(--red);border-color:var(--red)}
.chip.on{color:#fff;background:var(--red);border-color:var(--red)}
.composer-foot{margin-top:1.6rem;display:flex;align-items:center;gap:1.4rem}
.go{
  font-size:.92rem; font-variant-caps:all-small-caps; letter-spacing:.11em; font-weight:500;
  color:#fff; background:var(--red); padding:.5rem 1.15rem .58rem; border-radius:3px;
  transition:.2s var(--ease);
}
.go:hover{background:var(--red-2)}
.go:active{transform:translateY(1px)}
.library .lab{margin-bottom:.4rem}
.library .empty{margin:.3rem 0 0;font-size:.95rem}
.shelf{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.shelf li{display:flex;align-items:baseline;gap:1.2rem;border-bottom:1px solid var(--rule)}
.shelf .open{
  flex:1; min-width:0; text-align:left; padding:.78rem 0 .82rem; font-size:1.12rem; line-height:1.3;
  display:flex; align-items:baseline; justify-content:space-between; gap:1.2rem; color:var(--ink);
  transition:color .15s;
}
.shelf .open span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelf .open:hover{color:var(--red)}
.shelf time{font-size:.8rem;font-style:italic;color:var(--ink-3);white-space:nowrap}
.shelf .state{font-size:.8rem;font-style:italic;color:var(--ink-3);white-space:nowrap;flex:0 0 auto}
.shelf .state.live{color:var(--red)}
.shelf .state.failed{color:var(--red)}
.shelf .x{
  font-size:.8rem; font-variant-caps:all-small-caps; letter-spacing:.09em; color:var(--ink-3);
  opacity:0; transition:.2s; padding:.4rem 0;
}
.shelf li:hover .x,.shelf .x:focus-visible,.shelf .x.stop{opacity:1}
.shelf .x:hover,.shelf .x.stop{color:var(--red)}
.shelf .confirm{
  flex:1; padding:.78rem 0 .82rem; display:flex; gap:1.4rem; align-items:baseline; flex-wrap:wrap;
  font-size:.98rem; color:var(--ink-2); font-style:italic;
}
.shelf .confirm span{min-width:0;flex:1}
.shelf .confirm button{
  font-style:normal; font-size:.82rem; font-variant-caps:all-small-caps; letter-spacing:.1em;
  color:var(--ink-2); border-bottom:1px solid transparent;
}
.shelf .confirm button:hover{color:var(--red);border-bottom-color:currentColor}
.shelf .confirm button.danger{color:var(--red)}

/* ══ document ═════════════════════════════════════════════════ */
.doc{position:relative;max-width:var(--col);margin:1.6rem auto 0}
.doc-head{margin:0 0 2.8rem;position:relative}
.title{
  font-family:var(--disp); font-weight:400; margin:0 0 1rem; text-wrap:balance;
  font-size:clamp(2.2rem,4.8vw,3.1rem); line-height:1.06; letter-spacing:-.018em;
  font-variation-settings:"SOFT" 40;
}
.meta{
  margin:0; display:grid; grid-template-columns:auto 1fr; gap:.15rem 1.1rem; align-items:baseline;
  font-size:.94rem; line-height:1.45;
}
.meta dt{font-size:.76rem;font-variant-caps:all-small-caps;letter-spacing:.13em;color:var(--ink-3);white-space:nowrap;font-weight:500}
.meta dd{margin:0;color:var(--ink-2);font-style:italic}
.meta dd .dot{
  display:inline-block; width:.42em; height:.42em; border-radius:50%; background:var(--red);
  margin-right:.5em; vertical-align:middle; position:relative; top:-.08em; animation:breathe 1.5s ease-in-out infinite;
}
.meta dd.failed{color:var(--red)}
.meta dd .lnk{
  font-style:normal; font-size:.78rem; font-variant-caps:all-small-caps; letter-spacing:.1em;
  color:var(--red); border-bottom:1px solid transparent; margin-left:.9rem; white-space:nowrap;
}
.meta dd .lnk:hover{border-bottom-color:currentColor}
.meta dd .link{font-style:italic;color:var(--ink-2);border-bottom:1px solid var(--rule-2);transition:.15s}
.meta dd .link:hover{color:var(--red);border-bottom-color:currentColor}

/* ── contents ─────────────────────────────── */
.toc{margin:1.5rem 0 0;padding-top:.9rem;border-top:1px solid var(--rule)}
.toc ol{list-style:none;margin:.15rem 0 0;padding:0;columns:2;column-gap:2.2rem}
.toc li{break-inside:avoid;margin:0 0 .1rem}
.toc button{
  display:flex; gap:.6rem; align-items:baseline; text-align:left; width:100%;
  font-size:.92rem; line-height:1.35; color:var(--ink-2); padding:.12rem 0; transition:color .15s;
}
.toc button:hover{color:var(--red)}
.toc .n{font-family:var(--disp);font-style:italic;color:var(--red);flex:0 0 1.5rem;font-size:.98rem}
.toc .todo button,.toc .todo .n{color:var(--ink-3)}

.block{position:relative;margin:0 0 1.05rem;scroll-margin-top:calc(var(--head) + 1.2rem)}
.block[data-kind="heading"]{margin:2.7rem 0 .9rem}
.doc-head + .block[data-kind="heading"]{margin-top:0}
.body>*:first-child{margin-top:0}
.body>*:last-child{margin-bottom:0}
.body p{margin:0 0 .95rem;text-wrap:pretty;hyphens:auto;hyphenate-limit-chars:8 4 4;hanging-punctuation:first}
.body h2{
  font-family:var(--disp); font-weight:500; margin:0; text-wrap:balance;
  font-size:1.72rem; line-height:1.18; letter-spacing:-.01em; font-variation-settings:"SOFT" 40;
}
.body h3{font-size:1.06rem;font-weight:600;margin:1.4rem 0 .3rem}
.body h4{font-size:.8rem;font-variant-caps:all-small-caps;letter-spacing:.12em;color:var(--ink-2);margin:1.2rem 0 .2rem}
.body ul,.body ol{margin:0 0 .95rem;padding-left:1.35rem}
.body li{margin:.28rem 0;text-wrap:pretty}
.body li::marker{color:var(--ink-3)}
.body strong{font-weight:600}
.body code{font-family:var(--mono);font-size:.84em;background:var(--paper-2);padding:.1em .34em;border-radius:3px;hyphens:none}
.body pre{
  background:var(--paper-2); border-left:2px solid var(--rule-2); padding:.85rem 1rem; margin:0 0 1rem;
  overflow-x:auto; font-size:.8rem; line-height:1.6; border-radius:0 4px 4px 0;
}
.body pre code{background:none;padding:0}
.body blockquote{margin:0 0 1rem;padding-left:1rem;border-left:2px solid var(--rule-2);color:var(--ink-2);font-style:italic}
.body hr{border:0;border-top:1px solid var(--rule);margin:1.4rem 0}
.body table{border-collapse:collapse;margin:0 0 1rem;font-size:.92rem;max-width:100%}
.body th,.body td{padding:.38rem .8rem .38rem 0;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.body th{font-variant-caps:all-small-caps;letter-spacing:.07em;font-weight:500;color:var(--ink-2)}
.body a{color:var(--red);text-decoration-thickness:1px;text-underline-offset:3px}
.body img{max-width:100%;height:auto}
.body .katex-display{margin:1.1rem 0;overflow-x:auto;overflow-y:hidden;padding:.2rem 0}
.body .katex{font-size:1.04em}

.block[data-kind="figure"] .body,.block[data-kind="image"] .body{padding:.4rem 0 .6rem}
.block[data-kind="figure"] figure,.block[data-kind="image"] figure{margin:0}
.block[data-kind="figure"] svg{max-width:100%;height:auto;display:block;color:var(--ink)}
.block[data-kind="figure"] figcaption,.block[data-kind="image"] figcaption{margin-top:.6rem;font-size:.88rem;line-height:1.5;color:var(--ink-2);font-style:italic;text-wrap:pretty}
.block[data-kind="figure"] svg [stroke="#A23B2A"],.block[data-kind="figure"] svg [stroke="#2C6B60"]{stroke:var(--red)}
.block[data-kind="figure"] svg [fill="#A23B2A"],.block[data-kind="figure"] svg [fill="#2C6B60"]{fill:var(--red)}
.block[data-kind="image"] img{display:block;max-width:100%;height:auto;border-radius:3px;background:var(--paper-2)}
.block[data-kind="image"] .credit{
  display:block; font-style:normal; font-size:.74rem; color:var(--ink-3); margin-top:.2rem;
  font-variant-caps:all-small-caps; letter-spacing:.08em;
}

/* ── citations: a small italic numeral after the claim ── */
.cite{font-family:var(--disp);font-style:italic;font-size:.66em;line-height:0;vertical-align:super;margin-left:.12em;white-space:nowrap}
.body .cite a{color:var(--red);text-decoration:none;padding:0 .12em;border-radius:2px;transition:.15s}
.body .cite a:hover{background:var(--red-tint)}
body[data-sources="off"] .cite{display:none}

/* ── marginalia ───────────────────────────── */
.marg{
  position:absolute; top:.34em; right:calc(100% + var(--gap)); width:var(--marg);
  text-align:right; font-size:.82rem; line-height:1.4; color:var(--ink-3); pointer-events:none;
}
.num{font-family:var(--disp);font-style:italic;font-size:1.1rem;color:var(--ink-3);top:.22em;font-variation-settings:"SOFT" 60}
.mark{pointer-events:auto;font-style:italic;color:var(--red);transition:color .2s;padding:0 0 .1rem;text-align:right}
.mark:hover{color:var(--red-2)}
.mark[aria-expanded="true"]{color:var(--red-2)}
.mark.quiet{color:var(--ink-3)}
.mark.quiet:hover{color:var(--red)}
/* Off: no words in the margin and no red rule beside a changed block. The
   status words while a block is being made are progress, not annotation,
   and stay. */
body[data-marks="off"] .mark,
body[data-marks="off"] .block.edited::before{display:none}
.block.edited::before{
  content:""; position:absolute; top:.28em; bottom:.08em; right:calc(100% + .72rem); width:2px;
  background:var(--red); opacity:.85; border-radius:1px; transition:opacity .2s;
}
.block.edited:hover::before{opacity:1}
.status{font-style:italic;color:var(--ink-3)}
.status .dot{
  display:inline-block; width:.42em; height:.42em; border-radius:50%; background:var(--red);
  margin-right:.5em; vertical-align:middle; position:relative; top:-.08em;
  animation:breathe 1.5s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}

.block.busy .body{opacity:.72;transition:opacity .3s}
::highlight(pen){background-color:var(--sel);color:var(--ink)}
.block.busy::before{
  content:""; position:absolute; top:.28em; bottom:.08em; right:calc(100% + .72rem); width:2px;
  background:var(--red); border-radius:1px; animation:breathe 1.5s ease-in-out infinite;
}
.block.pending .body{
  min-height:calc(1.62em * 4); opacity:.55;
  background:repeating-linear-gradient(to bottom,transparent 0 calc(1.62em - 1px),var(--rule) calc(1.62em - 1px) 1.62em);
  background-size:100% 1.62em; background-position:0 .2em;
}
.block.pending.queued .body{opacity:.3}
/* The model's raw output so far, written onto the ruled lines while we wait.
   Font is .68 of the body, line-height scaled back up so it sits on the rules. */
.block.pending .live{
  margin:0; padding:0; background:none; border:0; border-radius:0; overflow:visible;
  font-family:var(--mono); font-size:.68em; line-height:calc(1.62em / .68);
  color:var(--ink-2); white-space:pre-wrap; word-break:break-word; hyphens:none;
}
.block.pending[data-kind="figure"] .live,.block.pending[data-kind="image"] .live{padding:.5rem .8rem;line-height:1.5}
.block.pending[data-kind="figure"] .body,.block.pending[data-kind="image"] .body{
  background:none; min-height:8.5rem; border:1px dashed var(--rule-2); border-radius:3px; opacity:.6;
}
.block.fresh{animation:settle .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes settle{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.err{border-left:2px solid var(--red);padding:.45rem .9rem;color:var(--red);font-size:.93rem;font-style:italic;line-height:1.5}
.err button{font-style:normal;font-size:.8rem;font-variant-caps:all-small-caps;letter-spacing:.1em;margin-left:.7rem;border-bottom:1px solid currentColor;color:var(--red)}
.err.soft{color:var(--ink-3);border-left-color:var(--rule-2)}
.err.soft button{color:var(--ink-2)}
.err.soft button:first-of-type{color:var(--red)}
.block[data-kind="heading"] .err{margin-top:.55rem;font-size:.86rem}

/* ── notes: inline aside, or sidenote on wide screens ── */
.block[data-kind="note"]{margin:.3rem 0 1.3rem;padding:.1rem 0 .1rem 1rem;border-left:2px solid var(--red-soft)}
.block[data-kind="note"] .body{font-size:.94rem;line-height:1.55;color:var(--ink-2)}
.side-q{
  display:block; text-align:left; font-size:.9rem; font-style:italic; color:var(--ink-2);
  margin:0 0 .3rem; line-height:1.45; transition:color .2s;
}
.side-q:hover{color:var(--red)}

/* ── colophon ─────────────────────────────── */
.colophon{
  margin-top:4rem; padding-top:1rem; border-top:1px solid var(--rule); display:flex; flex-wrap:wrap;
  gap:.4rem 1.5rem; align-items:baseline; font-size:.84rem; color:var(--ink-3); font-style:italic;
}
.colophon .fill{flex:1}
.colophon button{font-style:normal;font-size:.82rem;font-variant-caps:all-small-caps;letter-spacing:.1em;color:var(--ink-2);border-bottom:1px solid transparent}
.colophon button:hover{color:var(--red);border-bottom-color:currentColor}
.colophon .confirm{display:flex;gap:1.2rem;align-items:baseline}
.colophon .confirm .danger{color:var(--red)}

/* ══ the pen (selection toolbar) ══════════════════════════════ */
.pen{
  position:absolute; z-index:60; display:none; align-items:center; user-select:none;
  background:var(--card); border:1px solid var(--rule-2); border-radius:7px; box-shadow:var(--shadow);
  padding:.28rem .35rem; transform-origin:50% 100%;
}
.pen.show{display:flex;animation:rise .18s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(5px) scale(.97)}to{opacity:1;transform:none}}
.pen-row{display:flex;align-items:center}
.pen-row button{
  font-size:.88rem; font-variant-caps:all-small-caps; letter-spacing:.09em; color:var(--ink-2);
  padding:.36rem .6rem .4rem; border-radius:4px; white-space:nowrap; display:inline-flex;
  align-items:baseline; gap:.4em; transition:.15s;
}
.pen-row button:hover,.pen-row button:focus-visible{color:var(--red);background:var(--red-tint);outline:none}
.pen kbd{font-family:var(--disp);font-style:italic;font-size:.78rem;color:var(--ink-3);font-variant-caps:normal;letter-spacing:0}
.pen .sep{width:1px;height:1.1rem;background:var(--rule-2);margin:0 .3rem}
.pen-ask{display:none;align-items:center;gap:.4rem;padding:.1rem .2rem .1rem .4rem}
.pen.asking .pen-row{display:none}
.pen.asking .pen-ask{display:flex}
.pen-ask input{
  width:min(24rem,58vw); background:none; border:0; border-bottom:1px solid var(--rule-2);
  padding:.3rem .2rem .35rem; font-size:1rem; color:var(--ink); border-radius:0;
}
.pen-ask input:focus{outline:none;border-bottom-color:var(--red)}
.pen-ask button{
  font-size:.86rem; font-variant-caps:all-small-caps; letter-spacing:.1em; color:var(--red);
  padding:.36rem .55rem .4rem; border-radius:4px;
}
.pen-ask button:hover{background:var(--red-tint)}

/* ══ popovers ═════════════════════════════════════════════════ */
.pop{
  position:absolute; z-index:55; display:none; width:min(21rem,88vw); background:var(--card);
  border:1px solid var(--rule-2); border-radius:7px; box-shadow:var(--shadow);
  padding:.8rem 1rem .8rem; font-size:.92rem; line-height:1.5;
}
.pop.show{display:block;animation:rise .18s var(--ease)}
.pop .k{
  display:flex; justify-content:space-between; gap:1rem; align-items:baseline; margin-bottom:.3rem;
  font-size:.78rem; font-variant-caps:all-small-caps; letter-spacing:.13em; color:var(--red); font-weight:500;
}
.pop .k time{color:var(--ink-3);font-variant-caps:normal;letter-spacing:0;font-style:italic;font-size:.8rem;font-weight:400}
.pop .q{color:var(--ink-2);font-style:italic;margin-bottom:.75rem}
.pop .t{color:var(--ink);margin-bottom:.2rem}
.pop .s{color:var(--ink-2);font-size:.86rem;margin-bottom:.6rem}
.pop .row{display:flex;gap:1.3rem;flex-wrap:wrap}
.pop .row button,.pop .row a{
  font-size:.8rem; font-variant-caps:all-small-caps; letter-spacing:.1em; color:var(--ink-2);
  border-bottom:1px solid transparent; text-decoration:none; font-style:normal;
}
.pop .row button:hover,.pop .row a:hover{color:var(--red);border-bottom-color:currentColor}
.pop .row .host{color:var(--ink-3);font-variant-caps:normal;letter-spacing:0;font-family:var(--mono);font-size:.72rem;margin-left:.4em}

.outline{width:min(24rem,90vw);padding:.5rem .4rem}
.outline button{
  display:flex; width:100%; text-align:left; gap:.7rem; align-items:baseline; padding:.42rem .7rem;
  border-radius:4px; color:var(--ink-2); line-height:1.35; font-size:.95rem;
}
.outline button:hover{background:var(--paper-2);color:var(--ink)}
.outline button.cur{color:var(--ink)}
.outline button .n{font-family:var(--disp);font-style:italic;color:var(--red);flex:0 0 2.2rem;font-size:1rem}
.outline button.cur .n::after{content:"";display:inline-block;width:.32em;height:.32em;border-radius:50%;background:var(--red);margin-left:.4em;vertical-align:middle}
.outline .foot{border-top:1px solid var(--rule);margin:.4rem .3rem 0;padding-top:.45rem;display:flex;gap:.2rem}
.outline .foot button{width:auto;font-size:.8rem;font-variant-caps:all-small-caps;letter-spacing:.1em;padding:.3rem .5rem}
.outline .hint{display:block;padding:.35rem .7rem .2rem;font-size:.78rem;font-variant-caps:all-small-caps;letter-spacing:.13em;color:var(--ink-3)}
.outline form{display:flex;gap:.4rem;align-items:baseline;padding:.3rem .7rem .2rem;border-top:1px solid var(--rule);margin-top:.35rem}
.outline form input{
  flex:1; min-width:0; background:none; border:0; border-bottom:1px solid var(--rule-2);
  padding:.3rem .1rem .35rem; font-size:.95rem; color:var(--ink); border-radius:0;
}
.outline form input:focus{outline:none;border-bottom-color:var(--red)}
.outline form button{width:auto;flex:0 0 auto;color:var(--red);font-size:.82rem;font-variant-caps:all-small-caps;letter-spacing:.1em;padding:.3rem .4rem}
.menu{width:12rem}

/* ══ toast ════════════════════════════════════════════════════ */
.toast{
  position:fixed; left:50%; bottom:calc(1.6rem + env(safe-area-inset-bottom)); z-index:65;
  transform:translate(-50%,14px); opacity:0; pointer-events:none;
  background:var(--ink); color:var(--on-ink); border-radius:7px; box-shadow:var(--shadow);
  padding:.55rem 1rem .62rem 1.05rem; font-size:.92rem; display:flex; align-items:baseline; gap:1.1rem;
  max-width:min(34rem,92vw); transition:.28s var(--ease);
}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{font-size:.82rem;font-variant-caps:all-small-caps;letter-spacing:.11em;color:var(--on-ink-act);border-bottom:1px solid currentColor;white-space:nowrap}
.toast.err{background:var(--red);color:#fff}
.toast.err button{color:#fff}

/* ══ the desk: who is working, and what went wrong ════════════ */
.desk{
  position:fixed; left:1.2rem; bottom:calc(1.2rem + env(safe-area-inset-bottom)); z-index:50;
  width:min(19.5rem,calc(100vw - 2.4rem)); background:var(--card); border:1px solid var(--rule-2);
  border-radius:7px; box-shadow:var(--shadow); font-size:.84rem; line-height:1.4;
}
.desk-head{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:1rem;padding:.55rem .9rem .45rem;text-align:left}
.desk-head .lab{margin:0;color:var(--ink-2)}
.desk-head .tog{font-size:.72rem;font-variant-caps:all-small-caps;letter-spacing:.1em;color:var(--ink-3)}
.desk ul{list-style:none;margin:0;padding:0 .9rem .55rem}
.desk.min ul{display:none}
.desk li{display:flex;gap:.55rem;align-items:baseline;padding:.2rem 0;flex-wrap:wrap}
.desk .dot{
  display:inline-block; width:.42em; height:.42em; border-radius:50%; background:var(--red);
  vertical-align:middle; position:relative; top:-.08em; animation:breathe 1.5s ease-in-out infinite; flex:0 0 auto;
}
.desk .what{color:var(--ink);font-style:italic}
.desk .note{
  flex-basis:100%; padding-left:1.05rem; color:var(--ink-3); font-size:.78rem; font-family:var(--mono);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.desk .grp{
  display:flex; justify-content:space-between; align-items:baseline; gap:1rem; margin:.4rem 0 .05rem;
  font-size:.74rem; font-variant-caps:all-small-caps; letter-spacing:.12em; color:var(--ink-3);
}
.desk .grp span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desk .grp button{color:var(--ink-3);border-bottom:1px solid transparent;flex:0 0 auto}
.desk .grp button:hover{color:var(--red);border-bottom-color:currentColor}
.desk .grp button.stop{color:var(--red)}
.desk .grp button.open{color:var(--ink-2)}
.desk-issues{border-top:1px solid var(--rule);padding-top:.45rem!important}
.desk-issues li{color:var(--red);font-size:.82rem;flex-wrap:nowrap}
.desk-issues .msg{flex:1;min-width:0;font-style:italic}
.desk-issues button{
  flex:0 0 auto; font-size:.72rem; font-variant-caps:all-small-caps; letter-spacing:.1em; color:var(--ink-3);
  border-bottom:1px solid transparent;
}
.desk-issues button:hover{color:var(--red);border-bottom-color:currentColor}

/* ══ raw response inspector ═══════════════════════════════════ */
.raw{
  position:fixed; z-index:80; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(46rem,94vw); max-height:72vh; display:flex; flex-direction:column;
  background:var(--card); border:1px solid var(--rule-2); border-radius:7px; box-shadow:var(--shadow);
}
.raw-head{display:flex;align-items:baseline;gap:1.2rem;padding:.7rem 1rem .5rem;border-bottom:1px solid var(--rule)}
.raw-head .lab{margin:0;flex:1}
.raw pre{
  margin:0; padding:.9rem 1rem 1rem; overflow:auto; font-family:var(--mono); font-size:.78rem; line-height:1.6;
  color:var(--ink); white-space:pre-wrap; word-break:break-word; tab-size:2;
}

/* ══ prompts page ═════════════════════════════════════════════ */
.prow{position:relative;margin:0 0 2.2rem}
.prow-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.4rem}
.prow-head .lab{margin:0;color:var(--ink-2)}
.prow .reset{
  font-size:.8rem; font-variant-caps:all-small-caps; letter-spacing:.1em; color:var(--red);
  visibility:hidden; border-bottom:1px solid transparent;
}
.prow.mod .reset{visibility:visible}
.prow .reset:hover{border-bottom-color:currentColor}
.prow.mod::before{
  content:""; position:absolute; top:1.9rem; bottom:0; right:calc(100% + .72rem); width:2px;
  background:var(--red); opacity:.85; border-radius:1px;
}
.p-text{
  width:100%; display:block; font-family:var(--mono); font-size:.8rem; line-height:1.65; tab-size:2;
  background:var(--paper-2); border:0; border-left:2px solid var(--rule-2); border-radius:0 4px 4px 0;
  padding:.8rem .95rem; resize:none; overflow:hidden; color:var(--ink-2); transition:.2s var(--ease);
}
.p-text:focus{outline:none;border-left-color:var(--red);color:var(--ink)}

/* ══ settings page ════════════════════════════════════════════ */
.srow{display:flex;justify-content:space-between;gap:2rem;align-items:flex-start;padding:1.1rem 0;border-bottom:1px solid var(--rule)}
.srow:first-of-type{border-top:1px solid var(--rule)}
.srow .lab{font-size:1.02rem;font-variant-caps:normal;letter-spacing:0;color:var(--ink);font-weight:500;margin:0}
.srow .help{margin:.25rem 0 0;font-size:.9rem;line-height:1.5;color:var(--ink-2);max-width:32rem;text-wrap:pretty}
.switch{flex:0 0 auto;width:2.7rem;height:1.55rem;border-radius:999px;background:var(--rule-2);position:relative;transition:.2s var(--ease);margin-top:.15rem}
.switch i{
  position:absolute; top:.2rem; left:.2rem; width:1.15rem; height:1.15rem; border-radius:50%;
  background:var(--card); transition:.2s var(--ease); box-shadow:0 1px 2px rgba(0,0,0,.25);
}
.switch[aria-checked="true"]{background:var(--red)}
.switch[aria-checked="true"] i{left:1.35rem}
.seg{display:flex;border:1px solid var(--rule-2);border-radius:4px;overflow:hidden;flex:0 0 auto}
.seg button{padding:.3rem .75rem .35rem;font-size:.82rem;font-variant-caps:all-small-caps;letter-spacing:.1em;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule-2)}
.seg button.on{background:var(--ink);color:var(--on-ink)}
.sfield{
  flex:0 1 18rem; background:none; border:0; border-bottom:1px solid var(--rule-2); padding:.2rem .1rem .3rem;
  font-size:.98rem; color:var(--ink); border-radius:0;
}
.sfield:focus{outline:none;border-bottom-color:var(--red)}

/* ══ raw page ═════════════════════════════════════════════════ */
.empty{font-style:italic;color:var(--ink-3)}
.call{border-top:1px solid var(--rule)}
.call:last-of-type{border-bottom:1px solid var(--rule)}
.call summary{display:flex;gap:1rem;align-items:baseline;padding:.7rem 0;cursor:pointer;list-style:none;font-size:.95rem}
.call summary::-webkit-details-marker{display:none}
.call .n{font-family:var(--disp);font-style:italic;color:var(--red);flex:0 0 2rem}
.call .what{color:var(--ink);flex:1;min-width:0}
.call .who{font-family:var(--mono);font-size:.72rem;color:var(--ink-3);white-space:nowrap}
.call .st{font-size:.8rem;font-style:italic;color:var(--ink-3);white-space:nowrap;max-width:14rem;overflow:hidden;text-overflow:ellipsis}
.call.err .st{color:var(--red)}
.call.running .st::before{
  content:""; display:inline-block; width:.42em; height:.42em; border-radius:50%; background:var(--red);
  margin-right:.45em; vertical-align:middle; position:relative; top:-.08em; animation:breathe 1.5s ease-in-out infinite;
}
.call-body{padding:0 0 1.3rem}
.call-body h4{font-size:.76rem;font-variant-caps:all-small-caps;letter-spacing:.13em;color:var(--ink-3);margin:.9rem 0 .3rem;display:flex;justify-content:space-between;align-items:baseline}
.call-body h4 button{font-size:.76rem;color:var(--ink-3);border-bottom:1px solid transparent}
.call-body h4 button:hover{color:var(--red);border-bottom-color:currentColor}
.call-body pre{
  margin:0; padding:.7rem .9rem; background:var(--paper-2); border-left:2px solid var(--rule-2); border-radius:0 4px 4px 0;
  font-family:var(--mono); font-size:.76rem; line-height:1.6; white-space:pre-wrap; word-break:break-word; max-height:28rem; overflow:auto; tab-size:2;
}
.call .events{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:.75rem;line-height:1.6;color:var(--ink-2)}
.call .events li{padding:.15rem 0;border-bottom:1px dashed var(--rule);white-space:pre-wrap;word-break:break-word}
.call .events .k{color:var(--red);margin-right:.6em}
.call .events .bad .k{color:var(--ink-3)}

/* ══ wide: sidenotes in the right margin ══════════════════════ */
@media (min-width:1240px){
  .block[data-kind="note"]{
    position:absolute; left:calc(100% + var(--sgap)); width:var(--side); margin:0; padding:0; border:0;
    font-size:.84rem; line-height:1.5; scroll-margin-top:calc(var(--head) + 1.2rem);
  }
  .block[data-kind="note"]::after{
    content:""; position:absolute; top:.45em; left:calc(-1 * var(--sgap) + .9rem); width:.9rem; height:1px;
    background:var(--red); opacity:.55;
  }
  .block[data-kind="note"] .body{font-size:inherit;line-height:inherit;color:var(--ink-2)}
  .block[data-kind="note"] .body p{margin-bottom:.6rem;hyphens:none}
  .side-q{font-size:.84rem;margin-bottom:.35rem;padding-top:.05rem}
  .block[data-kind="note"].busy::before{display:none}
}

/* ══ the book closes: one page under the other ════════════════ */
@media (max-width:1000px){
  .cover{max-width:var(--col);margin-top:5vh}
  .spread{grid-template-columns:1fr;min-height:0}
  .spread .page{padding:0}
  .gutter{display:none}
  .spread .page:last-child{margin-top:3.4rem;padding-top:1.7rem;border-top:1px solid var(--rule)}
}

/* ══ compact marginalia (no room for words) ═══════════════════ */
@media (max-width:1049px){
  main{padding-left:2rem;padding-right:1.6rem}
  .marg{display:none}
  .num{display:block;position:static;width:auto;text-align:left;font-size:.95rem;margin:0 0 .15rem;color:var(--red)}
  .mark{
    display:block; position:absolute; left:-1.1rem; right:auto; top:0; bottom:0; width:1rem;
    font-size:0; color:transparent; overflow:hidden; padding:0;
  }
  .status{display:block;position:static;width:auto;text-align:left;margin:0 0 .35rem}
  .block.edited::before,.block.busy::before{right:auto;left:-.75rem}
  .prow.mod::before{right:auto;left:-.75rem}
}

/* ══ small screens ════════════════════════════════════════════ */
@media (max-width:700px){
  body{font-size:16.5px}
  .head{padding:0 1rem;gap:.6rem;height:3.2rem}
  :root{--head:3.2rem}
  .head{grid-template-columns:minmax(0,1fr) auto}
  .wordmark,.runhead{grid-area:1/1}
  .runhead{justify-self:start;max-width:100%;font-size:.9rem;padding-left:0;text-align:left}
  .head:has(.runhead.show) .wordmark{opacity:0;pointer-events:none}
  .acts{gap:.9rem}
  main{padding:.8rem 1.1rem 9rem 1.5rem}
  .cover{margin-top:5vh}
  .masthead{margin-bottom:2.4rem}
  .title{font-size:2.05rem}
  .doc{margin-top:1.4rem}
  .meta{grid-template-columns:1fr;gap:.05rem}
  .meta dt{margin-top:.4rem}
  .toc ol{columns:1}
  .cover-head .logo{font-size:2rem}
  .shelf .x{opacity:1}
  .shelf .state{display:none}
  .body .katex-display{margin:.9rem 0}
  .desk{left:.6rem;right:.6rem;bottom:auto;top:calc(var(--head) + .4rem);width:auto}
  .srow{flex-direction:column;gap:.7rem}
  .call summary{flex-wrap:wrap}
  .call .st{max-width:none}
}

/* ══ the pen docks to the bottom on touch screens ═════════════ */
@media (pointer:coarse),(max-width:700px){
  .pen{
    position:fixed; left:.6rem; right:.6rem; top:auto!important;
    bottom:calc(.6rem + env(safe-area-inset-bottom)); border-radius:10px; padding:.4rem .45rem;
  }
  .pen.show{left:.6rem!important}
  .pen-row{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:.15rem}
  .pen-row button{justify-content:center;padding:.5rem .4rem .55rem}
  .pen .sep{display:none}
  .pen kbd{display:none}
  .pen-ask{width:100%}
  .pen-ask input{flex:1;width:auto}
  .toast{bottom:calc(4.4rem + env(safe-area-inset-bottom))}
}

@media print{
  .head,.pen,.pop,.toast,.desk,.colophon button,.meta .lnk{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  main{padding:0}
  .doc{max-width:none}
  .block.edited::before{background:#000}
  .marg{color:#000}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="head">
  <button class="wordmark" id="homeBtn" aria-label="Library"><span>Primer</span></button>
  <button class="runhead" id="runhead" aria-haspopup="true" aria-expanded="false"></button>
  <nav class="acts">
    <button class="act hide" id="undoBtn">Undo</button>
    <button class="act hide stop" id="stopBtn">Stop</button>
    <button class="act hide" id="rewriteBtn" aria-haspopup="true">Rewrite</button>
    <button class="act prime" id="newBtn">New</button>
    <button class="glyph" id="menuBtn" aria-label="Pages" aria-haspopup="true">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="13" cy="8" r="1.4" fill="currentColor"/></svg>
    </button>
    <button class="glyph" id="themeBtn" aria-label="Theme">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
    </button>
  </nav>
</header>

<main id="main"></main>

<div class="pen" id="tools" role="toolbar" aria-label="Revise">

<script>
/* ══ storage ══════════════════════════════════════════════════
   localStorage: primer:index, primer:doc:<id>, primer:raw:<id>,
   primer:prompts, primer:settings. Async so a disk-backed store can
   replace it without touching callers.                              */
let quotaWarned = false;
const store = {
  async get(k){ try{ const v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); }catch(e){ return null; } },
  async set(k,v){
    try{ localStorage.setItem(k, JSON.stringify(v)); }
    catch(e){ if(!quotaWarned){ quotaWarned = true; toast("Browser storage is full; changes are not being saved", { err:true }); } }
  },
  async del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ══ settings ═════════════════════════════════════════════════
   One entry per setting; the Settings page is drawn from this table.
   type is "bool", "select" (with options:[{value,label}]) or "text".
   A setting with `attr` is a display switch: it puts on/off in
   body[data-<attr>], and CSS does the rest, so showing or hiding a part
   of the page needs no code beyond one rule. Only values that differ
   from def are stored.                                               */
const SETTINGS = {
  research: { type:"bool", def:true, label:"Research after writing",
    help:"When a primer is finished, a research agent checks its key claims on the web, cites the ones it can confirm, and corrects the ones that turn out to be wrong." },
  showSources: { type:"bool", def:true, attr:"sources", label:"Show sources",
    help:"Mark cited claims in the text with a small numeral. Hover one to see the source." },
  showMarks: { type:"bool", def:true, attr:"marks", label:"Show margin annotations",
    help:"Note revisions, research corrections, and found images in the margin, with the red rule beside the blocks they changed. Turn this off to read the primer clean; nothing is lost, and the Raw page still has every call." }
};
let settings = {};
const setting = k => (k in settings) ? settings[k] : SETTINGS[k].def;
async function setSetting(k, v){
  if(v === SETTINGS[k].def) delete settings[k]; else settings[k] = v;
  await store.set("primer:settings", settings);
  applySettings();
}
function applySettings(){
  Object.keys(SETTINGS).forEach(k => {
    const a = SETTINGS[k].attr;
    if(a) document.body.dataset[a] = setting(k) ? "on" : "off";
  });
}

/* ══ model ════════════════════════════════════════════════════
   server.mjs answers POST /api/complete {system, user, role} with a stream
   of newline-delimited JSON frames: {start} first, {delta} as text arrives,
   {event} when an agent uses a tool, then {done,text} or {error}. role
   picks the model and tools server-side. o.onDelta(soFar, delta) fires per
   text frame, o.onEvent(event) per start/tool/result frame; o.signal aborts,
   which the server turns into a stopped model call.                   */
const ENDPOINT = "/api/complete";
const RETRIES = 4;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function stopped(partial){ const e = new Error("Stopped."); e.name = "AbortError"; e.stopped = true; if(partial) e.partial = partial; return e; }

async function claude(system, user, role, o){
  o = o || {};
  for(let attempt = 0; ; attempt++){
    if(o.signal && o.signal.aborted) throw stopped();
    let r;
    try{
      r = await fetch(ENDPOINT, { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ system, user, role }), signal: o.signal });
    }catch(e){
      if(e.name === "AbortError") throw stopped();
      if(attempt >= RETRIES) throw new Error("Network error. "+e.message);
      await sleep(800 * Math.pow(2, attempt));
      continue;
    }
    if(r.status===429 || r.status===529 || r.status>=500){
      if(attempt >= RETRIES) throw new Error("Rate limited after "+(RETRIES+1)+" tries.");
      const ra = parseFloat(r.headers.get("retry-after"));
      await sleep(ra ? ra*1000 : 900*Math.pow(2,attempt) + Math.random()*400);
      continue;
    }
    if(!r.ok){
      const d = await r.json().catch(() => ({}));
      throw new Error("Request failed ("+r.status+")" + (d.error && d.error.message ? ": "+d.error.message : ""));
    }
    return readFrames(r, o);
  }
}

/* Once bytes have flowed there is no retry; the server's client already
   retried rate limits before the first delta. A dropped connection throws
   with what arrived on e.partial so the inspector can show it. */
async function readFrames(r, o){
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "", acc = "";
  try{
    for(;;){
      const { value, done } = await reader.read();
      buf += done ? dec.decode() : dec.decode(value, { stream:true });
      const lines = buf.split("\n"); buf = lines.pop();
      for(const line of lines){
        if(!line.trim()) continue;
        const f = JSON.parse(line);
        if(f.start && o.onEvent) o.onEvent({ kind:"start", ...f.start });
        if(f.event && o.onEvent) o.onEvent(f.event);
        if(f.delta != null){ acc += f.delta; if(o.onDelta) o.onDelta(acc, f.delta); }
        if(f.error){ const e = new Error(f.error.message || "Request failed."); e.partial = acc; throw e; }
        if(f.done) return String(f.text != null ? f.text : acc);
      }
      if(done) break;
    }
  }catch(e){ if(e.name === "AbortError") throw stopped(acc); throw e; }
  if(o.signal && o.signal.aborted) throw stopped(acc);
  const e = new Error("Connection dropped mid-response."); e.partial = acc; throw e;
}

/* Models write LaTeX inside JSON strings and sometimes forget to double the
   backslash: \{ or \alpha instead of \\{ and \\alpha. A backslash that does
   not start a valid JSON escape is doubled; valid JSON passes untouched. */
const TEX_AMBIG = /^(?:t(?:au|heta|o|imes|ext(?:bf|it|rm|sf|tt)?|op|an|anh|ilde|riangle|frac|herefore)|b(?:eta|ar|f|egin|inom|oldsymbol|matrix|ig[lrg]*|ackslash|ot|ullet|mod)|f(?:rac|orall|lat|box)|r(?:ho|ight|angle|m|floor|ceil|ightarrow|ightleftharpoons)|n(?:abla|eq|e|u|ot|otin|onumber|ewline|atural|mid|leq|geq|i))(?![A-Za-z])/;
function fixEscapes(s){
  return s.replace(/\\(?:["\\/bfnrt]|u[0-9a-fA-F]{4})|\\/g, (m, at) => {
    if(m.length === 1) return "\\\\";
    if(m.length === 2 && "tbfrn".includes(m[1]) && TEX_AMBIG.test(s.slice(at+1))) return "\\\\" + m[1];
    return m;
  });
}
function parseJSON(txt){
  let s = String(txt).trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const a = s.indexOf("["), o = s.indexOf("{");
  const start = (a<0)?o : (o<0)?a : Math.min(a,o);
  if(start>0) s = s.slice(start);
  s = fixEscapes(s);
  try{ return JSON.parse(s); }catch(e){ return repairJSON(s); }
}

/* Ask and parse; if the answer will not parse, ask once more. Returns
   {value, raws}: every raw response is kept so a failure can be inspected. */
async function askJSON(system, user, role, o){
  o = o || {};
  const raws = [];
  for(let attempt = 0; attempt < 2; attempt++){
    let text;
    try{ text = await claude(system, user, role, o); }
    catch(e){ if(e.partial) raws.push(e.partial); e.raws = raws; throw e; }
    raws.push(text);
    try{ return { value: parseJSON(text), raws }; }
    catch(e){
      if(attempt === 1 || (o.signal && o.signal.aborted)){ e.raws = raws; throw e; }
      if(o.onEvent) o.onEvent({ kind:"retry", reason:e.message, output:text });
    }
  }
}
/* The raw text behind a failure, for the inspector. */
function rawOf(e){
  const r = (e && e.raws || []).filter(x => x != null);
  return r.length ? r.map((x,i) => (r.length > 1 ? "──── attempt " + (i+1) + " ────\n\n" : "") + x).join("\n\n") : "";
}

/* A response cut off mid-way leaves a half-written element.
   Walk to the last element that closed cleanly and discard the rest. */
function repairJSON(s){
  const root = s[0];
  if(root!=="[" && root!=="{") throw new Error("Response wasn't JSON.");
  let depth=0, inStr=false, esc=false, close1=-1, close2=-1;
  for(let i=0;i<s.length;i++){
    const c = s[i];
    if(inStr){
      if(esc) esc = false;
      else if(c==="\\") esc = true;
      else if(c==='"') inStr = false;
      continue;
    }
    if(c==='"'){ inStr = true; continue; }
    if(c==="{" || c==="[") depth++;
    else if(c==="}" || c==="]"){
      depth--;
      if(depth===1) close1 = i;
      if(depth===2) close2 = i;
    }
  }
  if(root==="[" && close1 > 0) return JSON.parse(s.slice(0, close1+1) + "]");
  if(root==="{" && close2 > 0) return JSON.parse(s.slice(0, close2+1) + "]}");
  throw new Error("Response was cut off mid-element.");
}

/* ══ prompts ══════════════════════════════════════════════════
   Every string Primer sends the model, system and user, lives in
   prompts/<key>.txt, raw text, loaded at boot. This table fixes the
   order and the labels on the Prompts page; runtime edits there are
   stored as overrides and Reset returns to the file. {{PLACEHOLDERS}}
   are filled in at call time.                                        */
const PROMPTS = {
  house:                { label:"House style" },
  reader:               { label:"Reader" },
  instruction:          { label:"Instructions wrapper" },
  outline:              { label:"Outline · system" },
  outline_user:         { label:"Outline · user" },
  section:              { label:"Section · system" },
  section_user:         { label:"Section · user" },
  edit:                 { label:"Edit · system" },
  edit_user:            { label:"Edit · user" },
  figure:               { label:"Diagram · system" },
  figure_user:          { label:"Diagram · user" },
  finder:               { label:"Image finder · system" },
  finder_user:          { label:"Image finder · user" },
  research:             { label:"Research · system" },
  research_user:        { label:"Research · user" },
  rewrite_outline:      { label:"Rewrite outline · system" },
  rewrite_outline_user: { label:"Rewrite outline · user" },
  rewrite_section_user: { label:"Rewrite section · user" },
  simpler:              { label:"Action · Simpler" },
  example:              { label:"Action · Example" },
  derive:               { label:"Action · Derive" },
  tighter:              { label:"Action · Tighter" },
  ask:                  { label:"Action · Ask" },
  figure_action:        { label:"Action · Diagram" }
};

/* Fetch prompts/<key>.txt for every entry. Returns the keys that failed.
   Needs http; file:// blocks fetch. */
async function loadPrompts(){
  const missing = [];
  await Promise.all(Object.keys(PROMPTS).map(async k => {
    try{
      const r = await fetch("prompts/"+k+".txt", { cache:"no-cache" });
      if(!r.ok) throw new Error(r.status);
      PROMPTS[k].text = (await r.text()).replace(/\r\n/g, "\n").replace(/\n$/, "");
    }catch(e){ PROMPTS[k].text = ""; missing.push(k); }
  }));
  return missing;
}

let overrides = {};   // {key: text} from storage
function rawPrompt(k){ return (k in overrides) ? overrides[k] : PROMPTS[k].text; }

/* {{KEY}} → vars.KEY. Unknown keys are left visible. Blank runs collapse. */
function fill(tpl, vars){
  return tpl.replace(/\{\{(\w+)\}\}/g, (m, key) =>
      (key in vars) ? String(vars[key]) : m)
    .replace(/\n{3,}/g, "\n\n").trim();
}
function sys(k){ return fill(rawPrompt(k), { HOUSE: rawPrompt("house").trim() }); }
function usr(k, vars){ return fill(rawPrompt(k), vars); }

/* Reader knowledge = the standing Reader prompt + this document's field. */
function readerText(known){
  const base = rawPrompt("reader").trim();
  return (known && known.trim()) ? base + "\n" + known.trim() : base;
}
/* The reader's own instructions for this primer, wrapped so the model reads
   them as instructions rather than as part of the topic. Empty when there
   are none, and the {{INSTRUCTION}} line then collapses away. */
function instrText(d){
  const t = String(d.instruction || "").trim();
  return t ? usr("instruction", { INSTRUCTION: t }) : "";
}

/* label is stamped on each revised block and shown in the margin in
   lowercase; key is the pen's keyboard shortcut.                     */
const ACTIONS = {
  simpler: { label:"Simpler",    key:"1" },
  example: { label:"Example",    key:"2" },
  derive:  { label:"Derivation", key:"3" },
  figure:  { label:"Diagram",    key:"4" },
  tighter: { label:"Tighter",    key:"5" },
  ask:     { label:"Question",   key:"6" }
};
const word = edit => String(edit && edit.label || "").toLowerCase();

/* Common ways to ask for a primer. Each becomes a chip under the
   Instructions field on the cover; clicking one writes its text into the
   field, where it can be edited or added to. */
const BRIEFS = [
  { label:"Short",           text:"Keep it short: the fewest sections that cover the subject, and no more than a few paragraphs in each." },
  { label:"A few paragraphs",text:"Write it as a single section of three or four paragraphs. No diagrams and no images." },
  { label:"Minimal",         text:"A minimal primer: the central idea, what it is for, and nothing else." },
  { label:"With derivations",text:"Derive every result step by step instead of stating it, saying what justifies each step." },
  { label:"Worked examples", text:"Give every idea a concrete worked example with real numbers." },
  { label:"Rigorous",        text:"Be precise: exact definitions, stated assumptions, and proofs or proof sketches for the central results." },
  { label:"No pictures",     text:"Text only. Do not request any diagrams or images." }
];

/* Ways to rewrite a primer as a new one. Each becomes a row in the
   Rewrite menu; text is the instruction the planner and writer follow. */
const REWRITES = [
  { label:"Three-paragraph summary", text:"Rewrite the whole explainer as a summary of exactly three paragraphs: one section, three prose elements, no diagrams or images." },
  { label:"One-page overview",       text:"Rewrite it as a one-page overview: two or three short sections that give the reader the shape of the subject and its central result, with no derivations." },
  { label:"More derivations",        text:"Keep the same scope and order, but derive every result step by step instead of stating it, saying what justifies each step." },
  { label:"More worked examples",    text:"Keep the same scope and order, but add a concrete worked example, with real numbers, to every idea that lacks one." },
  { label:"Simpler",                 text:"Rewrite it for a reader with less background: plainer words, smaller steps, every term defined on first use, the same ideas." },
  { label:"Half the length",         text:"Rewrite it at half the length. Keep every idea, cut every repetition and every sentence that does not carry one." },
  { label:"More rigorous",           text:"Rewrite it with full rigour: precise definitions, stated assumptions, and proofs or proof sketches for the central results." }
];

/* The mark, defined once and inlined wherever it is drawn, so it takes the
   ink colour of its surroundings and the red of the current theme. The same
   drawing, on a paper ground, is favicon.svg. */
const LOGO = '<svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">' +
  '<g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round">' +
  '<path d="M16 9.4C13.2 7.4 9.4 6.8 5.2 7.4v16.2c4.2-.6 8 0 10.8 2z"/>' +
  '<path d="M16 9.4c2.8-2 6.6-2.6 10.8-2v16.2c-4.2-.6-8 0-10.8 2z"/></g>' +
  '<path class="nib" d="M20.4 12.8v7.6" fill="none" stroke-width="1.9" stroke-linecap="round"/></svg>';

/* ══ state ════════════════════════════════════════════════════ */
let doc = null;            // the document on screen: {id,title,topic,known,created,status,blocks:[...],rewrite?}
let index = [];            // [{id,title,updated,status}]
let route = "cover";       // "cover" | "doc" | "prompts" | "settings" | "raw"
let undoStack = [];
let sel = null;            // {blockId, text, rect}
const docs = new Map();    // id → the one live object for each document this session
const uid = () => Math.random().toString(36).slice(2,9);

const $ = s => document.querySelector(s);
const main=$("#main"), pen=$("#tools"), pop=$("#pop"), outline=$("#outline"), menu=$("#menu"), rewriteMenu=$("#rewrite"),
      toastEl=$("#toast"), runhead=$("#runhead"), undoBtn=$("#undoBtn"), stopBtn=$("#stopBtn"), rewriteBtn=$("#rewriteBtn"),
      newBtn=$("#newBtn"), menuBtn=$("#menuBtn"), themeBtn=$("#themeBtn"), askInput=$("#askInput"),
      desk=$("#desk"), deskHead=$("#deskHead"), deskJobs=$("#deskJobs"), deskIssues=$("#deskIssues");

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function btn(cls, text, onclick){ const b = el("button", cls, text); b.type = "button"; if(onclick) b.onclick = onclick; return b; }
function timeAgo(ts){
  const d = Date.now()-ts, m = Math.round(d/6e4), h = Math.round(d/36e5), dd = Math.round(d/864e5);
  if(m < 1) return "just now";
  if(m < 60) return m+" min ago";
  if(h < 24) return h+(h===1?" hour ago":" hours ago");
  if(dd < 7) return dd+(dd===1?" day ago":" days ago");
  return shortDate(ts);
}
function shortDate(ts){
  const d = new Date(ts), o = {month:"short", day:"numeric"};
  if(d.getFullYear() !== new Date().getFullYear()) o.year = "numeric";
  return d.toLocaleDateString(undefined, o);
}
const host = u => { try{ return new URL(u).host.replace(/^www\./,""); }catch(e){ return String(u||""); } };
function grow(ta){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }
const docked = () => matchMedia("(pointer:coarse)").matches || innerWidth <= 700;
const headingTitle = b => String(b.md || "").replace(/^#+\s*/,"");

/* ══ markdown + math ══════════════════════════════════════════ */
marked.setOptions({breaks:false, gfm:true});
const MATH_RE = /\$\$[\s\S]*?\$\$|\$(?:\\.|[^$\\\n])+?\$/g;

function mdToHtml(md){
  const parts = String(md).split(/(```[\s\S]*?```)/g);
  const stash = [];
  const masked = parts.map(p => p.startsWith("```") ? p :
    p.replace(MATH_RE, m => { stash.push(m); return "@@PM"+(stash.length-1)+"@@"; })
  ).join("");
  let html = marked.parse(masked);
  return html.replace(/@@PM(\d+)@@/g, (_,i) => stash[+i]);
}
function mdInline(md){
  const stash = [];
  const masked = String(md).replace(MATH_RE, m => { stash.push(m); return "@@PM"+(stash.length-1)+"@@"; });
  return marked.parseInline(masked).replace(/@@PM(\d+)@@/g, (_,i) => stash[+i]);
}
function typeset(el){
  try{
    renderMathInElement(el,{ throwOnError:false, delimiters:[
      {left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},
      {left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}]});
  }catch(e){}
}

/* ══ trace ════════════════════════════════════════════════════
   Every model call made for a document, in order, with the prompts that
   went out, the tools the agent used, and the text that came back. Kept
   under primer:raw:<id> and shown on the Raw page.                     */
const traces = new Map();          // docId → [record]
const traceSaveT = new Map();
const TRACE_MAX = 150, TRACE_TEXT = 60000;
const clip = s => (s && s.length > TRACE_TEXT) ? s.slice(0, TRACE_TEXT) + "\n…[" + (s.length - TRACE_TEXT) + " more characters]" : s;
async function traceOf(id){
  if(!traces.has(id)) traces.set(id, (await store.get("primer:raw:"+id)) || []);
  return traces.get(id);
}
function saveTrace(id){
  clearTimeout(traceSaveT.get(id));
  traceSaveT.set(id, setTimeout(() => {
    const t = traces.get(id); if(!t) return;
    if(t.length > TRACE_MAX) t.splice(0, t.length - TRACE_MAX);
    store.set("primer:raw:"+id, t.map(c => ({ ...c, output:clip(c.output), system:clip(c.system), user:clip(c.user) })));
  }, 600));
}

/* ══ runs and jobs ════════════════════════════════════════════
   A run is everything in flight for one document: its jobs (one per model
   call) and the switch that stops them. Generation never touches the global
   `doc`; it works on the document it was given, and the page redraws only
   when that document is the one on screen. So a second primer can be
   started, or the library opened, while the first is still being written. */
const runs = new Map();   // docId → {doc, jobs:Set<job>, cancelled, active, side}
function runOf(d){
  let r = runs.get(d.id);
  if(!r){ r = { doc:d, jobs:new Set(), cancelled:false, active:false, side:Promise.resolve() }; runs.set(d.id, r); }
  return r;
}
const running = d => { const r = d && runs.get(d.id); return !!(r && (r.jobs.size || r.active)); };
function stopRun(d){
  const r = runs.get(d.id);
  if(!r || !(r.jobs.size || r.active)) return;
  r.cancelled = true;
  r.jobs.forEach(j => j.ctrl.abort());
}
function tidyRun(d){ const r = runs.get(d.id); if(r && !r.jobs.size && !r.active) runs.delete(d.id); }
const allJobs = () => [...runs.values()].flatMap(r => [...r.jobs]);

/* One model call on a document's behalf. While it runs it is a job the desk
   shows; its text streams into `block`; every prompt, tool call and reply
   lands in the document's trace. Throws with e.stopped when the run was
   stopped. s: {role, label, sec, block, system, user}.                  */
async function agent(d, s){
  const run = runOf(d);
  const job = { id:uid(), doc:d, role:s.role, label:s.label, sec:s.sec, blockId:s.block && s.block.id,
                ctrl:new AbortController(), started:Date.now(), note:"" };
  run.jobs.add(job);
  const trace = await traceOf(d.id);
  const rec = { id:job.id, docId:d.id, role:s.role, label:s.label, sec:s.sec, blockId:job.blockId, started:job.started,
                status:"running", system:s.system, user:s.user, output:"", events:[] };
  trace.push(rec); saveTrace(d.id);
  const live = s.block ? liveInto(d, s.block) : null;
  deskRender();
  try{
    const out = await askJSON(s.system, s.user, s.role, {
      signal: job.ctrl.signal,
      onDelta: soFar => { rec.output = soFar; if(live) live(soFar); rawLive(rec); },
      onEvent: ev => {
        rec.events.push({ t:Date.now(), ...ev });
        if(ev.kind === "start") rec.model = ev.model;
        if(ev.kind === "tool") job.note = toolNote(ev);
        if(ev.kind === "result") job.note = ev.ok ? job.note : "tool failed, trying another way";
        if(ev.kind === "retry"){ rec.output = ""; job.note = "answer didn't parse, asking again"; }
        deskRender(); rawLive(rec);
      }
    });
    rec.output = out.raws[out.raws.length - 1] || rec.output;
    rec.status = "ok";
    return out;
  }catch(e){
    rec.status = e.stopped ? "stopped" : "error";
    rec.error = e.message;
    if(e.partial) rec.output = e.partial;
    if(!e.stopped) issue(d, cap(s.label || "a call") + " failed: " + e.message, rec);
    throw e;
  }finally{
    rec.ended = Date.now(); saveTrace(d.id);
    run.jobs.delete(job); deskRender(); rawLive(rec);
  }
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function toolNote(ev){
  const i = ev.input || {};
  if(ev.name === "WebSearch") return "searching “" + (i.query || "") + "”";
  if(ev.name === "WebFetch") return "reading " + host(i.url);
  if(/look_at_image$/.test(ev.name)) return "looking at " + host(i.url);
  return ev.name;
}

/* ══ issues ═══════════════════════════════════════════════════
   Everything that went wrong this session, newest first, on the desk.
   Each one also lives on in its block's error and in the trace.      */
const issues = [];
function issue(d, msg, rec){
  issues.unshift({ id:uid(), ts:Date.now(), docId:d.id, title:d.title, msg, rec });
  if(issues.length > 8) issues.pop();
  toast(msg, { err:true, raw: rec && rec.output });
  deskRender();
}

/* ══ the desk ═════════════════════════════════════════════════
   A small card that lists every agent at work, grouped by document, with
   what each is doing right now, and the recent issues. Hidden when idle. */
let deskT = 0, deskMin = false, shelfSig = null;
function deskRender(){
  if(deskT) return;
  deskT = requestAnimationFrame(() => { deskT = 0; deskPaint(); statusPaint(); paintHeader(); if(route === "cover") renderLibrary(); });
}
function deskPaint(){
  const jobs = allJobs();
  desk.hidden = !jobs.length && !issues.length;
  if(desk.hidden) return;
  desk.classList.toggle("min", deskMin);
  deskHead.querySelector(".lab").textContent =
    jobs.length ? (jobs.length === 1 ? "One agent working" : jobs.length + " agents working")
                : (issues.length === 1 ? "One issue" : issues.length + " issues");
  deskHead.querySelector(".tog").textContent = deskMin ? "show" : "hide";

  const groups = new Map();
  jobs.forEach(j => { if(!groups.has(j.doc)) groups.set(j.doc, []); groups.get(j.doc).push(j); });
  deskJobs.replaceChildren();
  groups.forEach((list, d) => {
    const g = el("li", "grp");
    g.append(el("span", null, d === doc && route === "doc" ? "this primer" : d.title));
    if(d !== doc || route !== "doc") g.append(btn("open", "open", () => openDoc(d.id)));
    g.append(btn("stop", "stop", () => stopRun(d)));
    deskJobs.append(g);
    list.forEach(j => {
      const li = el("li");
      li.append(el("i", "dot"), el("span", "what", j.label));
      if(j.note) li.append(el("span", "note", j.note));
      deskJobs.append(li);
    });
  });
  deskIssues.hidden = !issues.length;
  deskIssues.replaceChildren(...issues.map(x => {
    const li = el("li");
    const m = el("span", "msg", (x.docId !== (doc && doc.id) ? x.title + ": " : "") + x.msg);
    m.title = timeAgo(x.ts);
    li.append(m);
    if(x.rec) li.append(btn(null, "raw", () => openRaw(x.docId, x.rec.id)));
    li.append(btn(null, "dismiss", () => { const i = issues.indexOf(x); if(i > -1) issues.splice(i, 1); deskRender(); }));
    return li;
  }));
}
deskHead.onclick = () => { deskMin = !deskMin; deskPaint(); };
if(matchMedia("(max-width:700px)").matches) deskMin = true;

/* ══ render ═══════════════════════════════════════════════════ */
function render(){
  document.body.dataset.route = route;
  closePops(); hideTools();
  if(route === "prompts") renderPrompts();
  else if(route === "settings") renderSettings();
  else if(route === "raw") renderRaw();
  else if(route === "doc" && doc) renderDoc();
  else { route = "cover"; document.body.dataset.route = route; renderCover(); }
  paintHeader();
  updateRunhead();
}
function paintHeader(){
  undoBtn.classList.toggle("hide", !(route === "doc" && undoStack.length));
  const busy = route === "doc" && doc && running(doc);
  stopBtn.classList.toggle("hide", !busy);
  rewriteBtn.classList.toggle("hide", !(route === "doc" && doc && !busy && doc.blocks.some(b => b.md && b.kind !== "heading")));
  menuBtn.classList.toggle("on", route === "prompts" || route === "settings" || route === "raw");
}
/* Redraw or patch only when the document is the one on screen. */
function rerender(d){ if(doc === d && route === "doc") render(); }

/* ── cover: composer + library ────────────── */
function renderCover(){
  const c = el("section", "cover");
  c.innerHTML = `<header class="cover-head">${LOGO}<h1 class="masthead">Primer<i>.</i></h1></header>
    <div class="spread">
    <div class="page">
    <form class="composer" id="composer">
      <label class="lab" for="cTopic">Topic</label>
      <textarea id="cTopic" class="topic" rows="1" autocomplete="off"></textarea>
      <label class="lab" for="cKnown">Already know</label>
      <textarea id="cKnown" class="known" rows="1"></textarea>
      <label class="lab" for="cInstr">Instructions</label>
      <textarea id="cInstr" class="known" rows="1" placeholder="Optional. How it should be written: shorter, deeper, no pictures…"></textarea>
      <div class="chips" id="cChips"></div>
      <div class="composer-foot"><button class="go" type="submit">Write it</button></div>
    </form>
    </div>
    <div class="gutter" aria-hidden="true"></div>
    <div class="page"><section class="library" id="library"></section></div>
    </div>`;
  main.replaceChildren(c);

  const form = $("#composer"), topic = $("#cTopic"), known = $("#cKnown"), instr = $("#cInstr");
  const fields = [topic, known, instr];
  fields.forEach(f => { f.oninput = () => grow(f); });
  topic.onkeydown = e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); } };
  [known, instr].forEach(f => {
    f.onkeydown = e => { if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); form.requestSubmit(); } };
  });

  /* A chip appends its instruction, so several can be combined, and clicking
     one again takes it back off. */
  const chips = $("#cChips");
  BRIEFS.forEach(p => {
    const b = btn("chip", p.label, () => {
      const has = instr.value.includes(p.text);
      const rest = instr.value.split(/\n+/).map(s => s.trim()).filter(s => s && s !== p.text);
      instr.value = (has ? rest : rest.concat(p.text)).join("\n");
      instr.dispatchEvent(new Event("input"));
      instr.focus();
    });
    b.dataset.text = p.text; b.title = p.text;
    chips.append(b);
  });
  instr.addEventListener("input", () =>
    chips.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", instr.value.includes(c.dataset.text))));

  form.onsubmit = e => {
    e.preventDefault();
    const t = topic.value.trim(); if(!t){ topic.focus(); return; }
    startDoc({ topic:t, known:known.value.trim(), instruction:instr.value.trim() });
  };
  shelfSig = null;
  renderLibrary();
  requestAnimationFrame(() => fields.forEach(grow));
}

/* What the library says about a document: nothing when it is finished,
   otherwise where it is, live if it is being written right now. */
function shelfState(it){
  const d = docs.get(it.id);
  if(d && running(d)) return { live:true, text: docState(d).text };
  if(d) { const st = docState(d); return st.kind === "done" ? null : { failed: st.kind === "failed", text: st.kind === "short" ? st.text : st.text.split(",")[0] }; }
  const s = it.status || "done";
  if(s === "done") return it.short ? { text: it.short === 1 ? "one piece missing" : it.short + " pieces missing" } : null;
  if(s === "failed") return { failed:true, text:"failed" };
  return { text: s === "stopped" ? "stopped" : "unfinished" };
}
function renderLibrary(){
  const lib = $("#library");
  if(!lib) return;
  const states = index.map(it => { const s = shelfState(it); return s ? (s.live ? "·" : "") + s.text : ""; });
  const sig = index.map((it, i) => it.id + it.title + states[i]).join("|");
  if(sig === shelfSig) return;
  shelfSig = sig;
  if(!index.length){
    lib.replaceChildren(el("h2", "lab", "Library"), el("p", "empty", "Nothing on the shelf yet. What you write is kept here."));
    return;
  }
  const list = el("ol", "shelf");
  index.forEach((it, i) => {
    const li = el("li");
    const open = btn("open", null, () => openDoc(it.id));
    open.append(el("span", null, it.title));
    const s = shelfState(it);
    if(s){ const st = el("span", "state" + (s.live ? " live" : "") + (s.failed ? " failed" : ""), s.text); open.append(st); }
    open.append(el("time", null, shortDate(it.updated)));
    let x;
    if(s && s.live) x = btn("x stop", "Stop", () => stopRun(docs.get(it.id)));
    else{
      x = btn("x", "Delete");
      x.onclick = () => confirmRow(li, it.title, () => deleteDoc(it.id), () => { li.replaceChildren(open, x); });
    }
    li.append(open, x);
    list.appendChild(li);
  });
  lib.replaceChildren(el("h2", "lab", "Library"), list);
}
function confirmRow(host, title, yes, no){
  const c = el("div", "confirm");
  const y = btn("danger", "Delete", yes);
  const n = btn(null, "Keep", no);
  c.append(el("span", null, "Delete “"+title+"”?"), y, n);
  host.replaceChildren(c);
  n.focus();
}

/* ── document ─────────────────────────────── */
function renderDoc(){
  const a = el("article", "doc");
  a.innerHTML = `<header class="doc-head"><h1 class="title"></h1><dl class="meta"></dl></header>`;
  a.querySelector(".title").textContent = doc.title;
  const meta = a.querySelector(".meta");
  const row = (k, v, cls) => {
    const dt = el("dt", null, k), dd = el("dd", cls);
    if(typeof v === "string") dd.textContent = v; else dd.append(v);
    meta.append(dt, dd);
    return dd;
  };
  row("Asked for", doc.topic || doc.title);
  if(doc.known) row("Already knew", doc.known);
  if(doc.instruction) row("Asked to", doc.instruction);
  if(doc.rewrite){
    const v = el("span");
    v.append(btn("link", doc.rewrite.ofTitle, () => openDoc(doc.rewrite.of)), " · “" + doc.rewrite.instruction + "”");
    row("Rewrite of", v);
  }
  row("Status", statusNode(doc), "m-status");
  a.querySelector(".doc-head").append(tocNode(doc));

  let n = 0, fi = 0;
  doc.blocks.forEach(b => {
    if(b.kind === "heading") n++;
    const e = blockEl(b, n);
    if(e.classList.contains("fresh")) e.style.setProperty("--i", fi++);
    a.appendChild(e);
  });
  if(!doc.blocks.some(b => b.pending) && doc.blocks.some(b => b.kind==="heading")) a.appendChild(colophon());
  main.replaceChildren(a);
  typeset(a);
  layoutSidenotes();
  rehighlight();
  statusPaint();
}
function rehighlight(){
  const b = doc && doc.blocks.find(x => x.busy && x.hl);
  if(!b) return;
  const e = main.querySelector(`[data-block-id="${b.id}"] .body`);
  if(e) highlightIn(e, b.hl);
}

/* A piece that was asked for and never arrived: a section that was not
   written, a diagram never drawn, an image never found. Each one keeps its
   brief, so each can be filled in on its own. */
const unfilled = b => !b.md && !b.src && (b.slot || ((b.kind === "figure" || b.kind === "image") && b.brief));
const gaps = d => d.blocks.filter(unfilled);

/* Where a document stands: {kind:"busy"|"stopped"|"failed"|"short"|"done", text}. */
function docState(d){
  const secs = d.blocks.filter(b => b.kind === "heading").length;
  if(running(d)){
    const jobs = [...runOf(d).jobs];
    const w = jobs.find(j => j.role === "section") || jobs.find(j => j.role === "research") || jobs[0];
    let text = !w ? (d.status === "researching" ? "checking sources" : "working")
             : w.role === "section" || w.role === "research" ? w.label + " of " + secs
             : w.label;
    if(jobs.length > 1) text += ", and " + (jobs.length - 1) + " more";
    return { kind:"busy", text };
  }
  if(d.status === "failed") return { kind:"failed", text:"failed" + (d.statusNote ? ": " + d.statusNote : "") };
  if(d.status && d.status !== "done"){
    const written = new Set(d.blocks.filter(b => b.sec != null && b.kind !== "heading" && (b.md || b.src)).map(b => b.sec)).size;
    const why = d.status === "stopped" ? "stopped" : "interrupted";
    return { kind:"stopped", text: why + (written ? " after §" + written + " of " + secs : secs ? " before §1" : "") + (d.statusNote ? ", " + d.statusNote : "") };
  }
  /* Finished, but something it asked for never arrived. Say so: the block
     itself carries the error, and this is what makes it findable. */
  const n = gaps(d).length;
  if(n) return { kind:"short", text: n === 1 ? "one piece missing" : n + " pieces missing" };
  return { kind:"done", text:"" };
}
function statusNode(d){
  const s = docState(d), span = el("span");
  if(s.kind === "busy"){ span.append(el("i", "dot"), s.text, btn("lnk", "Stop", () => stopRun(d))); }
  else if(s.kind === "stopped"){ span.append(s.text, btn("lnk", "Resume", () => resume(d))); }
  else if(s.kind === "failed"){ span.append(s.text, btn("lnk", "Retry", () => resume(d))); }
  else if(s.kind === "short"){ span.append(s.text, btn("lnk", "Fill in", () => resume(d))); }
  return span;
}
/* Refresh the status row of the document on screen without a full redraw. */
function statusPaint(){
  if(route !== "doc" || !doc) return;
  const dd = main.querySelector(".m-status");
  if(!dd) return;
  const done = docState(doc).kind === "done";
  dd.hidden = done; dd.previousElementSibling.hidden = done;
  dd.classList.toggle("failed", docState(doc).kind === "failed");
  dd.replaceChildren(statusNode(doc));
}

/* A short table of contents under the title: one line per section,
   greyed until that section has been written. */
function tocNode(d){
  const nav = el("nav", "toc"); nav.setAttribute("aria-label", "Contents");
  const hs = d.blocks.filter(b => b.kind === "heading");
  if(hs.length < 2){ nav.hidden = true; return nav; }
  nav.append(el("span", "lab", "Contents"));
  const ol = el("ol");
  hs.forEach((h, i) => {
    const li = el("li");
    const written = d.blocks.some(b => b.sec === h.sec && b.kind !== "heading" && (b.md || b.src));
    if(!written) li.classList.add("todo");
    const b = btn(null, null, () => { const e = main.querySelector(`[data-block-id="${h.id}"]`); if(e) e.scrollIntoView({ behavior:"smooth", block:"start" }); });
    b.append(el("span", "n", String(i+1)), headingTitle(h));
    li.append(b); ol.append(li);
  });
  nav.append(ol);
  return nav;
}

/* The word in the margin while a block is being made. */
function statusWord(b){
  if(b.busy) return word(ACTIONS[b.busy] || { label:"revising" });
  if(b.status) return b.status;
  if(b.plan) return "planning";
  if(b.kind === "figure") return "drawing";
  if(b.kind === "image") return "finding";
  return "writing";
}

function blockEl(b, n){
  const e = el("div", "block");
  e.dataset.blockId = b.id;
  e.dataset.kind = b.kind || "prose";
  if(b.busy) e.classList.add("busy");
  if(b.fresh) e.classList.add("fresh");
  if(b.pending) e.classList.add("pending");
  if(b.edit && b.kind !== "note") e.classList.add("edited");
  b.fresh = false;

  if(b.kind === "heading"){
    e.appendChild(el("span", "marg num", "§ " + (n || "")));
  }
  if(b.queued) e.classList.add("queued");
  if((b.pending && !b.queued) || b.busy || b.status){
    const s = el("span", "marg status");
    s.appendChild(el("i", "dot"));
    s.append(statusWord(b));
    e.appendChild(s);
  }else if(b.edit && b.kind !== "note"){
    const m = btn("marg mark", word(b.edit));
    m.setAttribute("aria-label", b.edit.label + ", revision");
    m.onclick = ev => { ev.stopPropagation(); showPop(m, provNodes(b)); };
    if(b.edit.by === "research") hoverable(m, () => provNodes(b));
    e.appendChild(m);
  }else if(b.kind === "image" && b.src && !b.error){
    const m = btn("marg mark quiet", "found");
    m.setAttribute("aria-label", "Image source");
    m.onclick = ev => { ev.stopPropagation(); showPop(m, sourceNodes(b)); };
    hoverable(m, () => sourceNodes(b));
    e.appendChild(m);
  }
  if(b.kind === "note"){
    const q = btn("side-q");
    q.textContent = b.edit ? "“" + (b.edit.note || b.edit.quote) + "”" : "";
    q.onclick = ev => { ev.stopPropagation(); if(b.edit) showPop(q, provNodes(b)); };
    e.appendChild(q);
  }

  const body = el("div", "body");
  if(b.pending){
    /* ruled lines, waiting; the raw output so far once any has arrived */
    if(b.live) body.appendChild(el("pre", "live", liveTail(b.live)));
  }else if(b.error){
    body.appendChild(errNode(b));
  }else if(b.kind === "figure"){
    const fig = el("figure");
    fig.innerHTML = String(b.md).replace(/<script[\s\S]*?<\/script>/gi,"");
    if(b.caption){
      const fc = el("figcaption");
      fc.innerHTML = mdInline(b.caption);
      fig.appendChild(fc);
    }
    body.appendChild(fig);
  }else if(b.kind === "image"){
    body.appendChild(imageNode(b));
  }else{
    body.innerHTML = mdToHtml(b.md);
    if(b.cites && b.cites.length) addCites(body, b.cites);
  }
  e.appendChild(body);
  if(b.kind === "heading" && b.fail){
    const x = el("div", "err", b.fail);
    x.appendChild(btn(null, "Retry", () => researchSection(doc, b.sec)));
    e.appendChild(x);
  }
  return e;
}
function errNode(b){
  const x = el("div", "err" + (b.stopped ? " soft" : ""), b.error);
  if(b.retry) x.appendChild(btn(null, "Retry", () => b.retry()));
  if(b.remove) x.appendChild(btn(null, "Remove", () => b.remove()));
  if(b.raw) x.appendChild(btn(null, "Raw", () => showRaw(b.raw)));
  return x;
}
function imageNode(b){
  const fig = el("figure");
  const img = el("img");
  img.src = b.src; img.alt = b.title || b.caption || ""; img.loading = "lazy";
