/* The whole primer as text, for the rewrite prompts. */
function docText(d){
  return "# " + d.title + "\n\n" + d.blocks.map(b => {
    if(b.kind === "figure") return "[Diagram" + (b.caption ? ": " + b.caption : b.brief ? ": " + b.brief : "") + "]";
    if(b.kind === "image")  return "[Image" + (b.caption ? ": " + b.caption : b.brief ? ": " + b.brief : "") + "]";
    return plainLinks(b.md || "");
  }).filter(Boolean).join("\n\n");
}

/* ══ current section ══════════════════════════════════════════
   The contents in the margin mark the entry that is on screen: the last
   one whose top has passed under the header. */
const headEl = $("#head");
function markCurrent(){
  headEl.classList.toggle("scrolled", scrollY > 2);
  const nav = main.querySelector(".side-toc");
  if(!nav) return;
  const items = nav._items;
  let n = 0;
  items.forEach((it, i) => { const e = it.at(); if(e && e.getBoundingClientRect().top <= 120) n = i + 1; });
  let p = n;   // the section a current subsection belongs to
  while(p > 0 && items[p - 1].sub) p--;
  nav.querySelectorAll("li > button").forEach((b, i) => b.classList.toggle("cur", i + 1 === n || i + 1 === p));
}
let scT = null;
addEventListener("scroll", () => { cancelAnimationFrame(scT); scT = requestAnimationFrame(markCurrent); }, {passive:true});

/* ══ toast ════════════════════════════════════════════════════ */
let toastT = null;
function toast(msg, o){
  o = o || {};
  toastEl.replaceChildren(el("span", null, msg));
  toastEl.classList.toggle("err", !!o.err);
  if(o.undo){
    toastEl.appendChild(btn(null, "Undo", () => { hideToast(); doUndo(); }));
  }
  if(o.call) toastEl.appendChild(btn(null, "Inspect", () => { hideToast(); openInspector(o.call.docId, o.call.id); }));
  toastEl.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(hideToast, o.call ? 14000 : o.err ? 9000 : 6000);
}
function hideToast(){ toastEl.classList.remove("show"); }

/* Put text on the clipboard. Where that is refused, select `node` so it
   can be copied by hand, or say so rather than fail in silence. */
async function copyText(text, node, said){
  try{ await navigator.clipboard.writeText(text); toast(said || "Copied"); }
  catch(e){
    /* Refused: select the text on screen instead, so it can be copied by
       hand. `node` is that text, or a function that puts it up first. */
    if(typeof node === "function") node = node();
    if(node){ const r = document.createRange(); r.selectNodeContents(node); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    else toast("Couldn't copy: " + e.message, { err:true });
  }
}

/* ══ prompts, the last section of Settings ════════════════════
   One folded row per prompt, under its group. Open it to read or edit;
   an edit is kept as an override the moment it is made, and Reset
   returns to the file. */
/* The prompts, in their groups: each group a numbered subsection of
   section n. Returns the groups as contents entries. */
function promptsNode(sec, n){
  sec.classList.add("prompts");
  return Object.keys(PROMPT_GROUPS).map((g, j) => {
    const num = n + "." + (j + 1), head = el("div", "ssub");
    head.append(el("span", "marg num numsub", "§ " + num), el("h3", null, PROMPT_GROUPS[g]));
    sec.append(head);
    Object.keys(PROMPTS).filter(k => PROMPTS[k].group === g && !PROMPTS[k].user).forEach(k => sec.append(promptRow(k)));
    return { num, title:PROMPT_GROUPS[g], sub:true, at:() => head };
  });
}
function promptRow(k){
    const row = el("details", "fold prow"); row.dataset.key = k;
    const head = el("summary");
    const lab = el("span", null, PROMPTS[k].label);
    const rst = btn("reset", "Reset");
    const ta = el("textarea", "p-text"); ta.spellcheck = false; ta.value = rawPrompt(k);
    ta.setAttribute("aria-label", PROMPTS[k].label);

    const mark = () => row.classList.toggle("mod", ta.value !== PROMPTS[k].text);
    let t = null;
    ta.oninput = () => {
      grow(ta); mark();
      clearTimeout(t);
      t = setTimeout(async () => {
        if(ta.value === PROMPTS[k].text) delete overrides[k]; else overrides[k] = ta.value;
        await store.set("primer:prompts", overrides);
      }, 350);
    };
    rst.onclick = async e => {
      e.preventDefault(); e.stopPropagation();
      ta.value = PROMPTS[k].text; grow(ta); mark();
      delete overrides[k];
      await store.set("primer:prompts", overrides);
    };
    /* A textarea cannot be measured while folded away. */
    row.ontoggle = () => { if(row.open) grow(ta); };
    head.append(lab, rst);
    row.append(head, ta);
    mark();
    return row;
}

/* ══ settings page ════════════════════════════════════════════
   Drawn from SETTINGS. One control per type; add a type here to use it. */
const CONTROLS = {
  bool(k, s, onChange){ return switchBtn(s.label, setting(k), onChange); },

  /* What readers sent, newest first, each with where it came from. */
  inbox(){

    api("/api/feedback").then(r => {

          el("span", "sep", "·"), it.name, el("span", "sep", "·"), it.kind === "complaint" ? "complaint" : "feedback");
        li.append(k, el("p", "msg", it.text));

        if(at) src.append(w.url ? webLink(at, w.url) : at);
        if(w.width) src.append((src.childNodes.length ? " · " : "") + w.width + "px wide");
        if(src.childNodes.length) li.append(src);
        ul.append(li);
      });
      box.replaceChildren(ul);
    }).catch(e => { box.textContent = "Couldn't load feedback: " + e.message; });

      return a;
    }
    a.append(el("span", null, "Signed in as " + me.name), btn("quiet", "Sign out", async () => { try{ await api("/api/logout", {}); }catch(e){} signedOut(); }));
    return a;
  }
};

/* ── named keys ──
   Every form on this page is made of the page's own rows: a label on the
   left, its control on the right, and the buttons in a row of their own. */
function srow(label, control){
  const r = el("div", "srow"), l = el("label", "lab", label);
  if(control.id) l.htmlFor = control.id;
  r.append(l, control);
  return r;
}
const acts = (...b) => { const a = el("div", "acts"); a.append(...b); return a; };
/* A text field for a row; a password field never autofills. */
let fieldN = 0;
function kfield(type){
  const i = el("input", "field"); i.type = type || "text"; i.id = "kf" + (++fieldN);
  i.autocomplete = type === "password" ? "new-password" : "off"; i.spellcheck = false;
  return i;
}
/* An on/off switch, the one the settings rows use. */
function switchBtn(label, on, onChange){
  const b = btn("switch"); b.setAttribute("role", "switch"); b.setAttribute("aria-label", label);
  const paint = v => b.setAttribute("aria-checked", String(!!v));
  b.onclick = () => { const v = b.getAttribute("aria-checked") !== "true"; paint(v); onChange(v); };
  b.append(el("i")); paint(on);
  return b;
}
const kindWord = k => k === "key" ? "API key" : "subscription";
/* Name and password of someone's shared key; submit(name, password) links to it. */
function linkForm(submit){
  const f = el("form", "kform"), name = kfield(), pass = kfield("password"), go = btn("go", "Link"); go.type = "submit";
  f.append(srow("Key name", name), srow("Password", pass), acts(go));
  f.onsubmit = async e => { e.preventDefault(); go.disabled = true; await submit(name.value.trim(), pass.value); go.disabled = false; };
  return f;
}
/* Two forms behind one line of choices: press one and its form opens
   under the line; press the other and it takes the place. `tail` sits at
   the line's far end. */
function picker(items, tail){
  const w = el("div", "pick"), row = el("div", "pick-row"), slot = el("div", "pick-form");
  items.forEach(it => {
    const b = btn("pick-b", it.title, () => {
      const on = b.classList.contains("on");
      row.querySelectorAll(".on").forEach(x => x.classList.remove("on"));
      slot.replaceChildren();
      if(on) return;
      b.classList.add("on"); slot.append(it.form);
      const f = it.form.querySelector("input,textarea"); if(f) f.focus();
    });
    row.append(b);
  });
  if(tail){ tail.classList.add("tail"); row.append(tail); }
  w.append(row, slot);
  return w;
}

/* A guest keeps one credential in this browser: a key or token of their
   own, checked once with Anthropic, or someone's shared key by name and
   password, checked on every call. */
function guestKeysControl(){
  const g = el("div", "keys");

      try{ const r = await api("/api/guest/link", { name, password }); setGuestCred({ name:r.name, password, owner:r.owner, kind:r.kind }); draw(); toast("Linked to “" + r.name + "”"); }
      catch(err){ toast(err.message, { err:true }); }

/* Named keys: the ones you own, with what they have been used for by
   day; the shared ones you have linked to; and which one you run on.
   Values are kept on the server, encrypted; only a tail comes back. */
function keysControl(){
  const g = el("div", "keys");
  let st;   // {mine, linked, key}: the whole picture, which every change answers with
  const call = async (path, body, method) => {
    try{ st = await api(path, body, method); me.key = st.key; draw(); return true; }
    catch(e){ toast(e.message, { err:true }); return false; }
  };
  const today = () => new Date().toISOString().slice(0, 10);
  const radio = key => {
    const r = el("input"); r.type = "radio"; r.name = "s-active"; r.checked = !!st.key && st.key.id === key.id;
    r.setAttribute("aria-label", "Run on " + key.name);
    r.onchange = () => { if(r.checked) call("/api/keys/active", { id:key.id }, "PUT"); };
    return r;
  };
  /* What a key has been used for, one row per day, newest first. */
  const dayTable = u => {
    const row = (day, x) => [{ text:day }, { text:String(x.calls), cls:"n" }, { text:kTok(x.tokens_in + x.tokens_out), cls:"n" },
      { text: x.searches ? String(x.searches) : "—", cls:"n" + (x.searches ? "" : " dim") }, { text:usd(x.cost), cls:"n" }];
    return usageTable([{ text:"Day" }, { text:"Calls", cls:"n" }, { text:"Tokens", cls:"n" }, { text:"Searches", cls:"n" }, { text:"Cost", cls:"n" }],
      u.days.map(d => row(d.day === today() ? "Today" : shortDate(Date.parse(d.day + "T12:00:00")), d)), row("In all", u.total));
  };
  /* A key's sharing: the switch, and the password row it opens. */
  const sharing = (on, pwLabel) => {
    const pw = kfield("password"), pwRow = srow(pwLabel, pw); pwRow.hidden = !on;
    const s = { on, pw, pwRow };
    s.row = srow("Shared with a password", switchBtn("Shared with a password", on, v => { s.on = v; pwRow.hidden = !v; if(v) pw.focus(); }));
    return s;
  };
  /* One of your own keys: what it has been used for, and a form to
     rename, share or re-password it, folded under its row. */
  const mineRow = key => {
    const li = el("li", "krow"), d = el("details"), sum = el("summary");
    const spent = (key.usage.days.find(x => x.day === today()) || {}).cost || 0;
    sum.append(el("span", "kname", key.name),
               el("span", "kmeta", kindWord(key.kind) + " · " + (key.shared ? "shared" : "personal")),
               el("span", "kuse", usd(spent) + " today · " + usd(key.usage.total.cost) + " in all"));
    const body = el("div", "kbody");
    const f = el("form", "kform"), name = kfield(); name.value = key.name;
    const sh = sharing(key.shared, key.shared ? "New password" : "Password");
    const save = btn("go", "Save"); save.type = "submit";
    const del = el("span");
    del.append(btn("quiet", "Delete", () => confirmRow(del, key.name,
      async () => { if(await call("/api/keys/" + key.id, null, "DELETE")) toast("Deleted “" + key.name + "”"); })));
    f.append(srow("Key name", name), sh.row, sh.pwRow, acts(save, del));
    f.onsubmit = async e => {
      e.preventDefault();
      const patch = { name:name.value.trim(), shared:sh.on };
      if(sh.pw.value) patch.password = sh.pw.value;
      if(patch.shared && !key.shared && !patch.password){ toast("Set a password for the people you share it with", { err:true }); sh.pw.focus(); return; }
      const unsharing = key.shared && !patch.shared;
      if(await call("/api/keys/" + key.id, patch, "PUT"))
        toast(patch.password && key.shared ? "Password changed. Everyone linked has to link again." : unsharing ? "No longer shared. Everyone linked has lost it." : "Saved");
    };
    body.append(f);
    if(key.usage.days.length) body.append(el("span", "lab", "Usage"), dayTable(key.usage));
    d.append(sum, body);
    li.append(radio(key), d);
    return li;
  };
  /* Someone else's shared key that you have linked to. */
  const linkedRow = key => {
    const li = el("li", "krow"), info = el("div", "kinfo");
    info.append(el("span", "kname", key.name), el("span", "kmeta", kindWord(key.kind) + " · shared by " + key.owner));
    li.append(radio(key), info, btn("unlink", "Unlink", async () => { if(await call("/api/keys/link/" + key.id, null, "DELETE")) toast("Unlinked from “" + key.name + "”"); }));
    return li;
  };
  const draw = () => {
    g.replaceChildren();
    if(!st.key) g.append(el("p", "warn", st.mine.length || st.linked.length
      ? "No key in use. Pick one below: nothing can be written until you do."
      : "No key yet. Nothing can be written until you add one, or link to a key someone shared with you."));
    if(st.mine.length || st.linked.length){
      const ul = el("ul", "klist"); ul.setAttribute("role", "radiogroup"); ul.setAttribute("aria-label", "Keys");
      st.mine.forEach(x => ul.append(mineRow(x)));
      st.linked.forEach(x => ul.append(linkedRow(x)));
      g.append(ul);
    }
    /* API key or subscription token: the server tells which from the value. */
    const f = el("form", "kform"), name = kfield(), value = kfield("password"), sh = sharing(false, "Password");
    const go = btn("go", "Add"); go.type = "submit";
    f.append(srow("Key name", name), srow("API key or subscription token", value), sh.row, sh.pwRow, acts(go));
    f.onsubmit = async e => {
      e.preventDefault(); go.disabled = true;
      const ok = await call("/api/keys", { name:name.value.trim(), value:value.value.trim(), shared:sh.on, password:sh.pw.value }, "POST");
      go.disabled = false;
      if(ok) toast("Added “" + name.value.trim() + "”");
    };
    g.append(picker([{ title:"Add a key", form:f }, { title:"Link to a shared key", form:linkForm(async (name, password) => {
      if(await call("/api/keys/link", { name, password }, "POST")) toast("Linked to “" + name + "”");
    }) }], guideLink()));
  };
  call("/api/keys");
  return g;
}

/* ══ inspector ════════════════════════════════════════════════
   The primer from the inside: what each agent cost, then every call made
   for it, in order, with what went out, what the agent did and what came
   back. Calls in flight update in place.                              */
const AGENTS = {
  outline:  "Planner",
  section:  "Writer",
  edit:     "Reviser",
  figure:   "Illustrator",
  finder:   "Image finder",
  research: "Researcher",
  define:   "Definer"
};
/* A table of usage: heading cells, body rows, and a total row when given.
   A cell is {text, cls?, title?}. Scrolls sideways where it must. */
function usageTable(head, rows, total){
  const tr = (cells, th, cls) => {
    const r = el("tr", cls);
    cells.forEach(c => { const td = el(th ? "th" : "td", c.cls, c.text); if(c.title) td.title = c.title; r.append(td); });
    return r;
  };
  const t = el("table", "usage"), thead = el("thead"), tbody = el("tbody");
  thead.append(tr(head, true));
  rows.forEach(r => tbody.append(tr(r)));
  if(total) tbody.append(tr(total, false, "total"));
  t.append(thead, tbody);
  const wrap = el("div", "scroll"); wrap.append(t);
  return wrap;
}
/* One row per agent: the models it ran on, its calls, and their usage. */
function usageNode(t){
  const rows = new Map();
  for(const r of t){
    const row = rows.get(r.role) || { role:r.role, calls:0, failed:0, in:0, out:0, searches:0, cost:0, models:new Set() };
    row.calls++;
    if(r.status === "error") row.failed++;
    if(r.model) row.models.add(r.model);
    if(r.usage){ row.in += r.usage.in || 0; row.out += r.usage.out || 0; row.searches += r.usage.searches || 0; row.cost += r.usage.cost || 0; }
    rows.set(r.role, row);
  }
  const order = Object.keys(AGENTS);
  const list = [...rows.values()].sort((a, b) => (order.indexOf(a.role) + 1 || 99) - (order.indexOf(b.role) + 1 || 99));
  const total = list.reduce((s, r) => ({ calls:s.calls + r.calls, failed:s.failed + r.failed, in:s.in + r.in, out:s.out + r.out, searches:s.searches + r.searches, cost:s.cost + r.cost }),
                            { calls:0, failed:0, in:0, out:0, searches:0, cost:0 });
  const withSearch = total.searches > 0;
  const calls = r => String(r.calls) + (r.failed ? " · " + r.failed + " failed" : "");
  const cells = (label, model, r) => {
    const c = [{ text:label }, model, { text:calls(r), cls:"n" }, { text:kTok(r.in), cls:"n" }, { text:kTok(r.out), cls:"n" }];
    if(withSearch) c.push({ text: r.searches ? String(r.searches) : "—", cls:"n" + (r.searches ? "" : " dim") });
    c.push({ text:usd(r.cost), cls:"n" });
    return c;
  };
  const head = [{ text:"Agent" }, { text:"Model" }, { text:"Calls", cls:"n" }, { text:"Tokens in", cls:"n" }, { text:"Tokens out", cls:"n" }];
  if(withSearch) head.push({ text:"Searches", cls:"n" });
  head.push({ text:"Cost", cls:"n", title:"At API rates, even on a subscription" });
  return usageTable(head,
    list.map(r => cells(AGENTS[r.role] || r.role, { text:[...r.models].join(", ") || "—", cls:"model" + (r.models.size ? "" : " dim") }, r)),
    list.length > 1 ? cells("Total", { text:"" }, total) : null);
}
async function renderInspector(){
  const page = el("article", "doc inspector");
  page.innerHTML = `<header class="doc-head"><h1 class="title"></h1></header>`;
  page.querySelector(".title").textContent = doc.title;
  page.querySelector(".doc-head").append(barNode(doc), metaNode(doc));
  main.replaceChildren(page);
  const d = doc, t = await traceOf(d.id);
  if(route !== "inspector" || doc !== d || !main.contains(page)) return;
  page.append(el("h2", "sub", "Usage"));
  page.append(t.length ? usageNode(t) : el("p", "empty", "No calls yet."));
  page.append(el("h2", "sub", "Calls"));
  const n = st => t.filter(c => c.status === st).length;
  const failed = n("error"), live = n("running"), lost = n("lost");
  if(t.length) page.append(el("span", "lab", t.length + (t.length === 1 ? " call" : " calls") + (failed ? " · " + failed + " failed" : "") + (lost ? " · " + lost + " cut off" : "") + (live ? " · " + live + " running" : "")));
  const tree = el("div", "calls");
  page.append(tree);
  if(!t.length) tree.append(el("p", "empty", "No calls yet."));
  t.forEach((rec, i) => placeCall(tree, rec, i, t));
}
/* A call goes under the call whose answer asked for it, when that call is
   on the page; otherwise at the root. Children keep their own children. */
function placeCall(tree, rec, i, t){
  const node = el("div", "node");
  node.dataset.callId = rec.id;
  node.append(callEl(rec, i, t), el("div", "kids"));
  const under = rec.parent && tree.querySelector(`.node[data-call-id="${rec.parent}"] > .kids`);
  (under || tree).append(node);
  return node;
}
function stText(rec){
  const dur = rec.status === "lost" ? "" : " · " + (((rec.ended || Date.now()) - rec.started) / 1000).toFixed(1) + "s";
  const s = rec.status === "ok" ? "ok" : rec.status === "running" ? "running" : rec.status === "stopped" ? "stopped" : rec.status === "lost" ? "cut off" : "failed";
  const u = rec.usage ? " · " + kTok(rec.usage.in + rec.usage.out) + " tok · " + usd(rec.usage.cost) : "";
  return s + dur + u + (rec.error && rec.status === "error" ? " · " + rec.error : "");
}
/* Who asked for this call: the call whose answer wanted it, a person, or both. */
function fromNode(rec, t){
  const p = el("p", "from");
  p.append(el("span", "k", "Called by"));
  const parent = rec.parent && t.find(r => r.id === rec.parent);
  if(rec.by === "you") p.append("you" + (parent ? ", for " : ""));
  if(parent){
    const b = btn(null, "#" + (t.indexOf(parent) + 1) + " " + (parent.label || parent.role), () => {
      const c = main.querySelector(`.node[data-call-id="${parent.id}"] > .call`);
      if(c){ c.open = true; c.scrollIntoView({ block:"start", behavior:"smooth" }); }
    });
    p.append(b);
  }else if(rec.by !== "you") p.append(rec.parent ? "a call no longer in the trace" : "the run");
  return p;
}
function evNode(ev){
  const li = el("li");
  if(ev.kind === "start"){ li.append(el("span", "k", "model"), ev.model + (ev.tools && ev.tools.length ? "  tools: " + ev.tools.join(", ") : "  no tools")); }
  else if(ev.kind === "tool"){ li.append(el("span", "k", "→ " + ev.name), JSON.stringify(ev.input)); }
  else if(ev.kind === "result"){ li.className = ev.ok ? "" : "bad"; li.append(el("span", "k", ev.ok ? "←" : "← error"), ev.text || ""); }
  else if(ev.kind === "retry"){ li.append(el("span", "k", "↻ asking again"), ev.reason + "\n" + (ev.output || "")); }
  else li.append(JSON.stringify(ev));
  return li;
}
function callEl(rec, i, t){
  const d = el("details", "call"); d.dataset.callId = rec.id;
  d.classList.toggle("running", rec.status === "running");
  d.classList.toggle("failed", rec.status === "error");
  d.classList.toggle("lost", rec.status === "lost");
  const s = el("summary");
  s.append(el("span", "n", String(i+1)), el("span", "what", rec.label || rec.role),
           el("span", "who", rec.role + (rec.model ? " → " + rec.model : "")), el("span", "st", stText(rec)));
  d.append(s);
  const body = el("div", "call-body");
  body.append(fromNode(rec, t));
  if(rec.error && rec.status !== "ok") body.append(el("p", "why" + (rec.status === "error" ? "" : " soft"), rec.error));
  if(rec.usage){
    const u = rec.usage, p = el("p", "from");
    p.append(el("span", "k", "Usage"), kTok(u.in) + " tokens in · " + kTok(u.out) + " out" + (u.searches ? " · " + u.searches + (u.searches === 1 ? " search" : " searches") : "") + (u.turns > 1 ? " · " + u.turns + " turns" : "") + " · " + usd(u.cost));
    body.append(p);
  }
  const copyBtn = pre => btn(null, "copy", ev => { ev.preventDefault(); ev.stopPropagation(); copyText(pre.textContent, pre); });
  const part = (title, text, cls) => {
    const h = el("h4", null, title), pre = el("pre", cls, text || "");
    h.append(copyBtn(pre));
    body.append(h, pre);
    return pre;
  };
  /* The two prompts side by side, folded until asked for. */
  const prompt = (title, text) => {
    const f = el("details", "prompt"), s = el("summary"), pre = el("pre", null, text || "");
    s.append(el("span", null, title), copyBtn(pre));
    f.append(s, pre);
    return f;
  };
  const prompts = el("div", "prompts"); prompts.append(prompt("System", rec.system), prompt("User", rec.user)); body.append(prompts);
  body.append(el("h4", null, "Events"));
  const ol = el("ol", "events"); rec.events.forEach(ev => ol.append(evNode(ev))); body.append(ol);
  part("Output", rec.output, "out");
  d.append(body);
  return d;
}
/* Keep a running call's row current while the Inspector is open; once it
   ends, redraw the row so its reason and final state are there. */
let liveCallT = 0;
function liveCall(rec){
  if(route !== "inspector" || !doc || rec.docId !== doc.id || liveCallT) return;
  liveCallT = requestAnimationFrame(() => {
    liveCallT = 0;
    if(route !== "inspector" || !doc || rec.docId !== doc.id) return;
    const page = main.querySelector(".inspector"), tree = page && page.querySelector(".calls");
    if(!tree) return;
    const t = traces.get(doc.id) || [];
    const node = tree.querySelector(`.node[data-call-id="${rec.id}"]`);
    if(!node){
      const empty = tree.querySelector(".empty"); if(empty) empty.remove();
      placeCall(tree, rec, tree.querySelectorAll(".call").length, t); return;
    }
    const d = node.querySelector(":scope > .call");
    if(rec.status !== "running"){
      const fresh = callEl(rec, t.indexOf(rec), t);
      fresh.open = d.open;
      d.replaceWith(fresh);
      return;
    }
    d.querySelector(".who").textContent = rec.role + (rec.model ? " → " + rec.model : "");
    d.querySelector(".st").textContent = stText(rec);
    d.querySelector(".out").textContent = rec.output || "";
    const ol = d.querySelector(".events");
    while(ol.children.length < rec.events.length) ol.append(evNode(rec.events[ol.children.length]));
  });
}
/* Jump to one call, from an issue on the desk or a failed piece of the page. */
async function openInspector(docId, callId){
  const d = await loadDoc(docId);
  if(!d) return;
  doc = d; route = "inspector";
  await renderInspector();
  paintHeader();
  const c = callId && main.querySelector(`.node[data-call-id="${callId}"] > .call`);
  if(c){ c.open = true; c.scrollIntoView({ block:"start", behavior:"smooth" }); }
  else scrollTo(0, 0);
}

/* ══ export ═══════════════════════════════════════════════════
   A primer as one Markdown document: what was asked for, the prose as it
   was written, diagrams as the inline SVG they already are, images by
   their source with the credit kept, and the research agent's citations
   as numbered references placed after the claim they support. A piece
   that never arrived becomes a comment rather than a broken link, so the
   file says the same thing the page does.                              */
function docMarkdown(d){
  /* The same numbering the page shows: one number per source. */
  const { n:num, list:sources } = citeIndex(d);
  const parts = ["# " + d.title];

  const asked = [];
  if(d.topic && d.topic !== d.title) asked.push("Asked for: " + d.topic);
  if(d.known) asked.push("Already knew: " + d.known);
  if(d.instruction) asked.push("Asked to: " + d.instruction.replace(/\s*\n+\s*/g, " "));
  if(d.note) asked.push("Note from the planner: " + d.note);
  if(d.rewrite) asked.push("Rewrite of “" + d.rewrite.ofTitle + "”: " + d.rewrite.instruction);
  if(d.define && d.define.from) asked.push("Defines “" + d.define.term + "” in “" + d.define.from.title + "”");
  if(asked.length) parts.push(asked.map(l => "> " + l).join("\n>\n"));

  for(const b of d.blocks){
    if(unfilled(b)){
      const what = b.slot ? "section not written" : b.kind === "figure" ? "diagram not drawn" : "image not found";
      parts.push("<!-- " + what + (b.brief ? ": " + String(b.brief).replace(/--+>/g, "->") : "") + " -->");
    }else if(b.kind === "figure"){
      if(b.md) parts.push(b.md + (b.caption ? "\n\n*" + b.caption + "*" : ""));
    }else if(b.kind === "image"){
      const src = b.url || b.src;
      if(!src) continue;
      const under = [b.caption, b.credit].filter(Boolean).join(" · ");
      parts.push("![" + (b.title || b.caption || "") + "](" + src + ")" + (under ? "\n\n*" + under + "*" : ""));
    }else if(b.md){
      let t = plainLinks(b.md);
      for(const c of (b.cites || [])){
        if(!c.url) continue;
        const m = "[" + num(c) + "]", at = c.claim ? t.indexOf(c.claim) : -1;
        t = at < 0 ? t + " " + m : t.slice(0, at + c.claim.length) + " " + m + t.slice(at + c.claim.length);
      }
      parts.push(b.kind === "note" ? t.split("\n").map(l => "> " + l).join("\n") : t);
    }
  }
  if(sources.length)
    parts.push("## Sources", sources.map((c,i) => (i+1) + ". " + (c.title ? c.title + " · " : "") + c.url).join("\n"));
  return parts.join("\n\n") + "\n";
}
function mdFilename(d){
  const s = String(d.title || "").replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-").toLowerCase();
  return (s || "primer") + ".md";
}
/* Download it as a .md file. The object URL is released on a timer, not
   straight after the click, which can race the download in some browsers. */
function exportDoc(d){
  const name = mdFilename(d);
  const url = URL.createObjectURL(new Blob([docMarkdown(d)], { type:"text/markdown;charset=utf-8" }));
  const a = el("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  toast("Exported " + name);
}
/* PDF by way of the browser's own printer. Save as PDF keeps a diagram as
   the vector SVG it already is, images at their full resolution, and the
   maths as selectable text, none of which survives a canvas-based
   exporter. The print stylesheet does the rest of the work.            */
async function printDoc(d){
  /* Chrome names the file after the document title. */
  const was = document.title;
  document.title = mdFilename(d).replace(/\.md$/, "");
  const restore = () => { document.title = was; removeEventListener("afterprint", restore); };
  addEventListener("afterprint", restore);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  print();
}

/* On paper a hover card is no use, so the sources behind the citations are
   listed at the end, numbered as they are in the text. Added for the print
   and taken away again, so the page on screen never carries it. */
function printSources(d){
  const { list } = citeIndex(d);
  if(!list.length) return null;
  const sec = el("section", "print-sources");
  sec.append(el("h2", null, "Sources"));
  const ol = el("ol");
  list.forEach(c => ol.append(el("li", null, (c.title ? c.title + " · " : "") + c.url)));
  sec.append(ol);
  return sec;
}
addEventListener("beforeprint", () => {
  if(!(route === "doc" || route === "shared") || !doc) return;
  const meta = main.querySelector(".doc .meta"); if(meta) meta.hidden = false;
  const art = main.querySelector(".doc");
  if(!art || art.querySelector(".print-sources")) return;
  const s = printSources(doc);
  if(s) art.appendChild(s);
});
addEventListener("afterprint", () => {
  const s = main.querySelector(".print-sources");
  if(s) s.remove();
  const meta = main.querySelector(".doc .meta"); if(meta) meta.hidden = !aboutOpen;
});

/* ══ theme ════════════════════════════════════════════════════
   The theme is a setting: system, light, dark, paper or paper-dark. It
   sets both the palette (data-theme) and the look, which brings the faces
   (data-look). primer:theme in localStorage is only a copy the pre-paint
   script reads, so the page never flashes the other colour. */
function applyTheme(){
  const t = setting("theme"), root = document.documentElement;
  const dark = t === "dark" || t === "paper-dark" || (t === "system" && matchMedia("(prefers-color-scheme:dark)").matches);
  root.dataset.theme = dark ? "dark" : "light";
  if(t.startsWith("paper")) root.dataset.look = "paper"; else delete root.dataset.look;
  try{ if(t === "system") localStorage.removeItem("primer:theme"); else localStorage.setItem("primer:theme", t); }catch(e){}
}
try{ matchMedia("(prefers-color-scheme:dark)").addEventListener("change", () => { if(setting("theme") === "system") applyTheme(); }); }catch(e){}

/* ══ keys ═════════════════════════════════════════════════════ */
document.addEventListener("keydown", e => {
  const tag = document.activeElement && document.activeElement.tagName;
  const inField = tag==="INPUT" || tag==="TEXTAREA";
  if(e.key === "Escape"){
    if(shareMenu.classList.contains("show")){ closeMenu(shareMenu); return; }
    if(rewriteMenu.classList.contains("show")){ closeMenu(rewriteMenu); return; }
    if(feedbackMenu.classList.contains("show")){ closeMenu(feedbackMenu); return; }
    if(pop.classList.contains("show")){ closePop(); return; }
    if(pen.classList.contains("show")){ hideTools(); return; }
    if(aside() && !inField){ goBack(); return; }
    return;
  }
  if((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase()==="z" && !inField){
    if(route==="doc" && undoStack.length){ e.preventDefault(); doUndo(); hideToast(); }
    return;
  }
  if(!inField && !e.metaKey && !e.ctrlKey && !e.altKey &&
     pen.classList.contains("show") && !pen.classList.contains("asking")){
    const act = Object.keys(ACTIONS).find(k => ACTIONS[k].key === e.key);
    if(act){ e.preventDefault(); trigger(act); }
  }
});

/* ══ boot ═════════════════════════════════════════════════════ */
/* Signed in: fetch what is yours, then the page. */
async function loadMine(){
  try{
    index = (await store.get("primer:index")) || [];
    overrides = (await store.get("primer:prompts")) || {};
    settings = (await store.get("primer:settings")) || {};
  }catch(e){ toast("Couldn't reach the server: " + e.message, { err:true }); }
  applySettings();
}
/* Back to this tab after another wrote a primer: the library catches up. */
document.addEventListener("visibilitychange", async () => {
  if(document.visibilityState !== "visible" || !me || route === "login") return;
  try{ index = mergedIndex(await store.get("primer:index")); }catch(e){ return; }
  if(route === "cover") renderLibrary();
});
async function enter(){
  await loadMine();
  doc = null; route = "cover"; render(); scrollTo(0, 0);
  await openLanding();
  if(!isGuest()) migrateLocal();
  countWords();
}
/* No account: a guest cookie for the calls, everything else in this browser. */
async function enterGuest(){
  try{ await api("/api/guest", {}); }
  catch(e){ toast("Couldn't start as a guest: " + e.message, { err:true }); return; }
  me = guestMe();
  await enter();
}
/* Primers this browser kept before there were accounts move into the
   account the first time it signs in with nothing on the server. */
async function migrateLocal(){
  let keys = [];
  try{ keys = Object.keys(localStorage).filter(k => k.startsWith("primer:") && k !== "primer:theme"); }catch(e){}
  if(!keys.length || index.length) return;
  for(const k of keys){
    try{
      const v = JSON.parse(localStorage.getItem(k));
      if(k === "primer:index"){ for(const it of mergedIndex(v).reverse()) await store.index(it.id, it); }
      else await store.set(k, v);
      localStorage.removeItem(k);
    }catch(e){}
  }
  index = (await store.get("primer:index")) || [];
  overrides = (await store.get("primer:prompts")) || overrides;
  settings = (await store.get("primer:settings")) || settings;
  applySettings(); render();
  if(index.length) toast(index.length === 1 ? "Moved one primer into your account" : "Moved " + index.length + " primers into your account");
}
(async function boot(){
  popping = true;   // no history entries while the page finds its footing
  const missing = await loadPrompts();
  try{ me = await api("/api/me"); }catch(e){ me = null; }
  if(me && me.guest) me = guestMe();
  /* A link to a shared primer, and the guide, open for anyone; signing in
     is for everything else. */
  const shared = sharePath();
  if(shared){ if(me) await loadMine(); await openShared(shared); }
  else if(location.pathname === "/guide"){ if(me) await loadMine(); route = "guide"; render(); }
  else if(me) await enter(); else { route = "login"; render(); }
  /* A reload keeps the old entry's state; start the count afresh here. */
  popping = false; history.replaceState(null, "", location.pathname); syncHistory();
  if(missing.length) toast("Couldn't read " + (missing.length===1 ? "prompts/"+missing[0]+".txt" : missing.length+" files in prompts/") +
    ". Primer has to be served by its own server: npm start", { err:true });
})();
