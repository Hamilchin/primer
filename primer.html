    const foot = el("div", "doc-foot"); foot.append(barNode(doc), metaNode(doc)); a.appendChild(foot);
  }
  if(!doc.blocks.some(b => b.pending) && doc.blocks.some(b => b.kind==="heading")) a.appendChild(colophon());
  main.replaceChildren(a);
  typeset(a);
  layoutSidenotes();
  rehighlight();
  statusPaint();
}
function rehighlight(){
  const b = doc && doc.blocks.find(x => x.busy && x.hl);
  if(!b) return;
  const e = main.querySelector(`[data-block-id="${b.id}"] .body`);
  if(e) highlightIn(e, b.hl);
}
/* Hovering a revision's rule (or a note's quote) marks the passage that was
   asked about. It sits in an earlier block, usually the one just above; the
   search walks back past the blocks that came from the same request, and
   stops at the nearest match. The quote may be the block's whole markdown,
   so the markup is stripped before looking. */
function askedOnHover(h, e, b){
  h.onmouseenter = () => {
    const q = b.edit && b.edit.quote ? plainMd(b.edit.quote).trim() : "";
    if(!q || inFlight) return;
    for(let x = e.previousElementSibling; x; x = x.previousElementSibling){
      if(!x.dataset.blockId) continue;
      const o = doc && doc.blocks.find(y => y.id === x.dataset.blockId);
      if(o && o.edit && o.edit.ts === b.edit.ts) continue;
      const body = x.querySelector(".body");
      const r = body && locate(body, q);
      if(r){ highlightRange(r); return; }
    }
  };
  h.onmouseleave = () => { if(inFlight) rehighlight(); else clearHighlight(); };
}
function plainMd(s){
  return String(s).replace(/!\[[^\]]*\]\([^)]*\)/g, "").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
    .replace(/^\s{0,3}(#{1,6}|>|[-*+]|\d+\.)\s+/gm, "").replace(/(\*\*|__|[*_`~])/g, "");
}

/* What was asked for, shown when About is on: under a primer's title, and
   in its Inspector. */
function metaNode(d){
  const meta = el("dl", "meta"); meta.hidden = !aboutOpen;
  const row = (k, v) => {
    const dt = el("dt", null, k), dd = el("dd");
    if(typeof v === "string") dd.textContent = v; else dd.append(v);
    meta.append(dt, dd);
  };
  row("Asked for", d.topic || d.title);
  if(d.known) row("Already knew", d.known);
  if(d.instruction) row("Asked to", d.instruction);
  if(d.rewrite){
    const v = el("span");
    if(d.rewrite.of && !readonly()) v.append(btn("link", d.rewrite.ofTitle, () => openDoc(d.rewrite.of)));
    else v.append("“" + d.rewrite.ofTitle + "”");
    v.append(" · “" + d.rewrite.instruction + "”");
    row("Rewrite of", v);
  }
  if(d.define && d.define.from){
    const v = el("span", null, "“" + d.define.term + "” in ");
    if(d.define.from.doc && !readonly()) v.append(btn("link", d.define.from.title, () => openDoc(d.define.from.doc)));
    else v.append("“" + d.define.from.title + "”");
    row("Defines", v);
  }
  row("Written", shortDate(d.created));
  if(d.shared){
    row("Shared by", d.shared.live ? d.shared.by + ", as a public link that follows the primer" : d.shared.by + ", " + shortDate(d.shared.created));
    if(d.usage) row("Usage", d.usage);
  }else{
    const use = usageText(usageOf(d));
    if(use) row("Usage", use);
  }
  return meta;
}
/* A piece that was asked for and never arrived: a section that was not
   written, a diagram never drawn, an image never found. Each one keeps its
   brief, so each can be filled in on its own. */
const unfilled = b => !b.md && !b.src && (b.slot || ((b.kind === "figure" || b.kind === "image") && b.brief));
const gaps = d => d.blocks.filter(unfilled);

/* Where a document stands: {kind:"busy"|"stopped"|"failed"|"short"|"done", text}. */
function docState(d){
  const secs = d.blocks.filter(b => b.kind === "heading").length;
  if(running(d)){
    const jobs = [...runOf(d).jobs];
    const w = jobs.find(j => j.role === "section") || jobs.find(j => j.role === "research") || jobs[0];
    let text = !w ? (d.status === "researching" ? "checking sources" : "working")
             : w.role === "section" || w.role === "research" ? w.label + " of " + secs
             : w.label;
    if(jobs.length > 1) text += ", and " + (jobs.length - 1) + " more";
    return { kind:"busy", text };
  }
  /* A live link to a primer still being made: say so, and the page will
     bring the new pieces in as they land. */
  if(d.shared && d.shared.live && /^(planning|writing|researching)$/.test(d.status)){
    const done = new Set(d.blocks.filter(b => b.sec != null && b.kind !== "heading" && b.kind !== "subheading" && (b.md || b.src)).map(b => b.sec)).size;
    return { kind:"live", text: d.status === "planning" ? "being planned" : d.status === "researching" ? "sources being checked"
                                : "being written" + (secs ? ", §" + Math.min(done + 1, secs) + " of " + secs : "") };
  }
  if(d.status === "failed") return { kind:"failed", text:"failed" + (d.statusNote ? ": " + d.statusNote : "") };
  if(d.status && d.status !== "done"){
    const written = new Set(d.blocks.filter(b => b.sec != null && b.kind !== "heading" && (b.md || b.src)).map(b => b.sec)).size;
    const why = d.status === "stopped" ? "stopped" : "interrupted";
    return { kind:"stopped", text: why + (written ? " after §" + written + " of " + secs : secs ? " before §1" : "") + (d.statusNote ? ", " + d.statusNote : "") };
  }
  /* Finished, but something it asked for never arrived. Say so: the block
     itself carries the error, and this is what makes it findable. */
  const n = gaps(d).length;
  if(n) return { kind:"short", text: n === 1 ? "one piece missing" : n + " pieces missing" };
  return { kind:"done", text:"" };
}
function statusNode(d){
  const s = docState(d), box = el("div", "status-row m-status");
  const line = el("span");
  if(s.kind === "busy"){
    /* Every agent at work on this document, with what it is doing right now. */
    const secs = d.blocks.filter(b => b.kind === "heading").length;
    const rank = j => j.role === "section" ? 0 : j.role === "research" ? 1 : 2;
    const jobs = [...runOf(d).jobs].sort((a, b) => rank(a) - rank(b) || a.started - b.started);
    line.append(el("i", "dot"));
    if(!jobs.length) line.append(d.status === "researching" ? "checking sources" : "working");
    jobs.forEach((j, i) => {
      if(i) line.append(el("span", "sep", "·"));
      line.append((j.role === "section" || j.role === "research") && secs ? j.label + " of " + secs : j.label);
      if(j.note) line.append(el("span", "note", j.note));
    });
    line.append(btn("lnk", "Stop", () => stopRun(d)));
  }
  else if(s.kind === "live"){ line.append(el("i", "dot")); line.append(s.text); }
  else if(s.kind === "stopped"){ line.append(s.text); if(!readonly()) line.append(btn("lnk", "Resume", () => resume(d))); }
  else if(s.kind === "failed"){ line.append(s.text); if(!readonly()) line.append(btn("lnk", "Retry", () => resume(d))); }
  else if(s.kind === "short"){ line.append(s.text); if(!readonly()) line.append(btn("lnk", "Fill in", () => resume(d))); }
  if(line.childNodes.length) box.append(line);
  const mine = readonly() ? [] : issues.filter(x => x.docId === d.id);
  if(mine.length){
    const ul = el("ul", "issues");
    mine.forEach(x => {
      const li = el("li"), m = el("span", null, x.msg); m.title = timeAgo(x.ts);
      li.append(m);
      if(x.kind) li.append(btn("lnk", "Settings", () => goto("settings")));
      if(x.rec) li.append(btn("lnk", "Inspect", () => openInspector(x.docId, x.rec.id)));
      li.append(btn("lnk", "Dismiss", () => { const i = issues.indexOf(x); if(i > -1) issues.splice(i, 1); livePaint(); }));
      ul.append(li);
    });
    box.append(ul);
  }
  box.hidden = !box.childNodes.length;
  return box;
}
/* Refresh the status line of the document on screen without a full redraw. */
function statusPaint(){
  if(!onDoc()) return;
  main.querySelectorAll(".m-status").forEach(old => old.replaceWith(statusNode(doc)));
}

/* A short table of contents: one numbered line per entry, greyed while
   `todo`. Under the title, or (side) in the left margin, where the entry
   on screen is marked as you scroll. `at()` finds an entry's element. */
function tocNode(items, side){
  const nav = el("nav", side ? "side-toc" : "toc"); nav.setAttribute("aria-label", "Contents");
  nav._items = items;
  if(items.length < 2){ nav.hidden = true; return nav; }
  if(!side) nav.append(el("span", "lab", "Contents"));
  const ol = el("ol");
  items.forEach((it, i) => {
    const li = el("li");
    if(it.todo) li.classList.add("todo");
    if(it.sub) li.classList.add("subsec");
    const b = btn(null, null, () => { const e = it.at(); if(e) e.scrollIntoView({ behavior:"smooth", block:"start" }); });
    b.append(el("span", "n", it.num || String(i+1)), el("span", "t", it.title));
    b.title = it.title;
    li.append(b); ol.append(li);
  });
  nav.append(ol);
  return nav;
}
/* A primer's contents: its sections, greyed until written, and under each
   its subsections: the ones the plan promised while the section is still
   to come, the ones actually written after that. */
function docToc(d, side){
  const items = [];
  d.blocks.filter(b => b.kind === "heading").forEach((h, i) => {
    items.push({ num:String(i+1), title:headingTitle(h),
      todo: !d.blocks.some(b => b.sec === h.sec && b.kind !== "heading" && b.kind !== "subheading" && (b.md || b.src)),
      at: () => main.querySelector(`[data-block-id="${h.id}"]`) });
    subsOf(d, h).forEach((x, j) => items.push({ num:(i+1) + "." + (j+1), title:x.title, sub:true, todo:!x.block,
      at: () => main.querySelector(`[data-block-id="${(x.block || h).id}"]`) }));
  });
  return tocNode(items, side);
}

/* The word in the margin while a block is being made. */
function statusWord(b){
  if(b.busy) return word(ACTIONS[b.busy] || { label:"revising" });
  if(b.status) return b.status;
  if(b.plan) return "planning";
  if(b.kind === "figure") return "drawing";
  if(b.kind === "image") return "finding";
  return "writing";
}

function blockEl(b, n){
  const e = el("div", "block");
  e.dataset.blockId = b.id;
  e.dataset.kind = b.kind || "prose";
  if(b.busy) e.classList.add("busy");
  if(b.fresh) e.classList.add("fresh");
  if(b.pending) e.classList.add("pending");
  if(b.edit && b.kind !== "note") e.classList.add("edited");
  b.fresh = false;

  if(b.kind === "heading" || b.kind === "subheading"){
    e.appendChild(el("span", "marg num" + (b.kind === "subheading" ? " numsub" : ""), "§ " + (n || "")));
  }
  if(b.queued) e.classList.add("queued");
  if((b.pending && !b.queued) || b.busy || b.status){
    const s = el("span", "marg status");
    s.appendChild(el("i", "dot"));
    s.append(statusWord(b));
    e.appendChild(s);
  }else if(b.edit && b.kind !== "note" && b.kind !== "heading" && b.kind !== "subheading"){
    const m = btn("marg mark", word(b.edit));
    m.setAttribute("aria-label", b.edit.label + ", revision");
    m.onclick = ev => { ev.stopPropagation(); showPop(m, provNodes(b)); };
    if(b.edit.by === "research") hoverable(m, () => provNodes(b));
    e.appendChild(m);
  }
  if(b.kind === "note"){
    const q = btn("side-q");
    const asked = b.edit && (b.edit.note || b.edit.quote);
    q.textContent = asked ? "“" + asked + "”" : "";
    q.onclick = ev => { ev.stopPropagation(); if(b.edit) showPop(q, provNodes(b)); };
    askedOnHover(q, e, b);
    e.appendChild(q);
  }else if(b.edit){
    const bar = btn("bar");
    bar.setAttribute("aria-label", "Show what was asked about");
    bar.onclick = ev => { ev.stopPropagation(); showPop(bar, provNodes(b)); };
    askedOnHover(bar, e, b);
    e.appendChild(bar);
  }

  const body = el("div", "body");
  if(b.pending){
    /* ruled lines, waiting; the output so far once any has arrived */
    if(b.live) body.appendChild(livePre(b));
    else if(b.brief) body.appendChild(el("p", "brief", (b.kind === "figure" ? "Diagram: " : "Image: ") + b.brief));
  }else if(b.error){
    body.appendChild(errNode(b));
  }else if(b.kind === "figure"){
    const fig = el("figure");
    fig.innerHTML = safeSvg(b.md);
    if(b.caption){
      const fc = el("figcaption");
      fc.innerHTML = mdInline(b.caption);
      fig.appendChild(fc);
    }
    body.appendChild(fig);
  }else if(b.kind === "image"){
    body.appendChild(imageNode(b));
  }else{
    body.innerHTML = mdToHtml(b.md);
    wireLinks(body);
    if(b.cites && b.cites.length) addCites(body, b.cites);
  }
  e.appendChild(body);
  if(b.kind === "heading" && b.fail && !readonly()){
    const x = el("div", "err", b.fail);
    x.appendChild(btn(null, "Retry", () => researchSection(doc, b.sec, "you")));
    e.appendChild(x);
  }
  return e;
}
/* What can be done about a piece that never arrived follows from the piece
   itself: a section is written again, a diagram or image is made again or
   taken out, and anything else means planning the outline again. */
function errNode(b){
  const x = el("div", "err" + (b.stopped ? " soft" : ""), b.error);
  if(readonly()) return x;
  const d = doc;
  if(b.slot) x.appendChild(btn(null, "Retry", () => retrySection(d, b.sec)));
  else if(b.kind === "figure" || b.kind === "image"){
    if(b.brief) x.appendChild(btn(null, "Retry", () => retryVisual(d, b, true)));
    x.appendChild(btn(null, "Remove", () => { swapBlock(d, b.id, []); save(d); }));
  }
  else x.appendChild(btn(null, "Retry", () => build(d)));
  x.appendChild(btn(null, "Inspect", () => inspectBlock(d, b)));
  return x;
}
/* The call behind a failed piece, in the Inspector. */
async function inspectBlock(d, b){
  const rec = callFor(await traceOf(d.id), b);
  await openInspector(d.id, rec ? rec.id : null);
  if(!rec) toast("No call was made for this piece.");
}
function imageNode(b){
  const fig = el("figure");
  const img = el("img");
  img.src = b.src; img.alt = b.title || b.caption || ""; img.loading = "lazy";
  img.onerror = () => fig.replaceChildren(errNode({ ...b, error:"The image file is missing." }));
  fig.appendChild(img);
  const fc = el("figcaption");
  if(b.caption) fc.innerHTML = mdInline(b.caption);
  if(b.credit || b.page){
    const c = el("span", "credit");
    if(b.page) c.appendChild(webLink(b.credit || host(b.page), b.page));
    else c.textContent = b.credit;
    fc.appendChild(c);
  }
  if(fc.childNodes.length) fig.appendChild(fc);
  hoverable(fig, () => sourceNodes(b));
  return fig;
}
/* Every citation in a document, numbered once per source in reading order,
   so the numeral beside a claim means the same thing on screen, in the
   exported Markdown, and in a printed list of sources. */
function citeIndex(d){
  const byUrl = new Map(), list = [];
  for(const b of (d ? d.blocks : []))
    for(const c of (b.cites || []))
      if(c.url && !byUrl.has(c.url)) byUrl.set(c.url, list.push(c));
  return { n: c => byUrl.get(c && c.url) || 0, list };
}

/* A small numeral after each cited claim; hover it for the source. */
function addCites(body, cites){
  const num = citeIndex(doc).n;
  cites.forEach(c => {
    const k = num(c);
    if(!k) return;
    const sup = el("sup", "cite");
    const a = webLink(String(k), c.url);
    a.setAttribute("aria-label", "Source " + k + (c.title ? ": " + c.title : ""));
    sup.appendChild(a);
    hoverable(sup, () => citeNodes(c, k));
    const r = c.claim && (locate(body, c.claim) || locate(body, c.claim.replace(/[*_`]/g, "")));
    if(!r){ (body.lastElementChild || body).appendChild(sup); return; }
    r.collapse(false);
    /* A claim that ends inside a link gets its numeral after the link. */
    const end = r.endContainer, link = (end.nodeType === 3 ? end.parentElement : end).closest("a");
    if(link && body.contains(link)) link.after(sup); else r.insertNode(sup);
  });
}

function colophon(){
  const c = el("footer", "colophon");
  const secs = doc.blocks.filter(b => b.kind==="heading").length;
  const revs = doc.blocks.filter(b => b.edit && b.edit.by !== "research").length;
  const cites = citeIndex(doc).list.length;
  const fixes = doc.blocks.filter(b => b.edit && b.edit.by === "research").length;
  const stats = [secs + (secs===1 ? " section" : " sections")];
  if(revs) stats.push(revs + (revs===1 ? " revision" : " revisions"));
  if(cites) stats.push(cites + (cites===1 ? " source" : " sources"));
  if(fixes) stats.push(fixes + (fixes===1 ? " correction" : " corrections"));
  c.appendChild(el("span", "fill", stats.join(" · ")));
  if(readonly()) return c;
  const d = doc;
  c.append(btn(null, doc.researched ? "Research again" : "Research", () => researchAll(d)));
  const del = el("span");
  del.append(btn(null, "Delete", () => confirmRow(del, d.title, () => deleteDoc(d.id))));
  c.append(del);
  return c;
}

function patch(d, b){
  if(doc !== d || route !== "doc") return;
  const old = main.querySelector(`[data-block-id="${b.id}"]`);
  if(!old) return render();
  const fresh = blockEl(b, numberOf(d, b));
  old.replaceWith(fresh);
  typeset(fresh);
  layoutSidenotes();
  rehighlight();
}

/* Sidenotes sit in the right margin, level with the block they answer,
   pushed down only as far as the note above them requires.           */
function layoutSidenotes(){
  const d = main.querySelector(".doc");
  if(!d) return;
  const notes = d.querySelectorAll('.block[data-kind="note"]');
  d.style.paddingBottom = "";
  if(!notes.length) return;
  if(!matchMedia("(min-width:1240px)").matches){ notes.forEach(x => x.style.top = ""); return; }
  let floor = 0, deepest = 0;
  notes.forEach(x => {
    let a = x.previousElementSibling;
    while(a && a.dataset.kind === "note") a = a.previousElementSibling;
    const top = Math.max(a ? a.offsetTop : 0, floor);
    x.style.top = top + "px";
    floor = top + x.offsetHeight + 16;
    deepest = Math.max(deepest, floor);
  });
  const over = deepest - d.offsetHeight;
  if(over > 0) d.style.paddingBottom = over + "px";
}
let rsT = null;
addEventListener("resize", () => { cancelAnimationFrame(rsT); rsT = requestAnimationFrame(layoutSidenotes); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(layoutSidenotes);

/* ══ persistence ══════════════════════════════════════════════
   A document is saved the moment it is created, and after every change,
   so nothing that was asked for can vanish: a primer stopped, or closed,
   mid-way is in the library with its state, and can be resumed.       */
const TRANSIENT = ["busy","hl","pending","queued","error","stopped","fresh","plan","draw","find","live","liveRole","status","again"];
function cleanBlock(b){ const r = { ...b }; TRANSIENT.forEach(k => delete r[k]); return r; }
const saveT = new Map();
/* The words a reader would read: prose, headings, notes and captions. */
function wordCount(d){
  let n = 0;
  for(const b of d.blocks || []){
    const t = (b.kind === "figure" || b.kind === "image") ? (b.caption || "") : (b.md || "");
    if(t) n += plainMd(t).split(/\s+/).filter(Boolean).length;
  }
  return n;
}
/* Entries written before the count existed get one, from the saved primer. */
async function countWords(){
  const todo = index.filter(it => it.words == null);
  if(!todo.length) return;
  for(const it of todo){
    let words;
    try{ const d = await store.get("primer:doc:" + it.id); words = d ? wordCount(d) : 0; }
    catch(e){ return; }
    index = await store.index(it.id, { ...(index.find(x => x.id === it.id) || it), words });
  }
  if(route === "cover") renderLibrary();
}
async function persist(d){
  await store.set("primer:doc:"+d.id, { ...d, blocks: d.blocks.map(cleanBlock) });
  index = await store.index(d.id, { id:d.id, title:d.title, updated:Date.now(), status:d.status || "done", short:gaps(d).length, words:wordCount(d) });
  if(route === "cover") renderLibrary();
}
function save(d, now){
  d = d || doc; if(!d) return;
  clearTimeout(saveT.get(d.id));
  if(now) return persist(d);
  saveT.set(d.id, setTimeout(() => persist(d), 400));
}
async function loadDoc(id){
  if(docs.has(id)) return docs.get(id);
  const d = await store.get("primer:doc:"+id);
  if(!d) return null;
  docs.set(id, d);
  await resumable(d);
  return d;
}
async function openDoc(id){
  const d = await loadDoc(id);
  if(!d) return null;
  doc = d; undoStack = []; route = "doc";
  render();
  scrollTo(0, 0);
  return d;
}

/* A document back from storage: give every unfinished piece its error
   and a state the status row can explain. The reason comes from the
   trace: the call that failed, the one the closing page cut off, or no
   call at all because its turn never came.                          */
async function resumable(d){
  const t = await traceOf(d.id);
  const because = (b, what) => {
    const r = callFor(t, b);
    if(!r) return { error: what + " The page was closed before its turn came.", stopped:true };
    if(r.status === "error") return { error: what + " " + r.error, stopped:false };
    if(r.status === "lost") return { error: what + " The page was closed while it was being made.", stopped:true };
    if(r.status === "stopped") return { error: "Stopped.", stopped:true };
    return { error: what, stopped:true };
  };
  if(!d.blocks.some(b => b.kind === "heading")){
    const why = d.status === "failed"
      ? { error: "Couldn't plan this explainer." + (d.statusNote ? " " + d.statusNote : ""), stopped:false }
      : because({}, "The outline was never planned.");
    d.blocks = [{ id:uid(), kind:"prose", md:"", ...why }];
  }
  /* Sections after the first missing one were waiting for it, not lost. */
  const first = Math.min(...d.blocks.filter(b => b.slot && !b.md).map(b => b.sec));
  d.blocks.forEach(b => {
    if(b.md || b.src || b.error) return;
    if(b.slot){
      if(b.sec > first && !callFor(t, b)) Object.assign(b, { error:"Waits for section " + (first+1) + ".", stopped:true });
      else Object.assign(b, because(b, "Section " + (b.sec+1) + " wasn't written."));
    }else if((b.kind === "figure" || b.kind === "image") && b.brief){
      Object.assign(b, because(b, b.kind === "figure" ? "Diagram wasn't drawn." : "Image wasn't found."));
    }
  });
  if(d.status === "planning" || d.status === "writing" || d.status === "researching"){
    d.status = "stopped"; d.statusNote = "the page was closed";
  }
}
/* What the writers need, derived from the document itself. */
function docContext(d){
  const titles = d.blocks.filter(b => b.kind==="heading").map(headingTitle);
  return { titles, outline: outlineText(d), reader: readerText(d.known) };
}
async function deleteDoc(id){
  const d = docs.get(id);
  if(d) stopRun(d);
  index = await store.index(id, null);
  await store.del("primer:doc:"+id);
  await store.del("primer:raw:"+id);
  docs.delete(id); traces.delete(id); runs.delete(id);
  shelfSig = null;
  if(doc && doc.id === id){ doc = null; undoStack = []; route = "cover"; render(); scrollTo(0,0); }
  else renderLibrary();
}
function snapshot(){
  undoStack.push(JSON.parse(JSON.stringify(doc.blocks.map(cleanBlock))));
  if(undoStack.length > 30) undoStack.shift();
  toolsPaint();
}
function doUndo(){
  if(!undoStack.length || !doc || route!=="doc") return;
  doc.blocks = undoStack.pop();
  hideToast();
  render(); save();
}

/* ══ generation ═══════════════════════════════════════════════ */
/* Cheap progress: while a block is pending, the model's raw output so far is
   written into its slot. Kept on b.live so a full render() mid-stream keeps
   it; DOM updates are batched per frame and stop once the block is gone. */
const LIVE_TAIL = 1400;
function liveTail(s){ return s.length > LIVE_TAIL ? "…" + s.slice(-LIVE_TAIL) : s; }
/* The model answers in JSON, but nobody wants to watch JSON. While a section
   or a revision streams, show the prose inside its "md" strings, the last of
   them still open; while an outline streams, its title and section names.
   Anything else (a diagram's SVG, a finder's answer) shows as it is. */
const unesc =s => s.replace(/\\(u[0-9a-fA-F]{4}|.)/g, (m, c) => c === "n" ? "\n" : c === "t" ? "\t" : c[0] === "u" ? String.fromCharCode(parseInt(c.slice(1), 16)) : c);
function liveText(raw, role){
  raw = String(raw || "");
  if(role === "outline") return outlineLive(raw);
  if(role === "section" || role === "edit" || role === "define"){
    const parts = [...raw.matchAll(/"md"\s*:\s*"((?:[^"\\]|\\.)*)"/g)].map(m => m[1]);
    const open = /"md"\s*:\s*"((?:[^"\\]|\\.)*)$/.exec(raw);
    if(open) parts.push(open[1]);
    if(!parts.length) return null;
    return { prose:true, text: parts.map(unesc).join("\n\n") };
  }
  return { prose:false, text: liveTail(raw) };
}
/* The outline as it streams in: the title, then each section as it is
   named, and a section's subsections under it. Walks the partial JSON
   by nesting, so a string is placed by where it sits, not what it says. */
function outlineLive(raw){
  const stack = [], secs = [], colon = /\s*:/y;
  let key = null, title = null, i = 0;
  while(i < raw.length){
    const c = raw[i];
    if(c === "{" || c === "["){ stack.push(c); i++; continue; }
    if(c === "}" || c === "]"){ stack.pop(); key = null; i++; continue; }
    if(c !== '"'){ i++; continue; }
    let j = i + 1;
    while(j < raw.length && raw[j] !== '"'){ if(raw[j] === "\\") j++; j++; }
    const str = raw.slice(i + 1, j), closed = j < raw.length; i = j + 1;
    colon.lastIndex = i;
    if(closed && stack[stack.length - 1] === "{" && colon.test(raw)){ key = str; continue; }
    const v = unesc(str), at = stack.join("");
    if(at === "{" && key === "title") title = v;
    else if(at === "{[") secs.push({ title:v, subs:[] });
    else if(at === "{[{" && key === "title") secs.push({ title:v, subs:[] });
    else if(at === "{[{[" && secs.length) secs[secs.length - 1].subs.push(v);
    key = null;
  }
  if(title == null && !secs.length) return null;
  const lines = title == null ? [] : [title];
  secs.forEach((s, n) => {
    lines.push((n + 1) + ". " + s.title);
    s.subs.forEach((x, m) => lines.push("   " + (n + 1) + "." + (m + 1) + " " + x));
  });
  return { prose:true, text: lines.join("\n") };
}
function livePre(b){
  const v = liveText(b.live, b.liveRole);
  const pre = el("pre", "live" + (v && v.prose ? " prose" : ""));
  pre.textContent = v ? v.text : "";
  return pre;
}
function liveInto(d, b){
  let t = 0;
  return soFar => {
    b.live = soFar;
    if(t) return;
    t = requestAnimationFrame(() => {
      t = 0;
      popLive(d);
      if(route !== "doc" || doc !== d || !d.blocks.includes(b)) return;
      const body = main.querySelector(`[data-block-id="${b.id}"] .body`);
      if(!body) return;
      const old = body.querySelector(".live"), fresh = livePre(b);
      if(old) old.replaceWith(fresh); else body.appendChild(fresh);
    });
  };
}

/* A title is a label, not prose. A planner asked for "three paragraphs" may
   answer by putting the paragraphs in the outline, which would give every
   section a heading the size of a page and a contents list to match. Collapse
   the whitespace, drop any heading marks or numbering it added, and cut a
   runaway title at a word boundary so the layout holds whatever comes back. */
function trimTitle(s, max, fallback){
  let t = String(s == null ? "" : s).replace(/\s+/g, " ").trim()
    .replace(/^#+\s*/, "").replace(/^\d+\s*[.):]\s*/, "").replace(/^["“”']|["“”']$/g, "").trim();
  if(t.length > max){
    const cut = t.slice(0, max), at = cut.lastIndexOf(" ");
    t = (at > max / 2 ? cut.slice(0, at) : cut).replace(/[\s,;:.]+$/, "") + "…";
  }
  return t || fallback;
}

/* A new document, in the library at once and on screen unless it is
   made in the background, then written. A definition (the Definition
   brief, or Define on a selection) is written by the definer. */
function startDoc(o, background){
  const d = { id:uid(), title:o.topic, topic:o.topic, known:o.known || "", instruction:o.instruction || "",
              created:Date.now(), status:"planning", blocks:[] };
  if(o.rewrite) d.rewrite = o.rewrite;
  if(o.define) d.define = o.define;
  else if(BRIEFS.some(b => b.define && d.instruction.includes(b.text))) d.define = { term:o.topic };
  docs.set(d.id, d);
  if(!background){ undoStack = []; doc = d; route = "doc"; }
  build(d);
  if(!background) scrollTo(0, 0);
  return d;
}

/* Plan the outline, lay out the sections, then write them. */
async function build(d){
  const run = runOf(d); run.cancelled = false; run.active = true;
  d.status = "planning"; d.statusNote = "";
  d.blocks = [{ id:uid(), kind:"prose", pending:true, plan:true, md:"" }];
  rerender(d); save(d, true);

  const reader = readerText(d.known), rw = d.rewrite;
  let plan;
  if(rw && rw.sections && rw.sections.length){
    plan = { title: rw.ofTitle || d.topic, sections: rw.sections };
  }else if(d.define){
    plan = { title: d.topic, sections: ["Definition"] };   // the definer names it once it has read up
  }else try{
    const out = await agent(d, { role:"outline", label:"planning", block:d.blocks[0], by:"you",
      system: sys(rw ? "rewrite_outline" : "outline"),
      user: rw ? usr("rewrite_outline_user", { READER:reader, TOPIC:d.topic, INSTRUCTION:rw.instruction, SOURCE:rw.source })
               : usr("outline_user", { READER:reader, TOPIC:d.topic, INSTRUCTION:instrText(d) }) });
    plan = out.value; d.planCall = out.callId;
    if(!plan || !Array.isArray(plan.sections) || !plan.sections.length) throw new Error("The outline came back empty.");
  }catch(e){
    d.status = e.stopped ? "stopped" : "failed"; d.statusNote = e.stopped ? "" : e.message;
    d.blocks = [{ id:uid(), kind:"prose", md:"", stopped:!!e.stopped,
      error: e.stopped ? "Stopped before the outline was planned." : "Couldn't plan this explainer. " + e.message }];
    run.active = false;
    settle(d);
    return;
  }
  d.title = trimTitle(plan.title, 110, d.topic);
  /* A remark the planner had for the reader: an assumption it made, or a
     fault in the question. Most plans have none. */
  const note = String(plan.note || "").replace(/\s+/g, " ").trim().slice(0, 600);
  if(note) d.note = note; else delete d.note;
  d.blocks = [];
  plan.sections.forEach((raw, i) => {
    /* A section is its title, or {title, subsections} where the planner
       found a section that needs dividing. One subsection is none. */
    const o = raw && typeof raw === "object" ? raw : { title:raw };
    const title = trimTitle(o.title, 72, "Section " + (i + 1));
    const subs = (Array.isArray(o.subsections) ? o.subsections : [])
      .map(x => trimTitle(x && typeof x === "object" ? x.title : x, 72, "")).filter(Boolean);
    const h = { id:uid(), kind:"heading", md:"## "+title, sec:i, fresh:true };
    if(subs.length > 1) h.subs = subs;
    d.blocks.push(h);
    d.blocks.push({ id:uid(), kind:"prose", pending:true, queued:true, md:"", sec:i, slot:true });
  });
  d.status = "writing";
  rerender(d); save(d);
  await writeAll(d);
}

/* Resume after a stop, a failure, or a reload: plan if there is no outline,
   otherwise write whatever is still unwritten. */
function resume(d){
  if(running(d)) return;
  if(!d.blocks.some(b => b.kind === "heading")) return build(d);
  return writeAll(d);
}

/* Sections are written in order so each can build on the ones before it.
   Diagrams and images are made on a side queue and overlap with the next
   section. Then the research agent checks the text, if it is turned on.

   A section that does not come back is never skipped: the ones after it
   would be written without it in view, and nothing could put that right
   later. It is tried once more, and if it still fails the run halts there,
   with the rest marked as waiting. Resume, or any section's Retry, comes
   back through here and writes what is missing in order.               */
async function writeAll(d){
  const run = runOf(d); run.cancelled = false; run.active = true;
  const { titles, outline, reader } = docContext(d);
  d.status = "writing"; d.statusNote = "";
  save(d); livePaint();
  let halted = 0;   // the number of the section that failed, if one did
  for(let i = 0; i < titles.length; i++){
    if(run.cancelled) break;
    let slot = d.blocks.find(b => b.slot && b.sec===i);
    if(!slot || slot.md) continue;
    for(let attempt = 0; ; attempt++){
      Object.assign(slot, { pending:true, queued:false, error:"", stopped:false, raw:"", live:"" });
      patch(d, slot);
      await genSection(d, i, titles[i], outline, reader);
      /* The slot is gone once the section has landed; a failure leaves a new one. */
      slot = d.blocks.find(b => b.slot && b.sec===i);
      if(!slot || run.cancelled || attempt) break;
      await sleep(1500);
    }
    if(slot && !run.cancelled){ halted = i + 1; break; }
  }
  if(halted){
    d.blocks.filter(b => b.slot && !b.md && b.sec >= halted).forEach(b => markWaiting(d, b, halted));
    await run.side;
    d.status = "interrupted"; d.statusNote = "section " + halted + " didn't come back";
    run.active = false;
    settle(d);
    return;
  }
  if(!run.cancelled){
    d.blocks.filter(b => (b.kind==="figure" || b.kind==="image") && b.brief && !b.md && !b.src && !b.pending)
      .forEach(b => retryVisual(d, b, false));
  }
  await finish(d);
}
async function finish(d){
  const run = runOf(d);
  if(!run.cancelled && setting("research") && !d.researched) await research(d, "");
  await run.side;
  if(run.cancelled){
    d.blocks.filter(b => b.pending).forEach(b => markStopped(d, b));
    d.status = "stopped";
  }else{ d.status = "done"; d.statusNote = ""; }
  run.active = false;
  settle(d);
}
/* A run's end, whichever way it ended: shown, and written at once rather
   than soon, so a page closed the next moment reopens as it was. */
function settle(d){
  rerender(d); flushTrace(d.id); save(d, true); tidyRun(d);
}
/* A pending block whose call will never come: shown stopped, with Retry. */
function markStopped(d, b){
  b.pending = false; b.queued = false; b.stopped = true; b.live = "";
  b.error = "Stopped.";
  patch(d, b);
}
/* A section whose turn cannot come until section n is written. */
function markWaiting(d, b, n){
  b.pending = false; b.queued = false; b.stopped = true; b.live = "";
  b.error = "Waits for section " + n + ".";
  patch(d, b);
}

/* Everything already on the page before section i: headings, prose, and for
   each diagram or image its brief, plus its caption once it exists. */
function priorText(d, i){
  const parts = [];
  for(const b of d.blocks){
    if(b.sec == null || b.sec >= i) continue;
    if(b.kind === "heading" || b.kind === "subheading" || b.kind === "prose" || b.kind === "note"){ if(b.md) parts.push(b.md); }
    else if((b.kind === "figure" || b.kind === "image") && (b.brief || b.caption)){
      parts.push((b.kind === "figure" ? "[Diagram]" : "[Image]") + (b.brief ? "\nBrief: " + b.brief : "") + (b.caption ? "\nCaption: " + b.caption : ""));
    }
  }
  return parts.join("\n\n");
}

/* `by` is "you" when a person asked for this section again. Everything the
   writer makes remembers the call that made it (b.by), so the diagrams,
   images and source checks that follow can be filed under that call.    */
async function genSection(d, i, title, outline, reader, by){
  const slot = d.blocks.find(b => b.slot && b.sec===i);
  if(!slot) return;
  const h0 = d.blocks.find(b => b.kind==="heading" && b.sec===i), subs = (h0 && h0.subs) || [];
  const vars = { READER:reader, TITLE:d.title, OUTLINE:outline, N:i+1, SECTION:title,
                 PRIOR: priorText(d, i) || "(none yet)", INSTRUCTION: instrText(d),
                 SUBSECTIONS: subs.length ? "ITS SUBSECTIONS, FROM THE PLAN, EACH OPENED WITH A SUBHEADING ELEMENT:\n" + subs.map(x => "- " + x).join("\n") : "" };
  const df = d.define, role = df ? "define" : "section";
  const user = df ? usr("define_user", { READER:reader, TERM:d.topic, INSTRUCTION:instrText(d),
                      HIGHLIGHT: df.from ? df.term : "(nothing: the term was typed)",
                      FROM: df.from ? ", IN “" + df.from.title + "”" : "", CONTEXT: df.context || "(none)" })
             : d.rewrite ? usr("rewrite_section_user", { ...vars, INSTRUCTION:d.rewrite.instruction, SOURCE:d.rewrite.source })
             : usr("section_user", vars);
  try{
    const { value, callId } = await agent(d, { role, label: df ? "defining" : "writing §"+(i+1), sec:i, block:slot, system:sys(role), user,
      parent: d.planCall || null, by: by || (d.planCall ? "" : "you") });
    const arr = df && value && !Array.isArray(value) ? value.blocks : value;
    const made = (Array.isArray(arr) ? arr : [])
      .filter(x => x && (x.md || x.title || ((x.kind==="figure" || x.kind==="image") && x.brief)))
      .flatMap(x => {
        if(x.kind==="figure" && x.brief) return [{ id:uid(), kind:"figure", md:"", sec:i, brief:String(x.brief).trim(), pending:true, draw:true, by:callId }];
        if(x.kind==="image"  && x.brief) return [{ id:uid(), kind:"image",  md:"", sec:i, brief:String(x.brief).trim(), pending:true, find:true, by:callId }];
        if(x.kind==="subheading") return [subBlock(x.title || x.md, { sec:i, by:callId })];
        return proseBlocks(x.md, { sec:i, by:callId });
      });
    if(!made.some(b => b.kind === "prose" && b.md)) throw new Error("Empty section.");
    if(df && value && !Array.isArray(value)){
      if(value.title) d.title = trimTitle(value.title, 110, d.title);
      if(value.term) narrowLink(d, String(value.term).trim());
    }
    replaceSlot(d, i, made);
    /* New text, so the section is due a check again. */
    const h = d.blocks.find(b => b.kind==="heading" && b.sec===i);
    if(h) delete h.checked;
    save(d);
    made.filter(b => b.draw || b.find).forEach(b =>
      sideLater(d, b, () => b.draw ? genFigure(d, b, title, outline, reader) : genImage(d, b, title)));
  }catch(e){
    replaceSlot(d, i, [{ id:uid(), kind:"prose", md:"", sec:i, slot:true, stopped:!!e.stopped,
      error: e.stopped ? "Stopped." : "Section "+(i+1)+" didn't come back. "+e.message }]);
    save(d);
  }
}
/* Retry on a section writes every missing section, in order, so a section
   is never written ahead of one that is still missing. */
function retrySection(d, i){
  if(running(d)){ toast("Wait for " + docState(d).text + " first."); return; }
  resume(d);
}
function replaceSlot(d, i, blocks){
  const at = d.blocks.findIndex(b => b.slot && b.sec===i);
  if(at<0) return;
  d.blocks.splice(at, 1, ...blocks);
  rerender(d);
}
function swapBlock(d, id, blocks){
  const at = d.blocks.findIndex(b => b.id===id);
  if(at<0) return;
  d.blocks.splice(at, 1, ...blocks);
  rerender(d);
}

/* Diagrams and images are made one at a time, alongside the section being
   written. A stopped run marks what it never got to. */
function sideLater(d, b, fn){
  const run = runOf(d);
  run.side = run.side.then(async () => {
    if(run.cancelled){ markStopped(d, b); return; }
    await fn();
  }).catch(e => console.error(e));
}
/* A visual keeps its first id as `origin` through every retry, and `by`,
   the section call that asked for it, so its calls stay filed together. */
function failedVisual(d, f, e){
  return { id:uid(), origin:f.origin || f.id, by:f.by, kind:f.kind, md:"", sec:f.sec, brief:f.brief, stopped:!!e.stopped,
    error: e.stopped ? "Stopped."
         : (f.kind === "figure" ? "Diagram didn't come back. " : e.notFound ? "No suitable image was found. " : "The image search didn't come back. ") + e.message };
}
/* byYou: a person clicked Retry, rather than the run picking up leftovers. */
function retryVisual(d, b, byYou){
  const { titles, outline, reader } = docContext(d);
  const p = { id:uid(), origin:b.origin || b.id, by:b.by, kind:b.kind, md:"", sec:b.sec, brief:b.brief, pending:true, again: byYou ? "you" : "" };
  p[b.kind === "figure" ? "draw" : "find"] = true;
  swapBlock(d, b.id, [p]);
  runOf(d).cancelled = false;
  sideLater(d, p, () => (b.kind === "figure" ? genFigure(d, p, titles[b.sec] || "", outline, reader) : genImage(d, p, titles[b.sec] || ""))
    .then(() => { livePaint(); tidyRun(d); }));
}
/* The section's prose on either side of a visual's slot. */
function around(d, f){
  const idx = d.blocks.findIndex(b => b.id===f.id);
  const prose = b => b.kind==="prose" && b.md && b.sec===f.sec;
  return { idx,
    before: d.blocks.slice(0, idx).filter(prose).map(b=>b.md).join("\n\n"),
    after:  d.blocks.slice(idx+1).filter(prose).map(b=>b.md).join("\n\n") };
}

/* A figure the section writer asked for, queued as soon as that section's
   prose has landed. The illustrator sees the brief, the outline, and the
   whole section's prose, split at the slot. */
async function genFigure(d, f, sectionTitle, outline, reader){
  const { idx, before, after } = around(d, f);
  if(idx<0) return;
  const user = usr("figure_user", {
    READER: reader, TITLE: d.title, OUTLINE: outline, SECTION: sectionTitle,
    BEFORE: before || "(none)", AFTER: after || "(none)", BRIEF: f.brief
  });
  try{
    const { value:out } = await agent(d, { role:"figure", label:"drawing §"+(f.sec+1), sec:f.sec, block:f, system:sys("figure"), user,
      parent: f.by || null, by: f.again || "" });
    const x = ((out && out.blocks)||[]).find(b => b && b.md);
    if(!x) throw new Error("Empty response.");
    if(!/<svg[\s>]/i.test(String(x.md))) throw new Error("The answer had no <svg> in it.");
    const made = { id:uid(), origin:f.origin || f.id, by:f.by, kind:"figure", md:x.md, sec:f.sec, brief:f.brief, fresh:true };
    if(x.caption) made.caption = String(x.caption).trim();
    swapBlock(d, f.id, [made]);
    save(d);
  }catch(e){
    swapBlock(d, f.id, [failedVisual(d, f, e)]);
    save(d);
  }
}

/* An image the section writer asked for. The finder searches the web,
   looks at candidates until one passes, and answers with the one it chose;
   the server then keeps a copy under media/ so the page never hotlinks. */
async function genImage(d, f, sectionTitle){
  const { idx, before, after } = around(d, f);
  if(idx<0) return;
  const user = usr("finder_user", { TITLE:d.title, SECTION:sectionTitle, BEFORE: before || "(none)", AFTER: after || "(none)", BRIEF:f.brief });
  try{
    const { value:out } = await agent(d, { role:"finder", label:"finding image §"+(f.sec+1), sec:f.sec, block:f, system:sys("finder"), user,
      parent: f.by || null, by: f.again || "" });
    if(!out || !out.found || !out.url){
      const e = new Error(out && out.why ? String(out.why) : "Nothing suitable was found."); e.notFound = true; throw e;
    }
    const m = await saveMedia(String(out.url));
    const made = { id:uid(), origin:f.origin || f.id, by:f.by, kind:"image", md:"", sec:f.sec, brief:f.brief, fresh:true, src:m.local, url:String(out.url),
      page: out.page ? String(out.page) : "", title: out.title ? String(out.title).trim() : "",
      credit: out.credit ? String(out.credit).trim() : "", caption: out.caption ? String(out.caption).trim() : "",
      why: out.why ? String(out.why).trim() : "" };
    swapBlock(d, f.id, [made]);
    save(d);
  }catch(e){
    swapBlock(d, f.id, [failedVisual(d, f, e)]);
    save(d);
  }
}
async function saveMedia(url){
  const r = await fetch("/api/media", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ url }) });
  const j = await r.json().catch(() => ({}));
  if(!r.ok || !j.local) throw new Error("Couldn't fetch the chosen image. " + (j.error && j.error.message || r.status));
  return j;
}

/* ── research ─────────────────────────────── */
/* After the whole primer is written, one agent per section checks the key
   claims on the web. What it confirms gets a citation; what it refutes is
   rewritten in place, marked "corrected" in the margin with the reason and
   the source. The earlier wording is not kept.                          */
async function research(d, by){
  const run = runOf(d);
  const { titles } = docContext(d);
  d.status = "researching"; save(d); livePaint();
  for(let i = 0; i < titles.length; i++){
    if(run.cancelled) return;
    /* A section checked on an earlier, interrupted pass stays checked. */
    const h = d.blocks.find(b => b.kind==="heading" && b.sec===i);
    if(h && h.checked) continue;
    await researchSection(d, i, by);
  }
  if(!run.cancelled) d.researched = Date.now();
}
/* Filed under the call that wrote the section, when that is still known. */
async function researchSection(d, i, by){
  const heading = d.blocks.find(b => b.kind==="heading" && b.sec===i);
  const blocks = d.blocks.filter(b => b.sec===i && b.kind==="prose" && b.md && !b.slot);
  if(!heading || !blocks.length) return;
  heading.status = "checking"; heading.fail = ""; patch(d, heading);
  try{
    const { value } = await agent(d, { role:"research", label:"checking §"+(i+1), sec:i, system:sys("research"),
      parent: (blocks.find(b => b.by) || {}).by || null, by: by || "",
      user: usr("research_user", { TITLE:d.title, SECTION:headingTitle(heading),
        BLOCKS: blocks.map((b,k) => "[" + (k+1) + "]\n" + b.md).join("\n\n") }) });
    heading.status = ""; heading.checked = Date.now();
    applyResearch(d, blocks, value || {});
  }catch(e){
    heading.status = "";
    heading.fail = e.stopped ? "" : "Sources weren't checked. " + e.message;
    patch(d, heading); save(d);
  }
}
function applyResearch(d, blocks, out){
  blocks.forEach(b => { delete b.cites; });
  for(const c of (Array.isArray(out.citations) ? out.citations : [])){
    const b = blocks[(c.block|0) - 1];
    if(!b || !c.url) continue;
    (b.cites = b.cites || []).push({ claim:String(c.claim||"").trim(), url:String(c.url), title:String(c.title||"").trim(), note:String(c.note||"").trim() });
  }
  for(const c of (Array.isArray(out.corrections) ? out.corrections : [])){
    const b = blocks[(c.block|0) - 1];
    if(!b || !c.md) continue;
    b.md = String(c.md);
    b.edit = { label:"Corrected", note:String(c.reason||"").trim(), url:String(c.url||""), ts:Date.now(), by:"research" };
    b.fresh = true;
  }
  /* Terms linked to the web, when the research prompt asks for it: a term
     is linked once in the primer, at its first mention. */
  for(const l of (Array.isArray(out.links) ? out.links : [])){
    const b = blocks[(l.block|0) - 1], text = String(l.text || ""), url = String(l.url || "");
    if(!b || !text || !/^https?:\/\//.test(url) || d.blocks.some(x => x.md && x.md.includes("](" + url + ")"))) continue;
    if(linkWords(b, text, url)) b.fresh = true;
  }
  rerender(d); save(d);
}
/* Run, or run again, on demand from the colophon. */
async function researchAll(d){
  if(running(d)) return;
  const run = runOf(d); run.cancelled = false; run.active = true;
  delete d.researched;
  d.blocks.forEach(b => { if(b.kind === "heading") delete b.checked; });
  rerender(d); livePaint();
  await research(d, "you");
  d.status = run.cancelled ? "stopped" : "done";
  d.statusNote = run.cancelled ? "while checking sources" : "";
  run.active = false;
  settle(d);
}

/* ══ define ═══════════════════════════════════════════════════
   A new primer on the highlighted words, written in the background and
   linked from them, the way an encyclopedia links a term to its article.
   The definer names the concept and picks the words to link; until then
   the whole selection is the link. Links to other primers are Markdown
   in the block, primer:<id>, so they survive everything a block does. */
const DEFINE = BRIEFS.find(b => b.define);
function defineFrom(d, blockId, text){
  const b = d.blocks.find(x => x.id === blockId);
  if(!b || !b.md) return;
  const def = startDoc({ topic:text, known:d.known, instruction:DEFINE.text,
    define:{ term:text, from:{ doc:d.id, block:b.id, title:d.title }, context:b.md } }, true);
  snapshot();
  if(linkWords(b, text, "primer:" + def.id)){ patch(d, b); save(d); toast("Defining “" + text + "”", { undo:true }); }
  else toast("Defining “" + text + "”. Those exact words weren't found in the text, so there is no link.");
}
/* The first plain occurrence of `text` in a block becomes a link. */
function linkWords(b, text, href){
  const i = b.md.indexOf(text);
  if(i < 0 || b.md.lastIndexOf("[", i) > b.md.lastIndexOf("]", i)) return false;
  b.md = b.md.slice(0, i) + "[" + text + "](" + href + ")" + b.md.slice(i + text.length);
  return true;
}
/* Once the definer has said which words name the concept, the link in the
   primer it came from shrinks to them. */
async function narrowLink(d, term){
  const f = d.define.from, was = d.define.term;
  const at = was.indexOf(term);
  if(!f || at < 0 || term === was) return;
  const o = await loadDoc(f.doc), b = o && o.blocks.find(x => x.id === f.block);
  const old = "[" + was + "](primer:" + d.id + ")", i = b ? b.md.indexOf(old) : -1;
  if(i < 0) return;
  b.md = b.md.slice(0, i) + was.slice(0, at) + "[" + term + "](primer:" + d.id + ")" + was.slice(at + term.length) + b.md.slice(i + old.length);
  d.define.term = term;
  patch(o, b); save(o);
}
/* Prose without its links to other primers, for anyone who cannot follow them. */
const plainLinks = md => String(md).replace(/\[([^\]]*)\]\(primer:\w+\)/g, "$1");
/* Links in prose: one to another primer opens it here, with a preview on
   hover; one to the web opens in a new tab. */
function wireLinks(body){
  body.querySelectorAll("a[href]").forEach(a => {
    const m = /^primer:(\w+)$/.exec(a.getAttribute("href"));
    if(!m){ if(/^https?:/.test(a.href)){ a.target = "_blank"; a.rel = "noopener"; } return; }
    const id = m[1];
    a.className = "plink"; a.dataset.primer = id; a.href = "#";
    a.onclick = async e => { e.preventDefault(); closePops(); if(!(await openDoc(id))) toast("That primer was deleted."); };
    hoverable(a, () => defNodes(id));
  });
}
/* What a link to another primer leads to: its title, where it stands, and
   its opening words, kept current while it is being written. */
function defNodes(id){
  const d = docs.get(id);
  if(!d){ loadDoc(id).then(x => popLive(x || { id, gone:true })); return [kRow("Primer"), el("div", "s", "Loading…")]; }
  if(d.gone) return [kRow("Primer"), el("div", "s", "That primer was deleted.")];
  const st = docState(d), first = d.blocks.find(b => b.kind === "prose" && (b.md || b.live));
  const text = first ? (first.md || (liveText(first.live, first.liveRole) || {}).text || "") : "";
  const nodes = [kRow("Primer", d.created), el("div", "t", d.title)];
  if(st.kind !== "done"){ const line = el("div", "s"); if(st.kind === "busy") line.append(el("i", "dot")); line.append(st.text); nodes.push(line); }
  if(text){ const p = el("div", "prev"); p.innerHTML = mdInline(plainLinks(text).slice(0, 420) + (text.length > 420 ? "…" : "")); nodes.push(p); }
  nodes.push(linkRow([{ label:"Open", onclick:() => { closePops(); openDoc(id); } }]));
  return nodes;
}
/* Redraw the preview of a primer while its card is up. */
function popLive(d){
  if(pop.classList.contains("show") && pop._anchor && pop._anchor.dataset.primer === d.id) pop.replaceChildren(...defNodes(d.id));
}

/* ══ editing ══════════════════════════════════════════════════ */
function context(d, idx){
  const outline = outlineText(d);
  const before = d.blocks.slice(Math.max(0,idx-2), idx).map(b=>b.md).join("\n\n");
  const after  = d.blocks.slice(idx+1, idx+3).map(b=>b.md).join("\n\n");
  return { outline, before, after };
}

async function applyEdit(blockId, act, question){
  const d = doc;
  const idx = d.blocks.findIndex(b => b.id===blockId);
  if(idx<0) return;
  const target = d.blocks[idx];
  const a = ACTIONS[act];
  const highlighted = (sel && sel.blockId===blockId && sel.text) ? sel.text : target.md;

  snapshot();
  target.busy = act;
  target.hl = (sel && sel.blockId===blockId && sel.text) ? sel.text : "";
  inFlight++;
  patch(d, target);

  /* Edit on a diagram goes to the illustrator and redraws it in place; on a
     heading it renames the section; on prose it is a revision like the rest. */
  const drawing = act==="figure" || (act==="revise" && target.kind==="figure");
  const heading = target.kind === "heading" || target.kind === "subheading";
  let action = rawPrompt(act==="figure" ? "figure_action" : act);
  if(act==="revise" && drawing) action = "Redraw this diagram as the reader directs, keeping everything they did not ask to change. Return one figure block with its caption.";
  else if(heading) action += "\nThe target is a section heading. Return mode \"replace\" with one prose block whose md is the new heading text alone: a short noun phrase, no markdown marks.";
  const { outline, before, after } = context(d, idx);
  const user = usr("edit_user", {
    READER: readerText(d.known),
    TITLE: d.title,
    OUTLINE: outline,
    BEFORE: before || "(none)",
    TARGET: target.md + (drawing && target.caption ? "\n\nCaption: " + target.caption : ""),
    AFTER: after || "(none)",
    HIGHLIGHT: highlighted,
    QUESTION: question || "(nothing)",
    ACTION: action
  });
  const role = drawing ? "figure" : "edit";
  const secLabel = target.sec != null ? " §" + (target.sec+1) : "";

  try{
    const { value:out } = await agent(d, { role, label: word(a) + secLabel, sec:target.sec, system:sys(role), user, by:"you" });
    const blocks = ((out && out.blocks)||[]).filter(x => x && (x.md || x.title));
    if(!blocks.length) throw new Error("Empty response.");
    const stamp = { label:a.label, note:question||"", quote:highlighted.slice(0,220), ts:Date.now() };
    /* The reviser may open a subsection for what it adds; a heading it left
       inside prose becomes one as well. */
    const made = blocks.flatMap(x => {
      const base = { sec:target.sec, edit:stamp };
      if(drawing){
        const b = { id:uid(), kind:"figure", md:x.md, fresh:true, ...base };
        if(x.caption) b.caption = String(x.caption).trim();
        return [b];
      }
      if(x.kind==="subheading") return [subBlock(x.title || x.md, base)];
      if(x.kind==="note") return [{ id:uid(), kind:"note", md:x.md, fresh:true, ...base }];
      return proseBlocks(x.md, base);
    });
    if(!made.length) throw new Error("Empty response.");
    target.busy = false; delete target.hl; inFlight--; clearHighlight();
    const at = d.blocks.indexOf(target);
    const replaced = act==="figure" ? false : act==="revise" && drawing ? true : out.mode==="replace";
    let landed = made[0];
    if(heading && replaced){
      /* A heading stays the block it is; it takes the new title. */
      const t = made.find(b => b.kind === "prose" && b.md);
      target.md = (target.kind === "heading" ? "## " : "### ") + trimTitle(t ? t.md : "", 72, headingTitle(target));
      target.edit = stamp; target.fresh = true; landed = target;
    }
    else if(at < 0) d.blocks.push(...made);
    else if(replaced) d.blocks.splice(at, 1, ...made);
    else d.blocks.splice(at+1, 0, ...made);
    if(doc === d && route === "doc"){
      render();
      const first = main.querySelector(`[data-block-id="${landed.id}"]`);
      if(first) first.scrollIntoView({block:"nearest", behavior:"smooth"});
    }
    save(d);
    toast(replaced ? "Replaced" : "Added", { undo:true });
  }catch(e){
    target.busy = false; delete target.hl; inFlight--; clearHighlight();
    if(doc === d) undoStack.pop();
    patch(d, target);
    toolsPaint();
  }finally{
    tidyRun(d); livePaint();
  }
}

/* ══ the pen ══════════════════════════════════════════════════ */
/* Keep the chosen span visibly marked while its revision is in flight.
   CSS Custom Highlight API: no DOM changes, so KaTeX and markup are safe.
   The block is re-rendered when it goes busy, so the span is found again
   by text inside the fresh element.                                   */
const canHighlight = typeof CSS !== "undefined" && CSS.highlights && typeof Highlight === "function";
function clearHighlight(){ if(canHighlight) CSS.highlights.delete("pen"); }
function highlightRange(range){ if(canHighlight && range) CSS.highlights.set("pen", new Highlight(range)); }
/* Find `text` in root's text nodes, tolerant of whitespace; a Range or null. */
function locate(root, text){
  if(!root || !text) return null;
  const nodes = [], walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n, all = "";
  while((n = walker.nextNode())){ nodes.push({ n, start: all.length }); all += n.textContent; }
  let i = all.indexOf(text);
  if(i < 0){
    const squash = s => s.replace(/\s+/g, " ");
    const map = []; let sq = "";
    for(let k = 0; k < all.length; k++){
      const c = /\s/.test(all[k]) ? " " : all[k];
      if(c === " " && sq.endsWith(" ")) continue;
      map.push(k); sq += c;
    }
    const want = squash(text).trim();
    const j = want ? sq.indexOf(want) : -1;
    if(j < 0) return null;
    i = map[j];
    text = all.slice(i, map[j + want.length - 1] + 1);
  }
  const at = pos => { let last = nodes[0]; for(const x of nodes){ if(x.start > pos) break; last = x; } return last; };
  const a = at(i), b = at(i + text.length - 1);
  if(!a || !b) return null;
  const r = document.createRange();
  r.setStart(a.n, i - a.start); r.setEnd(b.n, i + text.length - b.start);
  return r;
}
function highlightIn(root, text){ if(canHighlight) highlightRange(locate(root, text)); }
function readSelection(){
  if(route !== "doc") return null;
  const s = window.getSelection();
  if(!s || s.isCollapsed || !s.rangeCount) return null;
  const text = s.toString().trim();
  if(text.length < 2) return null;
  let n = s.anchorNode;
  if(n && n.nodeType===3) n = n.parentElement;
  const block = n && n.closest ? n.closest("[data-block-id]") : null;
  if(!block || block.classList.contains("pending") || block.classList.contains("busy")) return null;
  if(block.dataset.kind === "image") return null;
  return { blockId: block.dataset.blockId, text, rect: s.getRangeAt(0).getBoundingClientRect() };
}
function placeTools(rect){
  pen.classList.add("show");
  if(docked()){ pen.style.left = ""; pen.style.top = ""; return; }
  const w = pen.offsetWidth, h = pen.offsetHeight;
  let x = rect.left + window.scrollX + rect.width/2 - w/2;
  x = Math.max(8, Math.min(x, document.documentElement.clientWidth - w - 8));
  let y = rect.top + window.scrollY - h - 10;
  const headH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--head")) * 16 || 58;
  if(y < window.scrollY + headH + 4) y = rect.bottom + window.scrollY + 10;
  pen.style.left = x+"px"; pen.style.top = y+"px";
}
let inFlight = 0;   // revisions in flight, whose highlight must stay
function hideTools(){ pen.classList.remove("show","asking"); askInput.value = ""; if(!inFlight) clearHighlight(); }
function showForSelection(){
  const s = readSelection();
  if(!s){ if(!pen.classList.contains("asking")) hideTools(); return; }
  sel = s; placeTools(s.rect);
}
document.addEventListener("mouseup", e => {
  if(pen.contains(e.target) || pop.contains(e.target)) return;
  setTimeout(showForSelection, 10);
});
document.addEventListener("keyup", e => {
  if(!e.shiftKey) return;
  const s = readSelection();
  if(s){ sel = s; placeTools(s.rect); }
});
let selT = null;
document.addEventListener("selectionchange", () => {
  if(!matchMedia("(pointer:coarse)").matches) return;
  clearTimeout(selT); selT = setTimeout(showForSelection, 350);
});
document.addEventListener("mousedown", e => {
  if(!pen.contains(e.target) && !pop.contains(e.target)) hideTools();
  if(!pop.contains(e.target)) closePop();
  if(!menuOwns(shareMenu, e.target)) closeMenu(shareMenu);
  if(!menuOwns(rewriteMenu, e.target)) closeMenu(rewriteMenu);
  if(!menuOwns(feedbackMenu, e.target)) closeMenu(feedbackMenu);
});
function trigger(act){
  if(!sel) return;
  if(act==="define"){ const {blockId, text} = sel; hideTools(); defineFrom(doc, blockId, text); return; }
  /* Ask, Edit and Complain take a line of text first: the same field,
     worded for each. A complaint goes to Alexander, not to the model. */
  if(act==="ask" || act==="revise" || act==="complain"){
    const s = window.getSelection();
    if(s && s.rangeCount) highlightRange(s.getRangeAt(0).cloneRange());
    pen.dataset.mode = act;
    askInput.placeholder = act==="ask" ? "Ask about this…" : act==="revise" ? "What should change?" : "What's wrong here? This goes to Alexander.";
    askInput.setAttribute("aria-label", act==="ask" ? "Question" : act==="revise" ? "Instruction" : "Complaint");
    $("#askGo").textContent = act==="ask" ? "Ask" : act==="revise" ? "Edit" : "Send";
    pen.classList.add("asking"); askInput.focus(); return;
  }
  const {blockId} = sel;
  hideTools();
  applyEdit(blockId, act, "");
}
pen.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if(b) trigger(b.dataset.act);
});
$("#askForm").onsubmit = e => {
  e.preventDefault();
  const q = askInput.value.trim();
  if(!q || !sel) return;
  const {blockId, text} = sel, mode = pen.dataset.mode || "ask";
  hideTools();
  if(mode === "complain"){
    const b = doc && doc.blocks.find(x => x.id === blockId);
    const h = b && b.sec != null && doc.blocks.find(x => x.kind === "heading" && x.sec === b.sec);
    sendFeedback("complaint", q, { block:blockId, quote:text, passage: b && b.md ? String(b.md) : "", section: h ? headingTitle(h) : "" });
    return;
  }
  applyEdit(blockId, mode, q);
};
askInput.onkeydown = e => {
  if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); pen.classList.remove("asking"); askInput.value=""; clearHighlight(); }
};

/* ══ popovers ═════════════════════════════════════════════════
   One card, many contents: the provenance of a revision, the source of an
   image, the source behind a citation. Click pins it; hover shows it while
   the pointer is on the anchor or the card.                           */
function showPop(anchor, nodes, o){
  closePops();
  pop.replaceChildren(...nodes);
  pop.dataset.hover = (o && o.hover) ? "1" : "";
  pop.classList.add("show");
  anchor.setAttribute("aria-expanded", "true");
  pop._anchor = anchor;
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth;
  let x = r.left + window.scrollX - 4;
  x = Math.max(8, Math.min(x, document.documentElement.clientWidth - w - 8));
  pop.style.left = x + "px";
  pop.style.top  = (r.bottom + window.scrollY + 8) + "px";
}
function closePop(){
  if(pop._anchor){ pop._anchor.removeAttribute("aria-expanded"); pop._anchor = null; }
  pop.classList.remove("show");
  pop.dataset.hover = "";
}
let hoverT = null;
function hoverable(anchor, build){
  anchor.addEventListener("mouseenter", () => {
    clearTimeout(hoverT);
    hoverT = setTimeout(() => { const nodes = pop._anchor !== anchor && build(); if(nodes) showPop(anchor, nodes, { hover:true }); }, 140);
  });
  anchor.addEventListener("mouseleave", leavePop);
}
function leavePop(){
  clearTimeout(hoverT);
  hoverT = setTimeout(() => { if(pop.dataset.hover && !pop.matches(":hover")) closePop(); }, 220);
}
pop.addEventListener("mouseenter", () => clearTimeout(hoverT));
pop.addEventListener("mouseleave", () => { if(pop.dataset.hover) leavePop(); });

function linkRow(items){
  const row = el("div", "row");
  items.forEach(x => {
    if(!x) return;
    if(x.href){ const a = webLink(x.label, x.href); a.append(el("span", "host", host(x.href))); row.append(a); }
    else row.append(btn(null, x.label, x.onclick));
  });
  return row;
}
function kRow(label, ts){
  const k = el("div", "k", label);
  if(ts){ const t = el("time", null, timeAgo(ts)); t.dateTime = new Date(ts).toISOString(); k.appendChild(t); }
  return k;
}
/* A revision: who asked for it and why; a research correction: the reason and its source. */
function provNodes(b){
  const e = b.edit, nodes = [kRow(e.label, e.ts)];
  if(e.by === "research"){
    nodes.push(el("div", "s", e.note || "The research agent corrected this block."));
    nodes.push(linkRow([ e.url && { label:"Source", href:e.url } ]));
  }else{
    if(e.note || e.quote) nodes.push(el("div", "q", e.note ? e.note : "“" + e.quote + "”"));
    if(!readonly()) nodes.push(linkRow([{ label:"Remove", onclick:() => {
      snapshot();
      doc.blocks = doc.blocks.filter(x => x.id!==b.id);
      closePops(); render(); save();
      toast("Removed", { undo:true });
    } }]));
  }
  return nodes;
}
/* An image the finder chose: what it is, where it came from, why it passed. */
function sourceNodes(b){
  const nodes = [kRow("Found online")];
  if(b.title) nodes.push(el("div", "t", b.title));
  if(b.credit) nodes.push(el("div", "s", b.credit));
  if(b.why) nodes.push(el("div", "q", b.why));
  nodes.push(linkRow([ b.page && { label:"Page", href:b.page }, b.url && { label:"Image", href:b.url } ]));
  return nodes;
}
/* A citation: the source and what it says about the claim. */
function citeNodes(c, n){
  const nodes = [kRow("Source " + n)];
  if(c.title) nodes.push(el("div", "t", c.title));
  if(c.note) nodes.push(el("div", "s", c.note));
  if(c.claim) nodes.push(el("div", "q", "“" + c.claim + "”"));
  nodes.push(linkRow([{ label:"Open", href:c.url }]));
  return nodes;
}
function closePops(){
  closePop();
  closeMenu(shareMenu);
  closeMenu(rewriteMenu);
}

/* ══ menus ════════════════════════════════════════════════════ */
/* A menu hangs from the button that opened it, and remembers which one;
   that button again closes it instead, and openMenu says so with false. */
function openMenu(m, anchor, nodes){
  if(m.classList.contains("show") && m._anchor === anchor){ closeMenu(m); return false; }
  closePops();
  m.replaceChildren(...nodes);
  m.classList.add("show");
  anchor.setAttribute("aria-expanded", "true");
  m._anchor = anchor;
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, vw = document.documentElement.clientWidth;
  let x = r.left < vw / 2 ? r.left - 4 : r.right - w;
  x = Math.max(8, Math.min(x, vw - w - 8));
  m.style.left = (x + window.scrollX) + "px";
  m.style.top  = (r.bottom + window.scrollY + 6) + "px";
  return true;
}
/* A row of a menu: closes it, then acts. */
function menuItem(m, label, fn){
  const b = btn(null, label, () => { closeMenu(m); fn(); });
  b.setAttribute("role", "menuitem");
  return b;
}
function closeMenu(m){
  m.classList.remove("show");
  if(m._anchor){ m._anchor.setAttribute("aria-expanded", "false"); m._anchor = null; }
}
const menuOwns = (m, target) => m.contains(target) || !!(m._anchor && m._anchor.contains(target));

/* Settings, the Inspector and the guide are each a step away from where
   you were, and Back (or the same button again) returns. */
const backRoute = () => doc ? (doc.shared ? "shared" : "doc") : me ? "cover" : "login";
function goto(r){
  if(route === r){ goBack(); return; }
  route = r; render(); scrollTo(0, 0);
}
/* Back goes to the page before this one in the browser's history when
   Primer put it there, so the browser's own Back agrees with it. */
function goBack(){
  if(history.state && history.state.i > 0){ history.back(); return; }
  route = backRoute(); render(); scrollTo(0, 0);
}

/* ══ addresses ════════════════════════════════════════════════
   Every page has an address, a title, and a place in the browser's
   history: a primer at /p/<id>, its Inspector under that, Settings at
   /settings, the guide at /guide, a shared primer at /s/<id>. Back and
   Forward move between them, and a reload reopens the same page.      */
function pageUrl(){
  if(route === "shared" || route === "missing") return doc && doc.shared ? "/s/" + doc.shared.id : location.pathname;
  if(route === "guide") return "/guide";
  if(route === "settings") return "/settings";
  if((route === "doc" || route === "inspector") && doc) return "/p/" + doc.id + (route === "inspector" ? "/inspector" : "");
  return "/";
}
function pageTitle(){
  if(route === "settings") return "Settings · primer";
  if(route === "guide") return "Setup guide · primer";
  if(route === "missing") return "Link not found · primer";
  if(route === "login") return "Sign in · primer";
  if(route === "inspector" && doc) return "Inspector · " + doc.title + " · primer";
  if(onDoc()) return doc.title + " · primer";
  return "primer";
}
/* Each page Primer moves to becomes a history entry, numbered from the
   one it was opened on; drawing the same page again changes nothing. */
let popping = false;
function syncHistory(){
  if(popping) return;
  const st = { route, doc: doc && !doc.shared ? doc.id : null, share: doc && doc.shared ? doc.shared.id : null };
  const cur = history.state, url = pageUrl();
  if(cur && cur.route === st.route && cur.doc === st.doc && cur.share === st.share){
    if(location.pathname !== url) history.replaceState(cur, "", url);
    return;
  }
  st.i = cur && cur.i != null ? cur.i + 1 : 0;
  if(st.i) history.pushState(st, "", url); else history.replaceState(st, "", url);
}
addEventListener("popstate", async e => {
  const st = e.state;
  if(!st) return;
  popping = true;
  try{
    closePops(); hideTools();
    if(st.route === "shared" && st.share){
      if(doc && doc.shared && doc.shared.id === st.share){ route = "shared"; render(); }
      else await openShared(st.share);
    }else{
      if(!st.doc) doc = null;
      else if(!(doc && doc.id === st.doc)){ doc = (await loadDoc(st.doc)) || null; undoStack = []; }
      route = !me && st.route !== "guide" ? "login" : st.route === "login" && me ? "cover" : st.route;
      if((route === "doc" || route === "inspector") && !doc) route = "cover";
      render();
    }
    scrollTo(0, 0);
  }finally{ popping = false; }
});
/* The address the page was opened at, honoured once someone is signed in. */
let landing = location.pathname;
async function openLanding(){
  const p = landing; landing = null;
  const at = p && /^\/p\/([\w-]+)(\/inspector)?$/.exec(p);
  if(at){
    const d = await openDoc(at[1]);
    if(d && at[2]){ route = "inspector"; render(); }
    else if(!d) toast("That primer isn't in this library.");
  }else if(p === "/settings"){ route = "settings"; render(); }
}
settingsBtn.onclick = () => goto("settings");
backBtn.onclick = goBack;
newBtn.onclick = goHome;
$("#homeBtn").onclick = goHome;
function goHome(){
  if(route === "login") return;
  doc = null; undoStack = []; aboutOpen = false; route = me ? "cover" : "login"; render(); scrollTo(0,0);
  const t = $("#cTopic"); if(t && !matchMedia("(pointer:coarse)").matches) t.focus();
}

/* ══ sharing ══════════════════════════════════════════════════
   A link is the primer as it is at that moment, frozen on the server:
   the reader sees exactly this page, and later changes here never reach
   it. Sharing again with nothing changed gives the same link back.    */
const SHARE_PATH = /^\/s\/([\w-]+)$/;
function sharePath(){ const m = SHARE_PATH.exec(location.pathname); return m ? m[1] : null; }
const shareUrl = id => location.origin + "/s/" + id;
/* A frozen link: the server copies the primer as it is stored this moment,
   so it is saved first. What a reader gets of it is the server's to say;
   only the cost line, which comes from the trace, goes along. */
async function shareDoc(d, anchor){
  let s;
  try{ await save(d, true); s = await api("/api/share", { of:d.id, usage:usageText(usageOf(d)) }); }
  catch(e){ toast("Couldn't make a link: " + e.message, { err:true }); return; }
  copyLink(shareUrl(s.id), anchor);
}
/* Put the link on the clipboard; where that is refused, show it selected
   so it can be copied by hand. */
function copyLink(url, anchor){
  closePops();
  return copyText(url, () => {
    const at = (anchor && anchor.isConnected) ? anchor : main.querySelector(".m-tools .act");
    if(!at){ toast(url); return null; }
    const u = el("span", "url", url);
    openMenu(shareMenu, at, [u, linkRow([{ label:"Open", href:url }])]);
    return u;
  }, "Link copied");
}
async function openShare(anchor){
  const d = doc;
  if(readonly()){ openMenu(shareMenu, anchor, [menuItem(shareMenu, "Copy link", () => copyLink(location.href, anchor))]); return; }
  /* The public link follows the primer: readers see it as it is now and as
     it changes. A frozen copy stays as it was the day it was made. */
  const pub = el("div", "pub"), sw = btn("switch"), lab = el("span", null, "Public link");
  sw.setAttribute("role", "switch"); sw.setAttribute("aria-label", "Public link"); sw.append(el("i"));
  const pubLink = el("div", "links"), links = el("div", "links");
  const hint = el("span", "hint under", "Live updating");
  pub.append(lab, sw);
  const freeze = menuItem(shareMenu, "Copy a frozen link", () => shareDoc(d, anchor));
  freeze.title = "A copy of the primer as it is this moment; later changes never reach it.";
  const rule = el("div", "rule");
  if(!openMenu(shareMenu, anchor, [pub, hint, pubLink, rule, freeze, links])) return;
  let live = null;
  const paint = () => {
    sw.setAttribute("aria-checked", String(!!live));
    pubLink.replaceChildren();
    if(!live) return;
    /* The address is the whole control: a click copies it; a middle click
       or a right click opens it as any link. */
    const u = el("a", "url", shareUrl(live.id)); u.href = shareUrl(live.id); u.title = "Copy";
    u.onclick = ev => { ev.preventDefault(); copyLink(shareUrl(live.id), anchor); };
    pubLink.append(u);
  };
  sw.onclick = async () => {
    sw.disabled = true;
    try{
      if(live){ await api("/api/share/" + live.id, null, "DELETE"); live = null; paint(); toast("The link no longer opens"); }
      else{
        live = await api("/api/share", { of:d.id, live:true, title:d.title }); paint();
        navigator.clipboard.writeText(shareUrl(live.id)).then(() => toast("Public link copied"), () => toast("The link is public"));
      }
    }catch(e){ toast("Couldn't change that: " + e.message, { err:true }); }
    sw.disabled = false;
  };
  let list = [];
  try{ list = (await api("/api/shares?doc=" + encodeURIComponent(d.id))).shares || []; }catch(e){}
  if(!shareMenu.classList.contains("show") || doc !== d) return;
  live = list.find(s => s.live) || null; paint();
  list.filter(s => !s.live).forEach(s => {
    const row = el("div", "linkrow");
    const b = btn(null, "Link from " + timeAgo(s.created), () => copyLink(shareUrl(s.id), anchor));
    b.setAttribute("role", "menuitem"); b.title = shareUrl(s.id);
    const rm = btn("rm", "Remove", async () => {
      try{ await api("/api/share/" + s.id, null, "DELETE"); row.remove(); toast("Link removed"); }
      catch(e){ toast("Couldn't remove it: " + e.message, { err:true }); }
    });
    row.append(b, rm);
    links.append(row);
  });
}
/* Export: the primer as a file, by way of the same menu element. */
function openExport(anchor){
  const d = doc;
  openMenu(shareMenu, anchor, [
    menuItem(shareMenu, "Save as PDF", () => printDoc(d)),
    menuItem(shareMenu, "Download Markdown", () => exportDoc(d)),
    menuItem(shareMenu, "Copy as Markdown", () => copyText(docMarkdown(d)))
  ]);
}
/* Reading a shared primer: fetch the frozen copy and show it, signed in
   or not. The copy carries who shared it and when. */
async function openShared(id){
  let s;
  try{ s = await api("/api/share/" + id); }
  catch(e){
    doc = null;
    if(e.status === 404){ route = "missing"; render(); return; }
    route = me ? "cover" : "login"; render();
    toast("Couldn't open that link: " + e.message, { err:true });
    return;
  }
  doc = { ...s.doc, id:"share:" + s.id, shared:{ id:s.id, by:s.by, created:s.created, live:!!s.live } };
  undoStack = []; route = "shared";
  render();
  scrollTo(0, 0);
  if(s.live) watchShared(s.id);
}
/* A live link is read again while it is on screen: often while the primer
   is still being made, now and then once it is done. Only a change redraws. */
let watchT = 0;
function watchShared(id){
  clearTimeout(watchT);
  const busy = doc && /^(planning|writing|researching)$/.test(doc.status);
  watchT = setTimeout(async () => {
    if(route !== "shared" || !doc || !doc.shared || doc.shared.id !== id) return;
    try{
      const s = await api("/api/share/" + id);
      if(route !== "shared" || !doc || doc.shared.id !== id) return;
      const fresh = { ...s.doc, id:"share:" + s.id, shared:{ id:s.id, by:s.by, created:s.created, live:!!s.live } };
      if(JSON.stringify(fresh.blocks) !== JSON.stringify(doc.blocks) || fresh.title !== doc.title || fresh.status !== doc.status){
        const y = scrollY; doc = fresh; render(); scrollTo(0, y);
      }
    }catch(e){ if(e.status === 404){ toast("The link no longer opens; the primer was taken back.", { err:true }); return; } }
    watchShared(id);
  }, busy ? 3000 : 15000);
}

/* Rewrite: this primer, read in full by the planner and the writer, as a
   new one that follows an instruction. Presets, or your own words. */
function openRewrite(anchor){
  const src = doc;
  const nodes = [el("span", "hint", "Rewrite as a new primer")];
  REWRITES.forEach(r => {
    const b = menuItem(rewriteMenu, r.label, () => startRewrite(src, r.text, r.sections));
    b.title = r.text;
    nodes.push(b);
  });
  const form = el("form");
  const input = el("input"); input.placeholder = "Or say what should change…"; input.setAttribute("aria-label", "Rewrite instruction");
  const go = btn(null, "Rewrite"); go.type = "submit";
  form.append(input, go);
  form.onsubmit = e => { e.preventDefault(); const t = input.value.trim(); if(t) startRewrite(src, t); };
  nodes.push(form);
  if(openMenu(rewriteMenu, anchor, nodes)) input.focus();
}
function startRewrite(src, instruction, sections){
  closePops();
  const rewrite = { of:src.id, ofTitle:src.title, instruction, source:docText(src) };
  if(sections) rewrite.sections = sections;
  startDoc({ topic: src.topic || src.title, known: src.known, rewrite });
}
/* ══ feedback ═════════════════════════════════════════════════
   A word to Alexander from anywhere: Feedback in the top bar, or Complain
   in the pen about a passage. It goes with the page it came from, and the
   account that hosts reads it on the Feedback page of Settings.       */
const feedbackBtn = $("#feedbackBtn"), feedbackMenu = $("#feedback");
feedbackBtn.onclick = () => openFeedback(feedbackBtn);
function openFeedback(anchor){
  const form = el("form"), ta = el("textarea"), go = btn(null, "Send");
  ta.rows = 3; ta.placeholder = "What happened, or what you wish it did"; ta.setAttribute("aria-label", "Feedback");
  ta.oninput = () => grow(ta);
  ta.onkeydown = e => { if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); form.requestSubmit(); } };
  go.type = "submit";
  form.append(ta, go);
  form.onsubmit = async e => {
    e.preventDefault();
    const t = ta.value.trim(); if(!t){ ta.focus(); return; }
    go.disabled = true;
    if(await sendFeedback("feedback", t)) closeMenu(feedbackMenu); else go.disabled = false;
  };
  if(openMenu(feedbackMenu, anchor, [el("span", "hint", "To Alexander, with the page you are on"), form])) ta.focus();
}
async function sendFeedback(kind, text, extra){
