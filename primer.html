<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Primer</title>
<script>/* theme before first paint */
(function(){try{var t=localStorage.getItem("primer:theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;}catch(e){}})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

<style>
/* ══ tokens ═══════════════════════════════════════════════════
   Paper, ink, and one editor's-red. Nothing else.               */
:root{
  --paper:#F5F0E6; --paper-2:#ECE5D6; --card:#FBF8F1;
  --ink:#1E1A15; --ink-2:#564A3F; --ink-3:#8E8375;
  --rule:#E0D8C8; --rule-2:#CBC0AC;
  --red:#A23B2A; --red-2:#7E2C1F; --red-soft:#F0DCD4; --red-tint:rgba(162,59,42,.08);
  --sel:rgba(162,59,42,.18);
  --on-ink:#F5F0E6; --on-ink-act:#F2B09E;
  --shadow:0 12px 32px rgba(50,35,20,.14),0 1px 2px rgba(50,35,20,.10);
  --col:36rem; --marg:8rem; --gap:1.25rem; --side:13rem; --sgap:2.25rem;
  --head:3.6rem;
  --disp:"Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --body:"Literata","Charter","Iowan Old Style",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#191613; --paper-2:#12100E; --card:#221E1A;
  --ink:#EAE2D4; --ink-2:#B7AC9D; --ink-3:#7E7468;
  --rule:#2D2721; --rule-2:#3D352D;
  --red:#E2836B; --red-2:#F0A18C; --red-soft:#3A241E; --red-tint:rgba(226,131,107,.12);
  --sel:rgba(226,131,107,.28);
  --on-ink:#191613; --on-ink-act:#A23B2A;
  --shadow:0 14px 36px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ══ base ═════════════════════════════════════════════════════ */
*{box-sizing:border-box}
html{background:var(--paper)}
body{
  margin:0; min-height:100dvh; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:17px; line-height:1.62;
  font-optical-sizing:auto; font-kerning:normal;
  font-variant-numeric:oldstyle-nums proportional-nums;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background-color .35s var(--ease),color .35s var(--ease);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit}
::selection{background:var(--sel)}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:2px}
.sc{font-variant-caps:all-small-caps;letter-spacing:.09em}

/* ══ header ═══════════════════════════════════════════════════ */
.head{
  position:sticky; top:0; z-index:40; height:var(--head);
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1rem;
  padding:0 1.6rem; background:var(--paper);
  transition:background-color .35s var(--ease);
}
.head::after{
  content:""; position:absolute; left:0; right:0; top:100%; height:1.4rem;
  background:linear-gradient(var(--paper),transparent); pointer-events:none;
}
.wordmark{
  justify-self:start; position:relative; font-family:var(--disp); font-style:italic;
  font-weight:400; font-size:1.5rem; line-height:1; letter-spacing:-.01em;
  font-variation-settings:"SOFT" 100,"WONK" 1; color:var(--ink); padding:.3rem 0;
}
.wordmark::after{
  content:""; position:absolute; right:-.5em; bottom:.42em; width:.26em; height:.26em;
  border-radius:50%; background:var(--red); opacity:0; transform:scale(.3);
  transition:.25s var(--ease);
}
.wordmark:hover::after{opacity:1;transform:none}
body[data-route="cover"] .wordmark{visibility:hidden}
.runhead{
  justify-self:center; max-width:min(46vw,34rem); font-size:.92rem; color:var(--ink-2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:.25rem .5rem;
  opacity:0; transform:translateY(-3px); transition:.3s var(--ease); pointer-events:none;
  border-radius:4px;
}
.runhead.show{opacity:1;transform:none;pointer-events:auto}
.runhead:hover{color:var(--ink);background:var(--paper-2)}
.runhead .n{font-family:var(--disp);font-style:italic;color:var(--red);margin-right:.5em}
.acts{justify-self:end;display:flex;align-items:center;gap:1.4rem}
.act{
  font-size:.88rem; font-variant-caps:all-small-caps; letter-spacing:.09em; color:var(--ink-2);
  padding:.2rem 0 .1rem; border-bottom:1px solid transparent; transition:.2s var(--ease);
}
.act:hover{color:var(--red)}
.act.on{color:var(--red);border-bottom-color:var(--red)}
.act.hide{display:none}
.act.prime{
  color:var(--on-ink); background:var(--ink); padding:.32rem .85rem .38rem; border-radius:999px;
  border:0; transition:.2s var(--ease);
}
.act.prime:hover{background:var(--red);color:#fff}
body[data-route="cover"] .act.prime{display:none}
.glyph{
  width:1.7rem; height:1.7rem; border-radius:50%; display:grid; place-items:center;
  font-size:1rem; line-height:1; color:var(--ink-3); transition:.2s var(--ease);
}
.glyph:hover{color:var(--ink);background:var(--paper-2)}
.glyph svg{width:1rem;height:1rem;display:block}

main{padding:1.2rem 1.6rem 10rem}

/* ══ cover ════════════════════════════════════════════════════ */
.cover{max-width:var(--col);margin:9vh auto 0}
.masthead{
  font-family:var(--disp); font-style:italic; font-weight:300; margin:0 0 3.2rem;
  font-size:clamp(3.6rem,9vw,6rem); line-height:.95; letter-spacing:-.025em; color:var(--ink);
  font-variation-settings:"SOFT" 100,"WONK" 1;
}
.masthead i{font-style:normal;color:var(--red)}
.lab{
  display:block; font-size:.8rem; font-variant-caps:all-small-caps; letter-spacing:.13em;
  color:var(--ink-3); margin:0 0 .3rem; font-weight:500;
}
.topic{
  width:100%; display:block; font-family:var(--disp); font-weight:400; color:var(--ink);
  font-size:clamp(1.7rem,3.6vw,2.4rem); line-height:1.18; letter-spacing:-.012em;
  font-variation-settings:"SOFT" 40; background:none; border:0; border-bottom:1px solid var(--rule-2);
  padding:.1rem 0 .5rem; resize:none; overflow:hidden; margin-bottom:1.9rem;
  transition:border-color .25s var(--ease);
}
.topic:focus{outline:none;border-bottom-color:var(--red)}
.known{
  width:100%; display:block; font-size:1.02rem; line-height:1.55; color:var(--ink);
  background:none; border:0; border-bottom:1px solid var(--rule); padding:.15rem 0 .45rem;
  resize:none; overflow:hidden; transition:border-color .25s var(--ease);
}
.known:focus{outline:none;border-bottom-color:var(--red)}
.composer-foot{margin-top:1.6rem;display:flex;align-items:center;gap:1.4rem}
.go{
  font-size:.92rem; font-variant-caps:all-small-caps; letter-spacing:.11em; font-weight:500;
  color:#fff; background:var(--red); padding:.5rem 1.15rem .58rem; border-radius:3px;
  transition:.2s var(--ease);
}
.go:hover{background:var(--red-2)}
.go:active{transform:translateY(1px)}
.library{margin-top:5rem}
.library .lab{margin-bottom:.4rem}
.shelf{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.shelf li{display:flex;align-items:baseline;gap:1.2rem;border-bottom:1px solid var(--rule)}
.shelf .open{
  flex:1; min-width:0; text-align:left; padding:.78rem 0 .82rem; font-size:1.12rem; line-height:1.3;
  display:flex; align-items:baseline; justify-content:space-between; gap:1.2rem; color:var(--ink);
  transition:color .15s;
}
.shelf .open span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelf .open:hover{color:var(--red)}
.shelf time{font-size:.8rem;font-style:italic;color:var(--ink-3);white-space:nowrap}
.shelf .x{
  font-size:.8rem; font-variant-caps:all-small-caps; letter-spacing:.09em; color:var(--ink-3);
  opacity:0; transition:.2s; padding:.4rem 0;
}
.shelf li:hover .x,.shelf .x:focus-visible{opacity:1}
.shelf .x:hover{color:var(--red)}
.shelf .confirm{
  flex:1; padding:.78rem 0 .82rem; display:flex; gap:1.4rem; align-items:baseline; flex-wrap:wrap;
  font-size:.98rem; color:var(--ink-2); font-style:italic;
}
.shelf .confirm span{min-width:0;flex:1}
.shelf .confirm button{
  font-style:normal; font-size:.82rem; font-variant-caps:all-small-caps; letter-spacing:.1em;
  color:var(--ink-2); border-bottom:1px solid transparent;
}
.shelf .confirm button:hover{color:var(--red);border-bottom-color:currentColor}
.shelf .confirm button.danger{color:var(--red)}

/* ══ document ═════════════════════════════════════════════════ */
.doc{position:relative;max-width:var(--col);margin:2.2rem auto 0}
.doc-head{margin:0 0 2.8rem;position:relative}
.title{
  font-family:var(--disp); font-weight:400; margin:0 0 1rem; text-wrap:balance;
  font-size:clamp(2.2rem,4.8vw,3.1rem); line-height:1.06; letter-spacing:-.018em;
  font-variation-settings:"SOFT" 40;
}
.meta{
  margin:0; display:grid; grid-template-columns:auto 1fr; gap:.15rem 1.1rem; align-items:baseline;
  font-size:.94rem; line-height:1.45;
}
.meta dt{font-size:.76rem;font-variant-caps:all-small-caps;letter-spacing:.13em;color:var(--ink-3);white-space:nowrap;font-weight:500}
.meta dd{margin:0;color:var(--ink-2);font-style:italic}

.block{position:relative;margin:0 0 1.05rem;scroll-margin-top:calc(var(--head) + 1.2rem)}
.block[data-kind="heading"]{margin:2.7rem 0 .9rem}
.doc-head + .block[data-kind="heading"]{margin-top:0}
.body>*:first-child{margin-top:0}
.body>*:last-child{margin-bottom:0}
.body p{margin:0 0 .95rem;text-wrap:pretty;hyphens:auto;hyphenate-limit-chars:8 4 4;hanging-punctuation:first}
.body h2{
  font-family:var(--disp); font-weight:500; margin:0; text-wrap:balance;
  font-size:1.72rem; line-height:1.18; letter-spacing:-.01em; font-variation-settings:"SOFT" 40;
}
.body h3{font-size:1.06rem;font-weight:600;margin:1.4rem 0 .3rem}
.body h4{font-size:.8rem;font-variant-caps:all-small-caps;letter-spacing:.12em;color:var(--ink-2);margin:1.2rem 0 .2rem}
.body ul,.body ol{margin:0 0 .95rem;padding-left:1.35rem}
.body li{margin:.28rem 0;text-wrap:pretty}
.body li::marker{color:var(--ink-3)}
.body strong{font-weight:600}
.body code{font-family:var(--mono);font-size:.84em;background:var(--paper-2);padding:.1em .34em;border-radius:3px;hyphens:none}
.body pre{
  background:var(--paper-2); border-left:2px solid var(--rule-2); padding:.85rem 1rem; margin:0 0 1rem;
  overflow-x:auto; font-size:.8rem; line-height:1.6; border-radius:0 4px 4px 0;
}
.body pre code{background:none;padding:0}
.body blockquote{margin:0 0 1rem;padding-left:1rem;border-left:2px solid var(--rule-2);color:var(--ink-2);font-style:italic}
.body hr{border:0;border-top:1px solid var(--rule);margin:1.4rem 0}
.body table{border-collapse:collapse;margin:0 0 1rem;font-size:.92rem;max-width:100%}
.body th,.body td{padding:.38rem .8rem .38rem 0;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.body th{font-variant-caps:all-small-caps;letter-spacing:.07em;font-weight:500;color:var(--ink-2)}
.body a{color:var(--red);text-decoration-thickness:1px;text-underline-offset:3px}
.body img{max-width:100%;height:auto}
.body .katex-display{margin:1.1rem 0;overflow-x:auto;overflow-y:hidden;padding:.2rem 0}
.body .katex{font-size:1.04em}

.block[data-kind="figure"] .body{padding:.4rem 0 .6rem}
.block[data-kind="figure"] figure{margin:0}
.block[data-kind="figure"] svg{max-width:100%;height:auto;display:block;color:var(--ink)}
.block[data-kind="figure"] figcaption{margin-top:.6rem;font-size:.88rem;line-height:1.5;color:var(--ink-2);text-wrap:pretty}
.block[data-kind="figure"] .cap{display:block;font-style:italic}
.block[data-kind="figure"] .exp{display:block;margin-top:.3rem}
.block[data-kind="figure"] .exp p{margin:0 0 .4rem}
.block[data-kind="figure"] .exp p:last-child{margin-bottom:0}
.block[data-kind="figure"] svg [stroke="#A23B2A"],.block[data-kind="figure"] svg [stroke="#2C6B60"]{stroke:var(--red)}
.block[data-kind="figure"] svg [fill="#A23B2A"],.block[data-kind="figure"] svg [fill="#2C6B60"]{fill:var(--red)}

/* ── marginalia ───────────────────────────── */
.marg{
  position:absolute; top:.34em; right:calc(100% + var(--gap)); width:var(--marg);
  text-align:right; font-size:.82rem; line-height:1.4; color:var(--ink-3); pointer-events:none;
}
.num{font-family:var(--disp);font-style:italic;font-size:1.1rem;color:var(--ink-3);top:.22em;font-variation-settings:"SOFT" 60}
.mark{pointer-events:auto;font-style:italic;color:var(--red);transition:color .2s;padding:0 0 .1rem;text-align:right}
.mark:hover{color:var(--red-2)}
.mark[aria-expanded="true"]{color:var(--red-2)}
.block.edited::before{
  content:""; position:absolute; top:.28em; bottom:.08em; right:calc(100% + .72rem); width:2px;
  background:var(--red); opacity:.85; border-radius:1px; transition:opacity .2s;
}
.block.edited:hover::before{opacity:1}
.status{font-style:italic;color:var(--ink-3)}
.status .dot{
  display:inline-block; width:.42em; height:.42em; border-radius:50%; background:var(--red);
  margin-right:.5em; vertical-align:middle; position:relative; top:-.08em;
  animation:breathe 1.5s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1)}}

.block.busy .body{opacity:.42;transition:opacity .3s}
.block.busy::before{
  content:""; position:absolute; top:.28em; bottom:.08em; right:calc(100% + .72rem); width:2px;
  background:var(--red); border-radius:1px; animation:breathe 1.5s ease-in-out infinite;
}
.block.pending .body{
  min-height:calc(1.62em * 4); opacity:.55;
  background:repeating-linear-gradient(to bottom,transparent 0 calc(1.62em - 1px),var(--rule) calc(1.62em - 1px) 1.62em);
  background-size:100% 1.62em; background-position:0 .2em;
}
.block.fresh{animation:settle .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes settle{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.err{border-left:2px solid var(--red);padding:.45rem .9rem;color:var(--red);font-size:.93rem;font-style:italic;line-height:1.5}
.err button{font-style:normal;font-size:.8rem;font-variant-caps:all-small-caps;letter-spacing:.1em;margin-left:.7rem;border-bottom:1px solid currentColor;color:var(--red)}

/* ── notes: inline aside, or sidenote on wide screens ── */
.block[data-kind="note"]{margin:.3rem 0 1.3rem;padding:.1rem 0 .1rem 1rem;border-left:2px solid var(--red-soft)}
.block[data-kind="note"] .body{font-size:.94rem;line-height:1.55;color:var(--ink-2)}
.side-q{
  display:block; text-align:left; font-size:.9rem; font-style:italic; color:var(--ink-2);
  margin:0 0 .3rem; line-height:1.45; transition:color .2s;
}
.side-q:hover{color:var(--red)}

/* ── colophon ─────────────────────────────── */
.colophon{
  margin-top:4rem; padding-top:1rem; border-top:1px solid var(--rule); display:flex; flex-wrap:wrap;
  gap:.4rem 1.5rem; align-items:baseline; font-size:.84rem; color:var(--ink-3); font-style:italic;
}
.colophon .fill{flex:1}
.colophon button{font-style:normal;font-size:.82rem;font-variant-caps:all-small-caps;letter-spacing:.1em;color:var(--ink-2);border-bottom:1px solid transparent}
.colophon button:hover{color:var(--red);border-bottom-color:currentColor}
.colophon .confirm{display:flex;gap:1.2rem;align-items:baseline}
.colophon .confirm .danger{color:var(--red)}

/* ══ the pen (selection toolbar) ══════════════════════════════ */
.pen{
  position:absolute; z-index:60; display:none; align-items:center; user-select:none;
  background:var(--card); border:1px solid var(--rule-2); border-radius:7px; box-shadow:var(--shadow);
  padding:.28rem .35rem; transform-origin:50% 100%;
}
.pen.show{display:flex;animation:rise .18s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(5px) scale(.97)}to{opacity:1;transform:none}}
.pen-row{display:flex;align-items:center}
.pen-row button{
  font-size:.88rem; font-variant-caps:all-small-caps; letter-spacing:.09em; color:var(--ink-2);
  padding:.36rem .6rem .4rem; border-radius:4px; white-space:nowrap; display:inline-flex;
  align-items:baseline; gap:.4em; transition:.15s;
}
.pen-row button:hover,.pen-row button:focus-visible{color:var(--red);background:var(--red-tint);outline:none}
.pen kbd{font-family:var(--disp);font-style:italic;font-size:.78rem;color:var(--ink-3);font-variant-caps:normal;letter-spacing:0}
.pen .sep{width:1px;height:1.1rem;background:var(--rule-2);margin:0 .3rem}
.pen-ask{display:none;align-items:center;gap:.4rem;padding:.1rem .2rem .1rem .4rem}
.pen.asking .pen-row{display:none}
.pen.asking .pen-ask{display:flex}
.pen-ask input{
  width:min(24rem,58vw); background:none; border:0; border-bottom:1px solid var(--rule-2);
  padding:.3rem .2rem .35rem; font-size:1rem; color:var(--ink); border-radius:0;
}
.pen-ask input:focus{outline:none;border-bottom-color:var(--red)}
.pen-ask button{
  font-size:.86rem; font-variant-caps:all-small-caps; letter-spacing:.1em; color:var(--red);
  padding:.36rem .55rem .4rem; border-radius:4px;
}
.pen-ask button:hover{background:var(--red-tint)}

/* ══ popovers ═════════════════════════════════════════════════ */
.pop{
  position:absolute; z-index:55; display:none; width:min(21rem,88vw); background:var(--card);
  border:1px solid var(--rule-2); border-radius:7px; box-shadow:var(--shadow);
  padding:.8rem 1rem .8rem; font-size:.92rem; line-height:1.5;
}
.pop.show{display:block;animation:rise .18s var(--ease)}
.pop .k{
  display:flex; justify-content:space-between; gap:1rem; align-items:baseline; margin-bottom:.3rem;
  font-size:.78rem; font-variant-caps:all-small-caps; letter-spacing:.13em; color:var(--red); font-weight:500;
}
.pop .k time{color:var(--ink-3);font-variant-caps:normal;letter-spacing:0;font-style:italic;font-size:.8rem;font-weight:400}
.pop .q{color:var(--ink-2);font-style:italic;margin-bottom:.75rem}
.pop .row{display:flex;gap:1.3rem}
.pop .row button{font-size:.8rem;font-variant-caps:all-small-caps;letter-spacing:.1em;color:var(--ink-2);border-bottom:1px solid transparent}
.pop .row button:hover{color:var(--red);border-bottom-color:currentColor}

.outline{width:min(24rem,90vw);padding:.5rem .4rem}
.outline button{
  display:flex; width:100%; text-align:left; gap:.7rem; align-items:baseline; padding:.42rem .7rem;
  border-radius:4px; color:var(--ink-2); line-height:1.35; font-size:.95rem;
}
.outline button:hover{background:var(--paper-2);color:var(--ink)}
.outline button.cur{color:var(--ink)}
.outline button .n{font-family:var(--disp);font-style:italic;color:var(--red);flex:0 0 2.2rem;font-size:1rem}
.outline button.cur .n::after{content:"";display:inline-block;width:.32em;height:.32em;border-radius:50%;background:var(--red);margin-left:.4em;vertical-align:middle}
.outline .foot{border-top:1px solid var(--rule);margin:.4rem .3rem 0;padding-top:.45rem;display:flex;gap:.2rem}
.outline .foot button{width:auto;font-size:.8rem;font-variant-caps:all-small-caps;letter-spacing:.1em;padding:.3rem .5rem}

/* ══ toast ════════════════════════════════════════════════════ */
.toast{
  position:fixed; left:50%; bottom:calc(1.6rem + env(safe-area-inset-bottom)); z-index:65;
  transform:translate(-50%,14px); opacity:0; pointer-events:none;
  background:var(--ink); color:var(--on-ink); border-radius:7px; box-shadow:var(--shadow);

<script>
/* ══ storage ══════════════════════════════════════════════════ */
const mem = {};
const store = {
  async get(k){ try{ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; }
                catch(e){ return k in mem ? mem[k] : null; } },
  async set(k,v){ mem[k]=v; try{ await window.storage.set(k, JSON.stringify(v)); }catch(e){} },
  async del(k){ delete mem[k]; try{ await window.storage.delete(k); }catch(e){} }
};

/* ══ config ═══════════════════════════════════════════════════
   Running inside a Claude artifact: leave KEY empty. Auth is handled.
   Running from your own browser: paste your key below and serve the
   file over http (see notes at the bottom of this script).           */
const API = "https://api.anthropic.com/v1/messages";
const CFG = {
  ENDPOINT: "/v1/messages",  // API to call Anthropic directly (then set KEY)
  KEY: "",              // "sk-ant-..." only when calling Anthropic directly
  CONCURRENCY: 2,       // parallel section requests. 7 at once will 429 you.
  RETRIES: 4
};
const MODEL = "claude-sonnet-4-6";
const maxTokens = () => (CFG.KEY || CFG.ENDPOINT !== API) ? 4000 : 1000;
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function claude(system, user, attempt){
  attempt = attempt || 0;
  if(CFG.ENDPOINT === API && !CFG.KEY)
    throw new Error("No way to reach the model: set CFG.ENDPOINT to \"/v1/messages\" and run npm start, or set CFG.KEY.");
  const headers = { "Content-Type":"application/json" };
  if(CFG.KEY){
    headers["x-api-key"] = CFG.KEY;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  let r;
  try{
    r = await fetch(CFG.ENDPOINT,{
      method:"POST", headers,
      body: JSON.stringify({ model:MODEL, max_tokens:maxTokens(), system,
        messages:[{role:"user",content:user}] })
    });
  }catch(e){
    if(attempt >= CFG.RETRIES) throw new Error("Network error. "+e.message);
    await sleep(800 * Math.pow(2, attempt));
    return claude(system, user, attempt+1);
  }
  if(r.status===429 || r.status===529 || r.status>=500){
    if(attempt >= CFG.RETRIES)
      throw new Error("Rate limited after "+(CFG.RETRIES+1)+" tries. Lower CFG.CONCURRENCY.");
    const ra = parseFloat(r.headers.get("retry-after"));
    await sleep(ra ? ra*1000 : 900*Math.pow(2,attempt) + Math.random()*400);
    return claude(system, user, attempt+1);
  }
  if(!r.ok){
    let detail = "";
    try{ const j = await r.json(); detail = j.error && j.error.message ? ": "+j.error.message : ""; }catch(e){}
    throw new Error("Request failed ("+r.status+")"+detail);
  }
  const d = await r.json();
  const text = (d.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n");
  if(d.stop_reason === "max_tokens") text.__truncated = true;
  return text;
}

/* run thunks with a concurrency cap instead of all at once */
async function pool(n, jobs){
  let i = 0;
  await Promise.all(Array.from({length:Math.min(n, jobs.length)}, async () => {
    while(i < jobs.length){ const job = jobs[i++]; await job(); }
  }));
}

function parseJSON(txt){
  let s = String(txt).trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const a = s.indexOf("["), o = s.indexOf("{");
  const start = (a<0)?o : (o<0)?a : Math.min(a,o);
  if(start>0) s = s.slice(start);
  try{ return JSON.parse(s); }catch(e){ return repairJSON(s); }
}

/* A response cut off at max_tokens leaves a half-written element.
   Walk to the last element that closed cleanly and discard the rest. */
function repairJSON(s){
  const root = s[0];
  if(root!=="[" && root!=="{") throw new Error("Response wasn't JSON.");
  let depth=0, inStr=false, esc=false, close1=-1, close2=-1;
  for(let i=0;i<s.length;i++){
    const c = s[i];
    if(inStr){
      if(esc) esc = false;
      else if(c==="\\") esc = true;
      else if(c==='"') inStr = false;
      continue;
    }
    if(c==='"'){ inStr = true; continue; }
    if(c==="{" || c==="[") depth++;
    else if(c==="}" || c==="]"){
      depth--;
      if(depth===1) close1 = i;
      if(depth===2) close2 = i;
    }
  }
  if(root==="[" && close1 > 0) return JSON.parse(s.slice(0, close1+1) + "]");
  if(root==="{" && close2 > 0) return JSON.parse(s.slice(0, close2+1) + "]}");
  throw new Error("Response was cut off mid-element.");
}

/* ══ prompts ══════════════════════════════════════════════════
   Every string Primer sends the model, system and user, lives in
   prompts/<key>.txt, raw text, loaded at boot. This table fixes the
   order and the labels on the Prompts page; runtime edits there are
   stored as overrides and Reset returns to the file. {{PLACEHOLDERS}}
   are filled in at call time.                                        */
const PROMPTS = {
  house:         { label:"House style" },
  reader:        { label:"Reader" },
  outline:       { label:"Outline · system" },
  outline_user:  { label:"Outline · user" },
  section:       { label:"Section · system" },
  section_user:  { label:"Section · user" },
  edit:          { label:"Edit · system" },
  edit_user:     { label:"Edit · user" },
  figure:        { label:"Diagram · system" },
  simpler:       { label:"Action · Simpler" },
  example:       { label:"Action · Example" },
  derive:        { label:"Action · Derive" },
  tighter:       { label:"Action · Tighter" },
  ask:           { label:"Action · Ask" },
  figure_action: { label:"Action · Diagram" }
};

/* Fetch prompts/<key>.txt for every entry. Returns the keys that failed.
   Needs http; file:// blocks fetch. */
async function loadPrompts(){
  const missing = [];
  await Promise.all(Object.keys(PROMPTS).map(async k => {
    try{
      const r = await fetch("prompts/"+k+".txt", { cache:"no-cache" });
      if(!r.ok) throw new Error(r.status);
      PROMPTS[k].text = (await r.text()).replace(/\r\n/g, "\n").replace(/\n$/, "");
    }catch(e){ PROMPTS[k].text = ""; missing.push(k); }
  }));
  return missing;
}

let overrides = {};   // {key: text} from storage
function rawPrompt(k){ return (k in overrides) ? overrides[k] : PROMPTS[k].text; }

/* {{KEY}} → vars.KEY. Unknown keys are left visible. Blank runs collapse. */
function fill(tpl, vars){
  return tpl.replace(/\{\{(\w+)\}\}/g, (m, key) =>
      (key in vars) ? String(vars[key]) : m)
    .replace(/\n{3,}/g, "\n\n").trim();
}
function sys(k){ return fill(rawPrompt(k), { HOUSE: rawPrompt("house").trim() }); }
function usr(k, vars){ return fill(rawPrompt(k), vars); }

/* Reader knowledge = the standing Reader prompt + this document's field. */
function readerText(known){
  const base = rawPrompt("reader").trim();
  return (known && known.trim()) ? base + "\n" + known.trim() : base;
}

/* sigil/label are stored on each revised block; the margin shows the
   label in lowercase. key is the pen's keyboard shortcut.           */
const ACTIONS = {
  simpler: { sigil:"SMP", label:"Simpler",    key:"1" },
  example: { sigil:"EX",  label:"Example",    key:"2" },
  derive:  { sigil:"DRV", label:"Derivation", key:"3" },
  figure:  { sigil:"FIG", label:"Diagram",    key:"4" },
  tighter: { sigil:"CUT", label:"Tighter",    key:"5" },
  ask:     { sigil:"Q",   label:"Question",   key:"6" }
};
const word = edit => String(edit && edit.label || "").toLowerCase();

/* ══ state ════════════════════════════════════════════════════ */
let doc = null;            // {id,title,topic,known,created,blocks:[...]}
let index = [];            // [{id,title,updated}]
let route = "cover";       // "cover" | "doc" | "prompts"
let undoStack = [];
let sel = null;            // {blockId, text, rect}
const uid = () => Math.random().toString(36).slice(2,9);

const $ = s => document.querySelector(s);
const main=$("#main"), pen=$("#tools"), pop=$("#pop"), outline=$("#outline"),
      toastEl=$("#toast"), runhead=$("#runhead"), undoBtn=$("#undoBtn"),
      promptsBtn=$("#promptsBtn"), newBtn=$("#newBtn"), themeBtn=$("#themeBtn"),
      askInput=$("#askInput");

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function timeAgo(ts){
  const d = Date.now()-ts, m = Math.round(d/6e4), h = Math.round(d/36e5), dd = Math.round(d/864e5);
  if(m < 1) return "just now";
  if(m < 60) return m+" min ago";
  if(h < 24) return h+(h===1?" hour ago":" hours ago");
  if(dd < 7) return dd+(dd===1?" day ago":" days ago");
  return shortDate(ts);
}
function shortDate(ts){
  const d = new Date(ts), o = {month:"short", day:"numeric"};
  if(d.getFullYear() !== new Date().getFullYear()) o.year = "numeric";
  return d.toLocaleDateString(undefined, o);
}
function grow(ta){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }
const docked = () => matchMedia("(pointer:coarse)").matches || innerWidth <= 700;

/* ══ markdown + math ══════════════════════════════════════════ */
marked.setOptions({breaks:false, gfm:true});
const MATH_RE = /\$\$[\s\S]*?\$\$|\$(?:\\.|[^$\\\n])+?\$/g;

function mdToHtml(md){
  const parts = String(md).split(/(```[\s\S]*?```)/g);
  const stash = [];
  const masked = parts.map(p => p.startsWith("```") ? p :
    p.replace(MATH_RE, m => { stash.push(m); return "@@PM"+(stash.length-1)+"@@"; })
  ).join("");
  let html = marked.parse(masked);
  return html.replace(/@@PM(\d+)@@/g, (_,i) => stash[+i]);
}
function mdInline(md){
  const stash = [];
  const masked = String(md).replace(MATH_RE, m => { stash.push(m); return "@@PM"+(stash.length-1)+"@@"; });
  return marked.parseInline(masked).replace(/@@PM(\d+)@@/g, (_,i) => stash[+i]);
}
function typeset(el){
  try{
    renderMathInElement(el,{ throwOnError:false, delimiters:[
      {left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},
      {left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}]});
  }catch(e){}
}

/* ══ render ═══════════════════════════════════════════════════ */
function render(){
  document.body.dataset.route = route;
  undoBtn.classList.toggle("hide", !(route==="doc" && undoStack.length));
  promptsBtn.classList.toggle("on", route==="prompts");
  closePops(); hideTools();
  if(route === "prompts") renderPrompts();
  else if(route === "doc" && doc) renderDoc();
  else { route = "cover"; document.body.dataset.route = route; renderCover(); }
  updateRunhead();
}

/* ── cover: composer + library ────────────── */
function renderCover(){
  const c = el("section", "cover");
  c.innerHTML = `<h1 class="masthead">Primer<i>.</i></h1>
    <form class="composer" id="composer">
      <label class="lab" for="cTopic">Topic</label>
      <textarea id="cTopic" class="topic" rows="1" autocomplete="off"></textarea>
      <label class="lab" for="cKnown">Already know</label>
      <textarea id="cKnown" class="known" rows="1"></textarea>
      <div class="composer-foot"><button class="go" type="submit">Write it</button></div>
    </form>
    <section class="library" id="library"></section>`;
  main.replaceChildren(c);

  const form = $("#composer"), topic = $("#cTopic"), known = $("#cKnown");
  topic.oninput = () => grow(topic);
  known.oninput = () => grow(known);
  topic.onkeydown = e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); } };
  known.onkeydown = e => { if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); form.requestSubmit(); } };
  form.onsubmit = e => {
    e.preventDefault();
    const t = topic.value.trim(); if(!t){ topic.focus(); return; }
    const k = known.value.trim();
    undoStack = []; route = "doc";
    build(t, k);
    scrollTo(0, 0);
  };
  renderLibrary();
  requestAnimationFrame(() => { grow(topic); grow(known); });
}

function renderLibrary(){
  const lib = $("#library");
  if(!lib) return;
  if(!index.length){ lib.replaceChildren(); return; }
  const list = el("ol", "shelf");
  index.forEach(it => {
    const li = el("li");
    const open = el("button", "open"); open.type = "button";
    open.append(el("span", null, it.title), el("time", null, shortDate(it.updated)));
    open.onclick = () => openDoc(it.id);
    const x = el("button", "x", "Delete"); x.type = "button";
    x.onclick = () => confirmRow(li, it.title, () => deleteDoc(it.id), () => { li.replaceChildren(open, x); });
    li.append(open, x);
    list.appendChild(li);
  });
  lib.replaceChildren(el("h2", "lab", "Library"), list);
}
function confirmRow(host, title, yes, no){
  const c = el("div", "confirm");
  const y = el("button", "danger", "Delete"); y.type = "button"; y.onclick = yes;
  const n = el("button", null, "Keep"); n.type = "button"; n.onclick = no;
  c.append(el("span", null, "Delete “"+title+"”?"), y, n);
  host.replaceChildren(c);
  n.focus();
}

/* ── document ─────────────────────────────── */
function renderDoc(){
  const a = el("article", "doc");
  a.innerHTML = `<header class="doc-head"><h1 class="title"></h1>
    <dl class="meta">
      <dt>Asked for</dt><dd class="m-topic"></dd>
      <dt class="m-kl">Already knew</dt><dd class="m-known"></dd>
    </dl></header>`;
  a.querySelector(".title").textContent = doc.title;
  a.querySelector(".m-topic").textContent = doc.topic || doc.title;
  if(doc.known) a.querySelector(".m-known").textContent = doc.known;
  else { a.querySelector(".m-kl").remove(); a.querySelector(".m-known").remove(); }

  let n = 0, fi = 0;
  doc.blocks.forEach(b => {
    if(b.kind === "heading") n++;
    const e = blockEl(b, n);
    if(e.classList.contains("fresh")) e.style.setProperty("--i", fi++);
    a.appendChild(e);
  });
  if(!doc.blocks.some(b => b.pending) && doc.blocks.some(b => b.kind==="heading")) a.appendChild(colophon());
  main.replaceChildren(a);
  typeset(a);
  layoutSidenotes();
}

function blockEl(b, n){
  const e = el("div", "block");
  e.dataset.blockId = b.id;
  e.dataset.kind = b.kind || "prose";
  if(b.busy) e.classList.add("busy");
  if(b.fresh) e.classList.add("fresh");
  if(b.pending) e.classList.add("pending");
  if(b.edit && b.kind !== "note") e.classList.add("edited");
  b.fresh = false;

  if(b.kind === "heading"){
    e.appendChild(el("span", "marg num", "§ " + (n || "")));
  }
  if(b.pending || b.busy){
    const s = el("span", "marg status");
    s.appendChild(el("i", "dot"));
    s.append(b.busy ? word(ACTIONS[b.busy] || {label:"revising"}) : (b.plan ? "planning" : "writing"));
    e.appendChild(s);
  }else if(b.edit && b.kind !== "note"){
    const m = el("button", "marg mark", word(b.edit));
    m.type = "button";
    m.setAttribute("aria-label", b.edit.label + ", revision");
    m.onclick = ev => { ev.stopPropagation(); showProv(m, b); };
    e.appendChild(m);
  }
  if(b.kind === "note"){
    const q = el("button", "side-q");
    q.type = "button";
    q.textContent = b.edit ? "“" + (b.edit.note || b.edit.quote) + "”" : "";
    q.onclick = ev => { ev.stopPropagation(); if(b.edit) showProv(q, b); };
    e.appendChild(q);
  }

  const body = el("div", "body");
  if(b.pending){
    /* ruled lines, waiting */
  }else if(b.error){
    const x = el("div", "err", b.error);
    const r = el("button", null, "Retry"); r.type = "button";
    r.onclick = () => b.retry && b.retry();
    x.appendChild(r); body.appendChild(x);
  }else if(b.kind === "figure"){
    const fig = el("figure");
    fig.innerHTML = String(b.md).replace(/<script[\s\S]*?<\/script>/gi,"");
    if(b.caption || b.explanation){
      const fc = el("figcaption");
      if(b.caption){ const c = el("span", "cap"); c.innerHTML = mdInline(b.caption); fc.appendChild(c); }
      if(b.explanation){ const x = el("span", "exp"); x.innerHTML = mdToHtml(b.explanation); fc.appendChild(x); }
      fig.appendChild(fc);
    }
    body.appendChild(fig);
  }else{
    body.innerHTML = mdToHtml(b.md);
  }
  e.appendChild(body);
  return e;
}

function colophon(){
  const c = el("footer", "colophon");
  const secs = doc.blocks.filter(b => b.kind==="heading").length;
  const revs = doc.blocks.filter(b => b.edit).length;
  const stats = [secs + (secs===1 ? " section" : " sections")];
  if(revs) stats.push(revs + (revs===1 ? " revision" : " revisions"));
  c.appendChild(el("span", "fill", stats.join(" · ")));
  const ex = el("button", null, "Export"); ex.type = "button"; ex.onclick = exportDoc;
  const del = el("button", null, "Delete"); del.type = "button";
  del.onclick = () => {
    const wrap = el("span", "confirm");
    const y = el("button", "danger", "Delete"); y.type = "button"; y.onclick = () => deleteDoc(doc.id);
    const k = el("button", null, "Keep"); k.type = "button"; k.onclick = () => wrap.replaceWith(del);
    wrap.append(y, k); del.replaceWith(wrap); k.focus();
  };
  c.append(ex, del);
  return c;
}

function patch(b){
  const old = main.querySelector(`[data-block-id="${b.id}"]`);
  if(!old) return render();
  let n = 0;
  for(const x of doc.blocks){ if(x.kind==="heading") n++; if(x.id===b.id) break; }
  const fresh = blockEl(b, n);
  old.replaceWith(fresh);
  typeset(fresh);
  layoutSidenotes();
}

/* Sidenotes sit in the right margin, level with the block they answer,
   pushed down only as far as the note above them requires.           */
function layoutSidenotes(){
  const d = main.querySelector(".doc");
  if(!d) return;
  const notes = d.querySelectorAll('.block[data-kind="note"]');
  d.style.paddingBottom = "";
  if(!notes.length) return;
  if(!matchMedia("(min-width:1180px)").matches){ notes.forEach(x => x.style.top = ""); return; }
  let floor = 0, deepest = 0;
  notes.forEach(x => {
    let a = x.previousElementSibling;
    while(a && a.dataset.kind === "note") a = a.previousElementSibling;
    const top = Math.max(a ? a.offsetTop : 0, floor);
    x.style.top = top + "px";
    floor = top + x.offsetHeight + 16;
    deepest = Math.max(deepest, floor);
  });
  const over = deepest - d.offsetHeight;
  if(over > 0) d.style.paddingBottom = over + "px";
}
let rsT = null;
addEventListener("resize", () => { cancelAnimationFrame(rsT); rsT = requestAnimationFrame(layoutSidenotes); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(layoutSidenotes);

/* ══ persistence ══════════════════════════════════════════════ */
let saveT = null;
function save(){
  if(!doc) return;
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    const clean = { ...doc, blocks: doc.blocks.map(({busy,pending,error,retry,fresh,slot,plan,...r}) => r) };
    await store.set("primer:doc:"+doc.id, clean);
    const i = index.findIndex(x => x.id===doc.id);
    const entry = { id:doc.id, title:doc.title, updated:Date.now() };
    if(i>-1) index[i] = entry; else index.unshift(entry);
    await store.set("primer:index", index);
    if(route === "cover") renderLibrary();
  }, 400);
}
async function openDoc(id){
  const d = await store.get("primer:doc:"+id);
  if(!d) return;
  doc = d; undoStack = []; route = "doc"; render();
  scrollTo(0, 0);
}
async function deleteDoc(id){
  index = index.filter(x => x.id !== id);
  await store.set("primer:index", index);
  await store.del("primer:doc:"+id);
  if(doc && doc.id === id){ doc = null; undoStack = []; route = "cover"; render(); scrollTo(0,0); }
  else renderLibrary();
}
function snapshot(){
  undoStack.push(JSON.parse(JSON.stringify(
    doc.blocks.map(({busy,pending,error,retry,fresh,slot,plan,...r}) => r))));
  if(undoStack.length > 30) undoStack.shift();
  undoBtn.classList.remove("hide");
}
function doUndo(){
  if(!undoStack.length || !doc || route!=="doc") return;
  doc.blocks = undoStack.pop();
  hideToast();
  render(); save();
}

/* ══ generation ═══════════════════════════════════════════════ */
async function build(topic, known){
  const reader = readerText(known);
  doc = { id:uid(), title:topic, topic, known:known||"", created:Date.now(), blocks:[
    { id:uid(), kind:"prose", pending:true, plan:true, md:"" } ] };
  render();

  let plan;
  try{
    plan = parseJSON(await claude(sys("outline"),
      usr("outline_user", { READER: reader, TOPIC: topic })));
  }catch(e){
    doc.blocks = [{ id:uid(), kind:"prose", md:"", error:"Couldn't plan this explainer. "+e.message,
      retry:()=>build(topic,known) }];
    return render();
  }
  doc.title = plan.title || topic;

  const outline = (plan.sections||[]).map((s,i)=>(i+1)+". "+s).join("\n");
  doc.blocks = [];
  (plan.sections||[]).forEach((title,i) => {
    doc.blocks.push({ id:uid(), kind:"heading", md:"## "+title, sec:i, fresh:true });
    doc.blocks.push({ id:uid(), kind:"prose", pending:true, md:"", sec:i, slot:true });
  });
  render();
  save();

  await pool(CFG.CONCURRENCY,
    (plan.sections||[]).map((title,i) => () => genSection(i, title, outline, reader)));
  save();
}

async function genSection(i, title, outline, reader){
  const user = usr("section_user", {
    READER: reader, TITLE: doc.title, OUTLINE: outline, N: i+1, SECTION: title });
  try{
    const arr = parseJSON(await claude(sys("section"), user));
    const made = (Array.isArray(arr)?arr:[]).filter(x=>x&&x.md)
      .map(x => ({ id:uid(), kind:"prose", md:x.md, sec:i, fresh:true }));
    if(!made.length) throw new Error("Empty section.");
    replaceSlot(i, made);
    save();
  }catch(e){
    replaceSlot(i, [{ id:uid(), kind:"prose", md:"", sec:i, slot:true,
      error:"Section "+(i+1)+" didn't come back. "+e.message,
      retry:() => {
        replaceSlot(i, [{ id:uid(), kind:"prose", md:"", sec:i, slot:true, pending:true }]);
        genSection(i, title, outline, reader);
      } }]);
  }
}
function replaceSlot(i, blocks){
  const at = doc.blocks.findIndex(b => b.slot && b.sec===i);
  if(at<0) return;
  doc.blocks.splice(at, 1, ...blocks);
  if(route === "doc") render();
}

/* ══ editing ══════════════════════════════════════════════════ */
function context(idx){
  const outline = doc.blocks.filter(b=>b.kind==="heading").map(b=>b.md.replace(/^#+\s*/,"")).join(" · ");
  const before = doc.blocks.slice(Math.max(0,idx-2), idx).map(b=>b.md).join("\n\n");
  const after  = doc.blocks.slice(idx+1, idx+3).map(b=>b.md).join("\n\n");
  return { outline, before, after };
}

async function applyEdit(blockId, act, question){
  const idx = doc.blocks.findIndex(b => b.id===blockId);
  if(idx<0) return;
  const target = doc.blocks[idx];
  const a = ACTIONS[act];
  const highlighted = (sel && sel.blockId===blockId && sel.text) ? sel.text : target.md;

  snapshot();
  target.busy = act; patch(target);

  const { outline, before, after } = context(idx);
  const user = usr("edit_user", {
    READER: readerText(doc.known),
    TITLE: doc.title,
    OUTLINE: outline,
    BEFORE: before || "(none)",
    TARGET: target.md,
    AFTER: after || "(none)",
    HIGHLIGHT: highlighted,
    QUESTION: question || "(nothing)",
    ACTION: rawPrompt(act==="figure" ? "figure_action" : act)
  });

  try{
    const out = parseJSON(await claude(sys(act==="figure" ? "figure" : "edit"), user));
    const blocks = (out.blocks||[]).filter(x => x && x.md);
    if(!blocks.length) throw new Error("Empty response.");
    const stamp = { sigil:a.sigil, label:a.label, note:question||"", quote:highlighted.slice(0,220), ts:Date.now() };
    const made = blocks.map(x => {
      const b = { id:uid(), kind: act==="figure" ? "figure" : (x.kind==="note" ? "note" : "prose"),
        md:x.md, sec:target.sec, edit:stamp, fresh:true };
      if(act==="figure"){
        if(x.caption) b.caption = String(x.caption).trim();
        if(x.explanation) b.explanation = String(x.explanation).trim();
      }
      return b;
    });
    target.busy = false;
    const replaced = act!=="figure" && out.mode==="replace";
    if(replaced) doc.blocks.splice(idx, 1, ...made);
    else doc.blocks.splice(idx+1, 0, ...made);
    if(route === "doc"){
      render();
      const first = main.querySelector(`[data-block-id="${made[0].id}"]`);
      if(first) first.scrollIntoView({block:"nearest", behavior:"smooth"});
    }
    save();
    toast(replaced ? "Replaced" : "Added", { undo:true });
  }catch(e){
    target.busy = false;
    undoStack.pop();
    if(route === "doc") patch(target);
    undoBtn.classList.toggle("hide", !undoStack.length);
    toast("That edit didn't come back: " + e.message, { err:true });
  }
}

/* ══ the pen ══════════════════════════════════════════════════ */
function readSelection(){
  const s = window.getSelection();
  if(!s || s.isCollapsed || !s.rangeCount) return null;
  const text = s.toString().trim();
  if(text.length < 2) return null;
  let n = s.anchorNode;
  if(n && n.nodeType===3) n = n.parentElement;
  const block = n && n.closest ? n.closest("[data-block-id]") : null;
  if(!block || block.classList.contains("pending") || block.classList.contains("busy")) return null;
  return { blockId: block.dataset.blockId, text, rect: s.getRangeAt(0).getBoundingClientRect() };
}
function placeTools(rect){
  pen.classList.add("show");
  if(docked()){ pen.style.left = ""; pen.style.top = ""; return; }
  const w = pen.offsetWidth, h = pen.offsetHeight;
  let x = rect.left + window.scrollX + rect.width/2 - w/2;
  x = Math.max(8, Math.min(x, document.documentElement.clientWidth - w - 8));
  let y = rect.top + window.scrollY - h - 10;
  const headH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--head")) * 16 || 58;
  if(y < window.scrollY + headH + 4) y = rect.bottom + window.scrollY + 10;
  pen.style.left = x+"px"; pen.style.top = y+"px";
}
function hideTools(){ pen.classList.remove("show","asking"); askInput.value = ""; }
function showForSelection(){
  const s = readSelection();
  if(!s){ if(!pen.classList.contains("asking")) hideTools(); return; }
  sel = s; placeTools(s.rect);
}
document.addEventListener("mouseup", e => {
  if(pen.contains(e.target) || pop.contains(e.target) || outline.contains(e.target)) return;
  setTimeout(showForSelection, 10);
});
document.addEventListener("keyup", e => {
  if(!e.shiftKey) return;
  const s = readSelection();
  if(s){ sel = s; placeTools(s.rect); }
});
let selT = null;
document.addEventListener("selectionchange", () => {
  if(!matchMedia("(pointer:coarse)").matches) return;
  clearTimeout(selT); selT = setTimeout(showForSelection, 350);
});
document.addEventListener("mousedown", e => {
  if(!pen.contains(e.target) && !pen.classList.contains("asking")) hideTools();
  if(!pop.contains(e.target)) pop.classList.remove("show");
  if(!outline.contains(e.target) && !runhead.contains(e.target)) closeOutline();
});
function trigger(act){
  if(!sel) return;
  if(act==="ask"){ pen.classList.add("asking"); askInput.focus(); return; }
  const {blockId} = sel;
  hideTools();
  applyEdit(blockId, act, "");
}
pen.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if(b) trigger(b.dataset.act);
});
$("#askForm").onsubmit = e => {
  e.preventDefault();
  const q = askInput.value.trim();
  if(!q || !sel) return;
  const {blockId} = sel;
  hideTools();
  applyEdit(blockId, "ask", q);
};
askInput.onkeydown = e => {
  if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); pen.classList.remove("asking"); askInput.value=""; }
};

/* ══ provenance popover ═══════════════════════════════════════ */
function showProv(anchor, b){
  closePops();
  pop.replaceChildren();
  const k = el("div", "k", b.edit.label);
  if(b.edit.ts){ const t = el("time", null, timeAgo(b.edit.ts)); t.dateTime = new Date(b.edit.ts).toISOString(); k.appendChild(t); }
  const q = el("div", "q", b.edit.note ? b.edit.note : "“" + b.edit.quote + "”");
  const row = el("div", "row");
  const rm = el("button", null, "Remove"); rm.type = "button";
  rm.onclick = () => {
    snapshot();
    doc.blocks = doc.blocks.filter(x => x.id!==b.id);
    closePops(); render(); save();
    toast("Removed", { undo:true });
  };
  row.appendChild(rm);
  pop.append(k, q, row);
  pop.classList.add("show");
  anchor.setAttribute("aria-expanded", "true");
  pop._anchor = anchor;
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth;
  let x = r.left + window.scrollX - 4;
  x = Math.max(8, Math.min(x, document.documentElement.clientWidth - w - 8));
  pop.style.left = x + "px";
  pop.style.top  = (r.bottom + window.scrollY + 8) + "px";
}
function closePops(){
  if(pop._anchor){ pop._anchor.removeAttribute("aria-expanded"); pop._anchor = null; }
  pop.classList.remove("show");
  closeOutline();
}

/* ══ running head + outline ═══════════════════════════════════ */
function headingText(h){ const b = h.querySelector(".body"); return b ? b.textContent.trim() : ""; }
function currentHeading(){
  const hs = main.querySelectorAll('.block[data-kind="heading"]');
  let cur = null, n = 0;
  hs.forEach((h,i) => { if(h.getBoundingClientRect().top <= 120){ cur = h; n = i+1; } });
  return { cur, n };
}
function updateRunhead(){
  runhead.replaceChildren();
  let show = false;
  const title = main.querySelector(".title");
  const past = title ? title.getBoundingClientRect().bottom < 40 : false;
  if(route === "prompts"){
    runhead.textContent = "Prompts"; show = past;
  }else if(route === "doc" && doc){
    const { cur, n } = currentHeading();
    if(cur){ runhead.append(el("span","n","§ "+n), headingText(cur)); }
    else runhead.textContent = doc.title;
    show = past;
  }
  runhead.classList.toggle("show", show);
  if(!show) closeOutline();
}
let scT = null;
addEventListener("scroll", () => { cancelAnimationFrame(scT); scT = requestAnimationFrame(updateRunhead); }, {passive:true});

function openOutline(){
  outline.replaceChildren();
  if(route === "doc" && doc){
    const { n:curN } = currentHeading();
    const hs = main.querySelectorAll('.block[data-kind="heading"]');
    hs.forEach((h,i) => {
      const b = el("button", i+1===curN ? "cur" : ""); b.type = "button"; b.setAttribute("role","menuitem");
      b.append(el("span","n","§ "+(i+1)), headingText(h));
      b.onclick = () => { closeOutline(); h.scrollIntoView({behavior:"smooth", block:"start"}); };
      outline.appendChild(b);
    });
    const foot = el("div", "foot");
    const ex = el("button", null, "Export"); ex.type = "button"; ex.onclick = () => { closeOutline(); exportDoc(); };
    foot.appendChild(ex);
    outline.appendChild(foot);
  }else if(route === "prompts"){
    Object.keys(PROMPTS).forEach(k => {
      const b = el("button"); b.type = "button"; b.setAttribute("role","menuitem");
      b.append(PROMPTS[k].label);
      b.onclick = () => { closeOutline(); const r = main.querySelector(`.prow[data-key="${k}"]`); if(r) r.scrollIntoView({behavior:"smooth", block:"start"}); };
      outline.appendChild(b);
    });
  }
  if(!outline.children.length) return;
  outline.classList.add("show");
  runhead.setAttribute("aria-expanded", "true");
  const r = runhead.getBoundingClientRect(), w = outline.offsetWidth;
  let x = r.left + r.width/2 - w/2;
  x = Math.max(8, Math.min(x, document.documentElement.clientWidth - w - 8));
  outline.style.left = (x + window.scrollX) + "px";
  outline.style.top  = (r.bottom + window.scrollY + 6) + "px";
}
function closeOutline(){ outline.classList.remove("show"); runhead.setAttribute("aria-expanded", "false"); }
runhead.onclick = () => outline.classList.contains("show") ? closeOutline() : openOutline();

/* ══ toast ════════════════════════════════════════════════════ */
let toastT = null;
function toast(msg, o){
  o = o || {};
  toastEl.replaceChildren(el("span", null, msg));
  toastEl.classList.toggle("err", !!o.err);
  if(o.undo){
    const b = el("button", null, "Undo"); b.type = "button";
    b.onclick = () => { hideToast(); doUndo(); };
    toastEl.appendChild(b);
  }
  toastEl.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(hideToast, o.err ? 9000 : 6000);
}
function hideToast(){ toastEl.classList.remove("show"); }

/* ══ prompts page ═════════════════════════════════════════════ */
function renderPrompts(){
  const page = el("article", "doc prompts");
  page.innerHTML = `<header class="doc-head"><h1 class="title">Prompts</h1></header>`;

  Object.keys(PROMPTS).forEach(k => {
    const row = el("section", "prow"); row.dataset.key = k;
    const head = el("div", "prow-head");
    const lab = el("span", "lab", PROMPTS[k].label);
    const rst = el("button", "reset", "Reset"); rst.type = "button";
    const ta = el("textarea", "p-text"); ta.spellcheck = false; ta.value = rawPrompt(k);
    ta.setAttribute("aria-label", PROMPTS[k].label);

    const mark = () => row.classList.toggle("mod", ta.value !== PROMPTS[k].text);
    let t = null;
    ta.oninput = () => {
      grow(ta); mark();
      clearTimeout(t);
      t = setTimeout(async () => {
        if(ta.value === PROMPTS[k].text) delete overrides[k]; else overrides[k] = ta.value;
        await store.set("primer:prompts", overrides);
      }, 350);
    };
    rst.onclick = async () => {
      ta.value = PROMPTS[k].text; grow(ta); mark();
      delete overrides[k];
      await store.set("primer:prompts", overrides);
    };
    head.append(lab, rst);
    row.append(head, ta);
    page.appendChild(row);
    requestAnimationFrame(() => { grow(ta); mark(); });
  });

  main.replaceChildren(page);
}

/* ══ export ═══════════════════════════════════════════════════ */
function exportDoc(){
  if(!doc) return;
  const md = "# " + doc.title + "\n\n" + doc.blocks.map(b =>
    b.kind==="figure"
      ? "<!-- diagram -->\n" + b.md + (b.caption ? "\n\n*" + b.caption + "*" : "") + (b.explanation ? "\n\n" + b.explanation : "")
      : b.md).join("\n\n") + "\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([md], {type:"text/markdown"}));
  a.download = doc.title.replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-").toLowerCase() + ".md";
  a.click(); URL.revokeObjectURL(a.href);
}

/* ══ theme ════════════════════════════════════════════════════ */
function setTheme(t, persist){
  document.documentElement.dataset.theme = t;
  themeBtn.setAttribute("aria-label", t==="dark" ? "Day" : "Night");
  if(persist){ try{ localStorage.setItem("primer:theme", t); }catch(e){} }
}
themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme==="dark" ? "light" : "dark", true);
try{
  matchMedia("(prefers-color-scheme:dark)").addEventListener("change", e => {
    if(!localStorage.getItem("primer:theme")) setTheme(e.matches ? "dark" : "light", false);
  });
}catch(e){}

/* ══ header + keys ════════════════════════════════════════════ */
$("#homeBtn").onclick = () => { route = "cover"; render(); scrollTo(0,0); };
newBtn.onclick = () => { route = "cover"; render(); scrollTo(0,0); const t = $("#cTopic"); if(t) t.focus(); };
promptsBtn.onclick = () => {
  if(route === "prompts") route = doc ? "doc" : "cover"; else route = "prompts";
  render(); scrollTo(0,0);
};
undoBtn.onclick = doUndo;

document.addEventListener("keydown", e => {
  const tag = document.activeElement && document.activeElement.tagName;
  const inField = tag==="INPUT" || tag==="TEXTAREA";
  if(e.key === "Escape"){
    if(outline.classList.contains("show")){ closeOutline(); return; }
    if(pop.classList.contains("show")){ closePops(); return; }
    if(pen.classList.contains("show")){ hideTools(); return; }
    return;
  }
  if((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase()==="z" && !inField){
    if(route==="doc" && undoStack.length){ e.preventDefault(); doUndo(); hideToast(); }
    return;
  }
  if(!inField && !e.metaKey && !e.ctrlKey && !e.altKey &&
     pen.classList.contains("show") && !pen.classList.contains("asking")){
    const act = Object.keys(ACTIONS).find(k => ACTIONS[k].key === e.key);
    if(act){ e.preventDefault(); trigger(act); }
  }
});

/* ══ boot ═════════════════════════════════════════════════════ */
(async function boot(){
  setTheme(document.documentElement.dataset.theme || "light", false);
  const missing = await loadPrompts();
  index = (await store.get("primer:index")) || [];
  overrides = (await store.get("primer:prompts")) || {};
  const legacy = await store.get("primer:profile");
  if(legacy && !("reader" in overrides)){
    overrides.reader = legacy;
    await store.set("primer:prompts", overrides);
    await store.del("primer:profile");
  }
  render();
  if(missing.length) toast("Couldn't read " + (missing.length===1 ? "prompts/"+missing[0]+".txt" : missing.length+" files in prompts/") +
    ". Primer has to be served over http, e.g. npm start", { err:true });
})();
