  img.onerror = () => {
    const d = doc;
    fig.replaceChildren(errNode({ error:"The image file is missing.", retry:() => retryVisual(d, b), remove:() => { swapBlock(d, b.id, []); save(d); } }));
  };
  fig.appendChild(img);
  const fc = el("figcaption");
  if(b.caption) fc.innerHTML = mdInline(b.caption);
  if(b.credit || b.page){
    const c = el("span", "credit");
    if(b.page){ const a = el("a", null, b.credit || host(b.page)); a.href = b.page; a.target = "_blank"; a.rel = "noopener"; c.appendChild(a); }
    else c.textContent = b.credit;
    fc.appendChild(c);
  }
  if(fc.childNodes.length) fig.appendChild(fc);
  hoverable(fig, () => sourceNodes(b));
  return fig;
}
/* A small numeral after each cited claim; hover it for the source. */
function addCites(body, cites){
  cites.forEach((c, k) => {
    const sup = el("sup", "cite");
    const a = el("a", null, String(k+1)); a.href = c.url; a.target = "_blank"; a.rel = "noopener";
    a.setAttribute("aria-label", "Source " + (k+1) + (c.title ? ": " + c.title : ""));
    sup.appendChild(a);
    hoverable(sup, () => citeNodes(c, k+1));
    const r = c.claim && (locate(body, c.claim) || locate(body, c.claim.replace(/[*_`]/g, "")));
    if(r){ r.collapse(false); r.insertNode(sup); }
    else (body.lastElementChild || body).appendChild(sup);
  });
}

function colophon(){
  const c = el("footer", "colophon");
  const secs = doc.blocks.filter(b => b.kind==="heading").length;
  const revs = doc.blocks.filter(b => b.edit && b.edit.by !== "research").length;
  const cites = doc.blocks.reduce((n, b) => n + (b.cites ? b.cites.length : 0), 0);
  const fixes = doc.blocks.filter(b => b.edit && b.edit.by === "research").length;
  const stats = [secs + (secs===1 ? " section" : " sections")];
  if(revs) stats.push(revs + (revs===1 ? " revision" : " revisions"));
  if(cites) stats.push(cites + (cites===1 ? " source" : " sources"));
  if(fixes) stats.push(fixes + (fixes===1 ? " correction" : " corrections"));
  c.appendChild(el("span", "fill", stats.join(" · ")));
  const d = doc;
  c.append(btn(null, doc.researched ? "Research again" : "Research", () => researchAll(d)));
  c.append(btn(null, "Export", exportDoc));
  const del = btn(null, "Delete");
  del.onclick = () => {
    const wrap = el("span", "confirm");
    const y = btn("danger", "Delete", () => deleteDoc(d.id));
    const k = btn(null, "Keep", () => wrap.replaceWith(del));
    wrap.append(y, k); del.replaceWith(wrap); k.focus();
  };
  c.append(del);
  return c;
}

function patch(d, b){
  if(doc !== d || route !== "doc") return;
  const old = main.querySelector(`[data-block-id="${b.id}"]`);
  if(!old) return render();
  let n = 0;
  for(const x of d.blocks){ if(x.kind==="heading") n++; if(x.id===b.id) break; }
  const fresh = blockEl(b, n);
  old.replaceWith(fresh);
  typeset(fresh);
  layoutSidenotes();
  rehighlight();
}

/* Sidenotes sit in the right margin, level with the block they answer,
   pushed down only as far as the note above them requires.           */
function layoutSidenotes(){
  const d = main.querySelector(".doc");
  if(!d) return;
  const notes = d.querySelectorAll('.block[data-kind="note"]');
  d.style.paddingBottom = "";
  if(!notes.length) return;
  if(!matchMedia("(min-width:1240px)").matches){ notes.forEach(x => x.style.top = ""); return; }
  let floor = 0, deepest = 0;
  notes.forEach(x => {
    let a = x.previousElementSibling;
    while(a && a.dataset.kind === "note") a = a.previousElementSibling;
    const top = Math.max(a ? a.offsetTop : 0, floor);
    x.style.top = top + "px";
    floor = top + x.offsetHeight + 16;
    deepest = Math.max(deepest, floor);
  });
  const over = deepest - d.offsetHeight;
  if(over > 0) d.style.paddingBottom = over + "px";
}
let rsT = null;
addEventListener("resize", () => { cancelAnimationFrame(rsT); rsT = requestAnimationFrame(layoutSidenotes); });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(layoutSidenotes);

/* ══ persistence ══════════════════════════════════════════════
   A document is saved the moment it is created, and after every change,
   so nothing that was asked for can vanish: a primer stopped, or closed,
   mid-way is in the library with its state, and can be resumed.       */
const TRANSIENT = ["busy","hl","pending","queued","error","stopped","retry","remove","fresh","plan","draw","find","live","status","raw"];
function cleanBlock(b){ const r = { ...b }; TRANSIENT.forEach(k => delete r[k]); return r; }
const saveT = new Map();
async function persist(d){
  await store.set("primer:doc:"+d.id, { ...d, blocks: d.blocks.map(cleanBlock) });
  const i = index.findIndex(x => x.id===d.id);
  const entry = { id:d.id, title:d.title, updated:Date.now(), status:d.status || "done", short:gaps(d).length };
  if(i>-1) index[i] = entry; else index.unshift(entry);
  await store.set("primer:index", index);
  if(route === "cover") renderLibrary();
}
function save(d, now){
  d = d || doc; if(!d) return;
  clearTimeout(saveT.get(d.id));
  if(now) return persist(d);
  saveT.set(d.id, setTimeout(() => persist(d), 400));
}
async function loadDoc(id){
  if(docs.has(id)) return docs.get(id);
  const d = await store.get("primer:doc:"+id);
  if(!d) return null;
  docs.set(id, d);
  resumable(d);
  return d;
}
async function openDoc(id){
  const d = await loadDoc(id);
  if(!d) return;
  doc = d; undoStack = []; route = "doc";
  render();
  scrollTo(0, 0);
}

/* A document back from storage: give every unfinished piece its error,
   its Retry, and a state the status row can explain. */
function resumable(d){
  if(!d.blocks.some(b => b.kind === "heading")){
    d.blocks = [{ id:uid(), kind:"prose", md:"", stopped: d.status !== "failed", retry:() => build(d),
      error: d.status === "failed" ? "Couldn't plan this explainer." + (d.statusNote ? " " + d.statusNote : "") : "The outline was never planned." }];
  }
  d.blocks.forEach(b => {
    if(b.md || b.src || b.error) return;
    if(b.slot){
      b.error = "Section " + (b.sec+1) + " wasn't written."; b.stopped = true;
      b.retry = () => retrySection(d, b.sec);
    }else if((b.kind === "figure" || b.kind === "image") && b.brief){
      b.error = b.kind === "figure" ? "Diagram wasn't drawn." : "Image wasn't found."; b.stopped = true;
      b.retry = () => retryVisual(d, b);
      b.remove = () => { swapBlock(d, b.id, []); save(d); };
    }
  });
  if(d.status === "planning" || d.status === "writing" || d.status === "researching"){
    d.status = "stopped"; d.statusNote = "the page was closed";
  }
}
/* What the writers need, derived from the document itself. */
function docContext(d){
  const titles = d.blocks.filter(b => b.kind==="heading").map(headingTitle);
  return { titles, outline: titles.map((s,i) => (i+1)+". "+s).join("\n"), reader: readerText(d.known) };
}
async function deleteDoc(id){
  const d = docs.get(id);
  if(d) stopRun(d);
  index = index.filter(x => x.id !== id);
  await store.set("primer:index", index);
  await store.del("primer:doc:"+id);
  await store.del("primer:raw:"+id);
  docs.delete(id); traces.delete(id); runs.delete(id);
  shelfSig = null;
  if(doc && doc.id === id){ doc = null; undoStack = []; route = "cover"; render(); scrollTo(0,0); }
  else renderLibrary();
}
function snapshot(){
  undoStack.push(JSON.parse(JSON.stringify(doc.blocks.map(cleanBlock))));
  if(undoStack.length > 30) undoStack.shift();
  undoBtn.classList.remove("hide");
}
function doUndo(){
  if(!undoStack.length || !doc || route!=="doc") return;
  doc.blocks = undoStack.pop();
  hideToast();
  render(); save();
}

/* ══ generation ═══════════════════════════════════════════════ */
/* Cheap progress: while a block is pending, the model's raw output so far is
   written into its slot. Kept on b.live so a full render() mid-stream keeps
   it; DOM updates are batched per frame and stop once the block is gone. */
const LIVE_TAIL = 1400;
function liveTail(s){ return s.length > LIVE_TAIL ? "…" + s.slice(-LIVE_TAIL) : s; }
function liveInto(d, b){
  let t = 0;
  return soFar => {
    b.live = soFar;
    if(t) return;
    t = requestAnimationFrame(() => {
      t = 0;
      if(route !== "doc" || doc !== d || !d.blocks.includes(b)) return;
      const body = main.querySelector(`[data-block-id="${b.id}"] .body`);
      if(!body) return;
      let pre = body.querySelector(".live");
      if(!pre){ pre = el("pre", "live"); body.appendChild(pre); }
      pre.textContent = liveTail(b.live);
    });
  };
}

/* A new document, on screen and in the library at once, then written. */
function startDoc(o){
  const d = { id:uid(), title:o.topic, topic:o.topic, known:o.known || "", instruction:o.instruction || "",
              created:Date.now(), status:"planning", blocks:[] };
  if(o.rewrite) d.rewrite = o.rewrite;
  docs.set(d.id, d);
  undoStack = []; doc = d; route = "doc";
  build(d);
  scrollTo(0, 0);
  return d;
}

/* Plan the outline, lay out the sections, then write them. */
async function build(d){
  const run = runOf(d); run.cancelled = false; run.active = true;
  d.status = "planning"; d.statusNote = "";
  d.blocks = [{ id:uid(), kind:"prose", pending:true, plan:true, md:"" }];
  rerender(d); save(d, true);

  const reader = readerText(d.known), rw = d.rewrite;
  let plan;
  try{
    plan = (await agent(d, { role:"outline", label:"planning", block:d.blocks[0],
      system: sys(rw ? "rewrite_outline" : "outline"),
      user: rw ? usr("rewrite_outline_user", { READER:reader, TOPIC:d.topic, INSTRUCTION:rw.instruction, SOURCE:rw.source })
               : usr("outline_user", { READER:reader, TOPIC:d.topic, INSTRUCTION:instrText(d) }) })).value;
    if(!plan || !Array.isArray(plan.sections) || !plan.sections.length) throw new Error("The outline came back empty.");
  }catch(e){
    d.status = e.stopped ? "stopped" : "failed"; d.statusNote = e.stopped ? "" : e.message;
    d.blocks = [{ id:uid(), kind:"prose", md:"", stopped:!!e.stopped, raw:rawOf(e), retry:() => build(d),
      error: e.stopped ? "Stopped before the outline was planned." : "Couldn't plan this explainer. " + e.message }];
    run.active = false;
    rerender(d); save(d); tidyRun(d);
    return;
  }
  d.title = String(plan.title || d.topic);
  d.blocks = [];
  plan.sections.map(String).forEach((title, i) => {
    d.blocks.push({ id:uid(), kind:"heading", md:"## "+title, sec:i, fresh:true });
    d.blocks.push({ id:uid(), kind:"prose", pending:true, queued:true, md:"", sec:i, slot:true });
  });
  d.status = "writing";
  rerender(d); save(d);
  await writeAll(d);
}

/* Resume after a stop, a failure, or a reload: plan if there is no outline,
   otherwise write whatever is still unwritten. */
function resume(d){
  if(running(d)) return;
  if(!d.blocks.some(b => b.kind === "heading")) return build(d);
  return writeAll(d);
}

/* Sections are written in order so each can build on the ones before it.
   Diagrams and images are made on a side queue and overlap with the next
   section. Then the research agent checks the text, if it is turned on. */
async function writeAll(d){
  const run = runOf(d); run.cancelled = false; run.active = true;
  const { titles, outline, reader } = docContext(d);
  d.status = "writing"; d.statusNote = "";
  save(d); deskRender();
  for(let i = 0; i < titles.length; i++){
    if(run.cancelled) break;
    const slot = d.blocks.find(b => b.slot && b.sec===i);
    if(!slot || slot.md) continue;
    Object.assign(slot, { pending:true, queued:false, error:"", stopped:false, retry:null, raw:"", live:"" });
    patch(d, slot);
    await genSection(d, i, titles[i], outline, reader);
  }
  if(!run.cancelled){
    d.blocks.filter(b => (b.kind==="figure" || b.kind==="image") && b.brief && !b.md && !b.src && !b.pending)
      .forEach(b => retryVisual(d, b));
  }
  await finish(d);
}
async function finish(d){
  const run = runOf(d);
  if(!run.cancelled && setting("research") && !d.researched) await research(d);
  await run.side;
  if(run.cancelled){
    d.blocks.filter(b => b.pending).forEach(b => markStopped(d, b));
    d.status = "stopped";
  }else d.status = "done";
  d.statusNote = "";
  run.active = false;
  rerender(d); save(d); tidyRun(d);
}
/* A pending block whose call will never come: shown stopped, with Retry. */
function markStopped(d, b){
  b.pending = false; b.queued = false; b.stopped = true; b.live = "";
  b.error = "Stopped.";
  if(b.slot) b.retry = () => retrySection(d, b.sec);
  else if(b.brief){ b.retry = () => retryVisual(d, b); b.remove = () => { swapBlock(d, b.id, []); save(d); }; }
  else b.retry = () => build(d);
  patch(d, b);
}

/* Everything already on the page before section i: headings, prose, and for
   each diagram or image its brief, plus its caption once it exists. */
function priorText(d, i){
  const parts = [];
  for(const b of d.blocks){
    if(b.sec == null || b.sec >= i) continue;
    if(b.kind === "heading" || b.kind === "prose" || b.kind === "note"){ if(b.md) parts.push(b.md); }
    else if((b.kind === "figure" || b.kind === "image") && (b.brief || b.caption)){
      parts.push((b.kind === "figure" ? "[Diagram]" : "[Image]") + (b.brief ? "\nBrief: " + b.brief : "") + (b.caption ? "\nCaption: " + b.caption : ""));
    }
  }
  return parts.join("\n\n");
}

async function genSection(d, i, title, outline, reader){
  const slot = d.blocks.find(b => b.slot && b.sec===i);
  if(!slot) return;
  const vars = { READER:reader, TITLE:d.title, OUTLINE:outline, N:i+1, SECTION:title,
                 PRIOR: priorText(d, i) || "(none yet)", INSTRUCTION: instrText(d) };
  const user = d.rewrite ? usr("rewrite_section_user", { ...vars, INSTRUCTION:d.rewrite.instruction, SOURCE:d.rewrite.source })
                         : usr("section_user", vars);
  try{
    const { value:arr, raws } = await agent(d, { role:"section", label:"writing §"+(i+1), sec:i, block:slot, system:sys("section"), user });
    const made = (Array.isArray(arr) ? arr : [])
      .filter(x => x && (x.md || ((x.kind==="figure" || x.kind==="image") && x.brief)))
      .map(x => {
        if(x.kind==="figure" && x.brief) return { id:uid(), kind:"figure", md:"", sec:i, brief:String(x.brief).trim(), pending:true, draw:true };
        if(x.kind==="image"  && x.brief) return { id:uid(), kind:"image",  md:"", sec:i, brief:String(x.brief).trim(), pending:true, find:true };
        return { id:uid(), kind:"prose", md:String(x.md), sec:i, fresh:true };
      });
    if(!made.some(b => b.md)){ const e = new Error("Empty section."); e.raws = raws; throw e; }
    replaceSlot(d, i, made);
    save(d);
    made.filter(b => b.draw || b.find).forEach(b =>
      sideLater(d, b, () => b.draw ? genFigure(d, b, title, outline, reader) : genImage(d, b, title)));
  }catch(e){
    replaceSlot(d, i, [{ id:uid(), kind:"prose", md:"", sec:i, slot:true, stopped:!!e.stopped, raw:rawOf(e),
      error: e.stopped ? "Stopped." : "Section "+(i+1)+" didn't come back. "+e.message,
      retry:() => retrySection(d, i) }]);
    save(d);
  }
}
function retrySection(d, i){
  const { titles, outline, reader } = docContext(d);
  const at = d.blocks.findIndex(b => b.slot && b.sec===i);
  if(at < 0) return;
  d.blocks.splice(at, 1, { id:uid(), kind:"prose", md:"", sec:i, slot:true, pending:true });
  rerender(d);
  runOf(d).cancelled = false;
  genSection(d, i, titles[i] || "", outline, reader).then(() => { save(d); deskRender(); tidyRun(d); });
}
function replaceSlot(d, i, blocks){
  const at = d.blocks.findIndex(b => b.slot && b.sec===i);
  if(at<0) return;
  d.blocks.splice(at, 1, ...blocks);
  rerender(d);
}
function swapBlock(d, id, blocks){
  const at = d.blocks.findIndex(b => b.id===id);
  if(at<0) return;
  d.blocks.splice(at, 1, ...blocks);
  rerender(d);
}

/* Diagrams and images are made one at a time, alongside the section being
   written. A stopped run marks what it never got to. */
function sideLater(d, b, fn){
  const run = runOf(d);
  run.side = run.side.then(async () => {
    if(run.cancelled){ markStopped(d, b); return; }
    await fn();
  }).catch(e => console.error(e));
}
function failedVisual(d, f, e){
  const b = { id:uid(), kind:f.kind, md:"", sec:f.sec, brief:f.brief, stopped:!!e.stopped, raw:rawOf(e),
    error: e.stopped ? "Stopped."
         : (f.kind === "figure" ? "Diagram didn't come back. " : e.notFound ? "No suitable image was found. " : "The image search didn't come back. ") + e.message };
  b.retry = () => retryVisual(d, b);
  b.remove = () => { swapBlock(d, b.id, []); save(d); };
  return b;
}
function retryVisual(d, b){
  const { titles, outline, reader } = docContext(d);
  const p = { id:uid(), kind:b.kind, md:"", sec:b.sec, brief:b.brief, pending:true };
  p[b.kind === "figure" ? "draw" : "find"] = true;
  swapBlock(d, b.id, [p]);
  runOf(d).cancelled = false;
  sideLater(d, p, () => (b.kind === "figure" ? genFigure(d, p, titles[b.sec] || "", outline, reader) : genImage(d, p, titles[b.sec] || ""))
    .then(() => { deskRender(); tidyRun(d); }));
}
/* The section's prose on either side of a visual's slot. */
function around(d, f){
  const idx = d.blocks.findIndex(b => b.id===f.id);
  const prose = b => b.kind==="prose" && b.md && b.sec===f.sec;
  return { idx,
    before: d.blocks.slice(0, idx).filter(prose).map(b=>b.md).join("\n\n"),
    after:  d.blocks.slice(idx+1).filter(prose).map(b=>b.md).join("\n\n") };
}

/* A figure the section writer asked for, queued as soon as that section's
   prose has landed. The illustrator sees the brief, the outline, and the
   whole section's prose, split at the slot. */
async function genFigure(d, f, sectionTitle, outline, reader){
  const { idx, before, after } = around(d, f);
  if(idx<0) return;
  const user = usr("figure_user", {
    READER: reader, TITLE: d.title, OUTLINE: outline, SECTION: sectionTitle,
    BEFORE: before || "(none)", AFTER: after || "(none)", BRIEF: f.brief
  });
  try{
    const { value:out, raws } = await agent(d, { role:"figure", label:"drawing §"+(f.sec+1), sec:f.sec, block:f, system:sys("figure"), user });
    const x = ((out && out.blocks)||[]).find(b => b && b.md);
    if(!x){ const e = new Error("Empty response."); e.raws = raws; throw e; }
    const made = { id:uid(), kind:"figure", md:x.md, sec:f.sec, brief:f.brief, fresh:true };
    if(x.caption) made.caption = String(x.caption).trim();
    swapBlock(d, f.id, [made]);
    save(d);
  }catch(e){
    swapBlock(d, f.id, [failedVisual(d, f, e)]);
    save(d);
  }
}

/* An image the section writer asked for. The finder searches the web,
   looks at candidates until one passes, and answers with the one it chose;
   the server then keeps a copy under media/ so the page never hotlinks. */
async function genImage(d, f, sectionTitle){
  const { idx, before, after } = around(d, f);
  if(idx<0) return;
  const user = usr("finder_user", { TITLE:d.title, SECTION:sectionTitle, BEFORE: before || "(none)", AFTER: after || "(none)", BRIEF:f.brief });
  try{
    const { value:out, raws } = await agent(d, { role:"finder", label:"finding image §"+(f.sec+1), sec:f.sec, block:f, system:sys("finder"), user });
    if(!out || !out.found || !out.url){
      const e = new Error(out && out.why ? String(out.why) : "Nothing suitable was found."); e.raws = raws; e.notFound = true; throw e;
    }
    const m = await saveMedia(String(out.url));
    const made = { id:uid(), kind:"image", md:"", sec:f.sec, brief:f.brief, fresh:true, src:m.local, url:String(out.url),
      page: out.page ? String(out.page) : "", title: out.title ? String(out.title).trim() : "",
      credit: out.credit ? String(out.credit).trim() : "", caption: out.caption ? String(out.caption).trim() : "",
      why: out.why ? String(out.why).trim() : "" };
    swapBlock(d, f.id, [made]);
    save(d);
  }catch(e){
    swapBlock(d, f.id, [failedVisual(d, f, e)]);
    save(d);
  }
}
async function saveMedia(url){
  const r = await fetch("/api/media", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ url }) });
  const j = await r.json().catch(() => ({}));
  if(!r.ok || !j.local) throw new Error("Couldn't fetch the chosen image. " + (j.error && j.error.message || r.status));
  return j;
}

/* ── research ─────────────────────────────── */
/* After the whole primer is written, one agent per section checks the key
   claims on the web. What it confirms gets a citation; what it refutes is
   rewritten in place, marked "corrected" in the margin with the reason and
   the source. The earlier wording is not kept.                          */
async function research(d){
  const run = runOf(d);
  const { titles } = docContext(d);
  d.status = "researching"; save(d); deskRender();
  for(let i = 0; i < titles.length; i++){
    if(run.cancelled) return;
    await researchSection(d, i);
  }
  if(!run.cancelled) d.researched = Date.now();
}
async function researchSection(d, i){
  const heading = d.blocks.find(b => b.kind==="heading" && b.sec===i);
  const blocks = d.blocks.filter(b => b.sec===i && b.kind==="prose" && b.md && !b.slot);
  if(!heading || !blocks.length) return;
  heading.status = "checking"; heading.fail = ""; patch(d, heading);
  try{
    const { value } = await agent(d, { role:"research", label:"checking §"+(i+1), sec:i, system:sys("research"),
      user: usr("research_user", { TITLE:d.title, SECTION:headingTitle(heading),
        BLOCKS: blocks.map((b,k) => "[" + (k+1) + "]\n" + b.md).join("\n\n") }) });
    heading.status = "";
    applyResearch(d, blocks, value || {});
  }catch(e){
    heading.status = "";
    heading.fail = e.stopped ? "" : "Sources weren't checked. " + e.message;
    patch(d, heading); save(d);
  }
}
function applyResearch(d, blocks, out){
  blocks.forEach(b => { delete b.cites; });
  for(const c of (Array.isArray(out.citations) ? out.citations : [])){
    const b = blocks[(c.block|0) - 1];
    if(!b || !c.url) continue;
    (b.cites = b.cites || []).push({ claim:String(c.claim||"").trim(), url:String(c.url), title:String(c.title||"").trim(), note:String(c.note||"").trim() });
  }
  for(const c of (Array.isArray(out.corrections) ? out.corrections : [])){
    const b = blocks[(c.block|0) - 1];
    if(!b || !c.md) continue;
    b.md = String(c.md);
    b.edit = { label:"Corrected", note:String(c.reason||"").trim(), url:String(c.url||""), ts:Date.now(), by:"research" };
    b.fresh = true;
  }
  rerender(d); save(d);
}
/* Run, or run again, on demand from the colophon. */
async function researchAll(d){
  if(running(d)) return;
  const run = runOf(d); run.cancelled = false; run.active = true;
  delete d.researched;
  rerender(d); deskRender();
  await research(d);
  d.status = run.cancelled ? "stopped" : "done";
  d.statusNote = run.cancelled ? "while checking sources" : "";
  run.active = false;
  rerender(d); save(d); tidyRun(d);
}

/* ══ editing ══════════════════════════════════════════════════ */
function context(d, idx){
  const outline = d.blocks.filter(b=>b.kind==="heading").map(headingTitle).join(" · ");
  const before = d.blocks.slice(Math.max(0,idx-2), idx).map(b=>b.md).join("\n\n");
  const after  = d.blocks.slice(idx+1, idx+3).map(b=>b.md).join("\n\n");
  return { outline, before, after };
}

async function applyEdit(blockId, act, question){
  const d = doc;
  const idx = d.blocks.findIndex(b => b.id===blockId);
  if(idx<0) return;
  const target = d.blocks[idx];
  const a = ACTIONS[act];
  const highlighted = (sel && sel.blockId===blockId && sel.text) ? sel.text : target.md;

  snapshot();
  target.busy = act;
  target.hl = (sel && sel.blockId===blockId && sel.text) ? sel.text : "";
  inFlight++;
  patch(d, target);

  const { outline, before, after } = context(d, idx);
  const user = usr("edit_user", {
    READER: readerText(d.known),
    TITLE: d.title,
    OUTLINE: outline,
    BEFORE: before || "(none)",
    TARGET: target.md,
    AFTER: after || "(none)",
    HIGHLIGHT: highlighted,
    QUESTION: question || "(nothing)",
    ACTION: rawPrompt(act==="figure" ? "figure_action" : act)
  });
  const role = act==="figure" ? "figure" : "edit";
  const secLabel = target.sec != null ? " §" + (target.sec+1) : "";

  try{
    const { value:out, raws } = await agent(d, { role, label: word(a) + secLabel, sec:target.sec, system:sys(role), user });
    const blocks = ((out && out.blocks)||[]).filter(x => x && x.md);
    if(!blocks.length){ const e = new Error("Empty response."); e.raws = raws; throw e; }
    const stamp = { label:a.label, note:question||"", quote:highlighted.slice(0,220), ts:Date.now() };
    const made = blocks.map(x => {
      const b = { id:uid(), kind: act==="figure" ? "figure" : (x.kind==="note" ? "note" : "prose"),
        md:x.md, sec:target.sec, edit:stamp, fresh:true };
      if(act==="figure" && x.caption) b.caption = String(x.caption).trim();
      return b;
    });
    target.busy = false; delete target.hl; inFlight--; clearHighlight();
    const at = d.blocks.indexOf(target);
    const replaced = act!=="figure" && out.mode==="replace";
    if(at < 0) d.blocks.push(...made);
    else if(replaced) d.blocks.splice(at, 1, ...made);
    else d.blocks.splice(at+1, 0, ...made);
    if(doc === d && route === "doc"){
      render();
      const first = main.querySelector(`[data-block-id="${made[0].id}"]`);
      if(first) first.scrollIntoView({block:"nearest", behavior:"smooth"});
    }
    save(d);
    toast(replaced ? "Replaced" : "Added", { undo:true });
  }catch(e){
    target.busy = false; delete target.hl; inFlight--; clearHighlight();
    if(doc === d) undoStack.pop();
    patch(d, target);
    undoBtn.classList.toggle("hide", !undoStack.length);
  }finally{
    tidyRun(d); deskRender();
  }
}

/* ══ the pen ══════════════════════════════════════════════════ */
/* Keep the chosen span visibly marked while its revision is in flight.
   CSS Custom Highlight API: no DOM changes, so KaTeX and markup are safe.
   The block is re-rendered when it goes busy, so the span is found again
   by text inside the fresh element.                                   */
const canHighlight = typeof CSS !== "undefined" && CSS.highlights && typeof Highlight === "function";
function clearHighlight(){ if(canHighlight) CSS.highlights.delete("pen"); }
function highlightRange(range){ if(canHighlight && range) CSS.highlights.set("pen", new Highlight(range)); }
/* Find `text` in root's text nodes, tolerant of whitespace; a Range or null. */
function locate(root, text){
  if(!root || !text) return null;
  const nodes = [], walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n, all = "";
  while((n = walker.nextNode())){ nodes.push({ n, start: all.length }); all += n.textContent; }
  let i = all.indexOf(text);
  if(i < 0){
    const squash = s => s.replace(/\s+/g, " ");
    const map = []; let sq = "";
    for(let k = 0; k < all.length; k++){
      const c = /\s/.test(all[k]) ? " " : all[k];
      if(c === " " && sq.endsWith(" ")) continue;
      map.push(k); sq += c;
    }
    const want = squash(text).trim();
    const j = want ? sq.indexOf(want) : -1;
    if(j < 0) return null;
    i = map[j];
    text = all.slice(i, map[j + want.length - 1] + 1);
  }
  const at = pos => { let last = nodes[0]; for(const x of nodes){ if(x.start > pos) break; last = x; } return last; };
  const a = at(i), b = at(i + text.length - 1);
  if(!a || !b) return null;
  const r = document.createRange();
  r.setStart(a.n, i - a.start); r.setEnd(b.n, i + text.length - b.start);
  return r;
}
function highlightIn(root, text){ if(canHighlight) highlightRange(locate(root, text)); }
function readSelection(){
  const s = window.getSelection();
  if(!s || s.isCollapsed || !s.rangeCount) return null;
  const text = s.toString().trim();
  if(text.length < 2) return null;
  let n = s.anchorNode;
  if(n && n.nodeType===3) n = n.parentElement;
  const block = n && n.closest ? n.closest("[data-block-id]") : null;
  if(!block || block.classList.contains("pending") || block.classList.contains("busy")) return null;
  if(block.dataset.kind === "image") return null;
  return { blockId: block.dataset.blockId, text, rect: s.getRangeAt(0).getBoundingClientRect() };
}
function placeTools(rect){
  pen.classList.add("show");
  if(docked()){ pen.style.left = ""; pen.style.top = ""; return; }
  const w = pen.offsetWidth, h = pen.offsetHeight;
  let x = rect.left + window.scrollX + rect.width/2 - w/2;
  x = Math.max(8, Math.min(x, document.documentElement.clientWidth - w - 8));
  let y = rect.top + window.scrollY - h - 10;
  const headH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--head")) * 16 || 58;
  if(y < window.scrollY + headH + 4) y = rect.bottom + window.scrollY + 10;
  pen.style.left = x+"px"; pen.style.top = y+"px";
}
function hideTools(){ pen.classList.remove("show","asking"); askInput.value = ""; if(!inFlight) clearHighlight(); }
let inFlight = 0;
function showForSelection(){
  const s = readSelection();
  if(!s){ if(!pen.classList.contains("asking")) hideTools(); return; }
  sel = s; placeTools(s.rect);
}
document.addEventListener("mouseup", e => {
  if(pen.contains(e.target) || pop.contains(e.target) || outline.contains(e.target)) return;
  setTimeout(showForSelection, 10);
});
document.addEventListener("keyup", e => {
  if(!e.shiftKey) return;
  const s = readSelection();
  if(s){ sel = s; placeTools(s.rect); }
});
let selT = null;
document.addEventListener("selectionchange", () => {
  if(!matchMedia("(pointer:coarse)").matches) return;
  clearTimeout(selT); selT = setTimeout(showForSelection, 350);
});
document.addEventListener("mousedown", e => {
  if(!rawEl.hidden && !rawEl.contains(e.target)) hideRaw();
  if(!pen.contains(e.target) && !pen.classList.contains("asking")) hideTools();
  if(!pop.contains(e.target)) closePop();
  if(!outline.contains(e.target) && !runhead.contains(e.target)) closeOutline();
  if(!menu.contains(e.target) && !menuBtn.contains(e.target)) closeMenu(menu, menuBtn);
  if(!rewriteMenu.contains(e.target) && !rewriteBtn.contains(e.target)) closeMenu(rewriteMenu, rewriteBtn);
});
function trigger(act){
  if(!sel) return;
  if(act==="ask"){
    const s = window.getSelection();
    if(s && s.rangeCount) highlightRange(s.getRangeAt(0).cloneRange());
    pen.classList.add("asking"); askInput.focus(); return;
  }
  const {blockId} = sel;
  hideTools();
  applyEdit(blockId, act, "");
}
pen.addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if(b) trigger(b.dataset.act);
});
$("#askForm").onsubmit = e => {
  e.preventDefault();
  const q = askInput.value.trim();
  if(!q || !sel) return;
  const {blockId} = sel;
  hideTools();
  applyEdit(blockId, "ask", q);
};
askInput.onkeydown = e => {
  if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); pen.classList.remove("asking"); askInput.value=""; clearHighlight(); }
};

/* ══ popovers ═════════════════════════════════════════════════
   One card, many contents: the provenance of a revision, the source of an
   image, the source behind a citation. Click pins it; hover shows it while
   the pointer is on the anchor or the card.                           */
function showPop(anchor, nodes, o){
  closePops();
  pop.replaceChildren(...nodes);
  pop.dataset.hover = (o && o.hover) ? "1" : "";
  pop.classList.add("show");
  anchor.setAttribute("aria-expanded", "true");
  pop._anchor = anchor;
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth;
  let x = r.left + window.scrollX - 4;
  x = Math.max(8, Math.min(x, document.documentElement.clientWidth - w - 8));
  pop.style.left = x + "px";
  pop.style.top  = (r.bottom + window.scrollY + 8) + "px";
}
function closePop(){
  if(pop._anchor){ pop._anchor.removeAttribute("aria-expanded"); pop._anchor = null; }
  pop.classList.remove("show");
  pop.dataset.hover = "";
}
let hoverT = null;
function hoverable(anchor, build){
  anchor.addEventListener("mouseenter", () => {
    clearTimeout(hoverT);
    hoverT = setTimeout(() => { if(pop._anchor !== anchor) showPop(anchor, build(), { hover:true }); }, 140);
  });
  anchor.addEventListener("mouseleave", leavePop);
}
function leavePop(){
  clearTimeout(hoverT);
  hoverT = setTimeout(() => { if(pop.dataset.hover && !pop.matches(":hover")) closePop(); }, 220);
}
pop.addEventListener("mouseenter", () => clearTimeout(hoverT));
pop.addEventListener("mouseleave", () => { if(pop.dataset.hover) leavePop(); });

function linkRow(items){
  const row = el("div", "row");
  items.forEach(x => {
    if(!x) return;
    if(x.href){ const a = el("a", null, x.label); a.href = x.href; a.target = "_blank"; a.rel = "noopener"; a.append(el("span", "host", host(x.href))); row.append(a); }
    else row.append(btn(null, x.label, x.onclick));
  });
  return row;
}
function kRow(label, ts){
  const k = el("div", "k", label);
  if(ts){ const t = el("time", null, timeAgo(ts)); t.dateTime = new Date(ts).toISOString(); k.appendChild(t); }
  return k;
}
/* A revision: who asked for it and why; a research correction: the reason and its source. */
function provNodes(b){
  const e = b.edit, nodes = [kRow(e.label, e.ts)];
  if(e.by === "research"){
    nodes.push(el("div", "s", e.note || "The research agent corrected this block."));
    nodes.push(linkRow([ e.url && { label:"Source", href:e.url } ]));
  }else{
    nodes.push(el("div", "q", e.note ? e.note : "“" + e.quote + "”"));
    nodes.push(linkRow([{ label:"Remove", onclick:() => {
      snapshot();
      doc.blocks = doc.blocks.filter(x => x.id!==b.id);
      closePops(); render(); save();
      toast("Removed", { undo:true });
    } }]));
  }
  return nodes;
}
/* An image the finder chose: what it is, where it came from, why it passed. */
function sourceNodes(b){
  const nodes = [kRow("Found online")];
  if(b.title) nodes.push(el("div", "t", b.title));
  if(b.credit) nodes.push(el("div", "s", b.credit));
  if(b.why) nodes.push(el("div", "q", b.why));
  nodes.push(linkRow([ b.page && { label:"Page", href:b.page }, b.url && { label:"Image", href:b.url } ]));
  return nodes;
}
/* A citation: the source and what it says about the claim. */
function citeNodes(c, n){
  const nodes = [kRow("Source " + n)];
  if(c.title) nodes.push(el("div", "t", c.title));
  if(c.note) nodes.push(el("div", "s", c.note));
  if(c.claim) nodes.push(el("div", "q", "“" + c.claim + "”"));
  nodes.push(linkRow([{ label:"Open", href:c.url }]));
  return nodes;
}
function closePops(){
  closePop();
  closeOutline();
  closeMenu(menu, menuBtn);
  closeMenu(rewriteMenu, rewriteBtn);
}

/* ══ menus ════════════════════════════════════════════════════ */
function openMenu(m, anchor, nodes){
  closePops();
  m.replaceChildren(...nodes);
  m.classList.add("show");
  anchor.setAttribute("aria-expanded", "true");
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth;
  let x = r.right - w;
  x = Math.max(8, Math.min(x, document.documentElement.clientWidth - w - 8));
  m.style.left = (x + window.scrollX) + "px";
  m.style.top  = (r.bottom + window.scrollY + 6) + "px";
}
function closeMenu(m, anchor){ m.classList.remove("show"); anchor.setAttribute("aria-expanded", "false"); }

/* Pages that are not documents: Prompts, Settings, Raw. */
const PAGES = [
  { route:"prompts",  label:"Prompts" },
  { route:"settings", label:"Settings" },
  { route:"raw",      label:"Raw" }
];
function goto(r){
  route = (route === r) ? (doc ? "doc" : "cover") : r;
  render(); scrollTo(0, 0);
}
menuBtn.onclick = () => {
  if(menu.classList.contains("show")) return closeMenu(menu, menuBtn);
  openMenu(menu, menuBtn, PAGES.map(p => {
    const b = btn(route === p.route ? "cur" : "", p.label, () => { closeMenu(menu, menuBtn); goto(p.route); });
    b.setAttribute("role", "menuitem");
    return b;
  }));
};

/* Rewrite: this primer, read in full by the planner and the writer, as a
   new one that follows an instruction. Presets, or your own words. */
rewriteBtn.onclick = () => {
  if(rewriteMenu.classList.contains("show")) return closeMenu(rewriteMenu, rewriteBtn);
  const src = doc;
  const nodes = [el("span", "hint", "Rewrite as a new primer")];
  REWRITES.forEach(r => {
    const b = btn(null, r.label, () => startRewrite(src, r.text));
    b.setAttribute("role", "menuitem"); b.title = r.text;
    nodes.push(b);
  });
  const form = el("form");
  const input = el("input"); input.placeholder = "Or say what should change…"; input.setAttribute("aria-label", "Rewrite instruction");
  const go = btn(null, "Rewrite"); go.type = "submit";
  form.append(input, go);
  form.onsubmit = e => { e.preventDefault(); const t = input.value.trim(); if(t) startRewrite(src, t); };
  nodes.push(form);
  openMenu(rewriteMenu, rewriteBtn, nodes);
  input.focus();
};
function startRewrite(src, instruction){
  closePops();
  startDoc({ topic: src.topic || src.title, known: src.known,
    rewrite:{ of:src.id, ofTitle:src.title, instruction, source:docText(src) } });
}
/* The whole primer as text, for the rewrite prompts. */
function docText(d){
  return "# " + d.title + "\n\n" + d.blocks.map(b => {
    if(b.kind === "figure") return "[Diagram" + (b.caption ? ": " + b.caption : b.brief ? ": " + b.brief : "") + "]";
    if(b.kind === "image")  return "[Image" + (b.caption ? ": " + b.caption : b.brief ? ": " + b.brief : "") + "]";
    return b.md || "";
  }).filter(Boolean).join("\n\n");
}

/* ══ running head + outline ═══════════════════════════════════ */
function headingText(h){ const b = h.querySelector(".body"); return b ? b.textContent.trim() : ""; }
function currentHeading(){
  const hs = main.querySelectorAll('.block[data-kind="heading"]');
  let cur = null, n = 0;
  hs.forEach((h,i) => { if(h.getBoundingClientRect().top <= 120){ cur = h; n = i+1; } });
  return { cur, n };
}
const PAGE_TITLES = { prompts:"Prompts", settings:"Settings", raw:"Raw" };
function updateRunhead(){
  runhead.replaceChildren();
  let show = false;
  const title = main.querySelector(".title");
  const past = title ? title.getBoundingClientRect().bottom < 40 : false;
  if(PAGE_TITLES[route]){
    runhead.textContent = PAGE_TITLES[route] + (route === "raw" && doc ? " · " + doc.title : ""); show = past;
  }else if(route === "doc" && doc){
    const { cur, n } = currentHeading();
    if(cur){ runhead.append(el("span","n","§ "+n), headingText(cur)); }
    else runhead.textContent = doc.title;
    show = past;
  }
  runhead.classList.toggle("show", show);
  if(!show) closeOutline();
}
let scT = null;
addEventListener("scroll", () => { cancelAnimationFrame(scT); scT = requestAnimationFrame(updateRunhead); }, {passive:true});

function openOutline(){
  outline.replaceChildren();
  if(route === "doc" && doc){
    const { n:curN } = currentHeading();
    const hs = main.querySelectorAll('.block[data-kind="heading"]');
    hs.forEach((h,i) => {
      const b = btn(i+1===curN ? "cur" : "", null, () => { closeOutline(); h.scrollIntoView({behavior:"smooth", block:"start"}); });
      b.setAttribute("role","menuitem");
      b.append(el("span","n","§ "+(i+1)), headingText(h));
      outline.appendChild(b);
    });
    const foot = el("div", "foot");
    foot.appendChild(btn(null, "Export", () => { closeOutline(); exportDoc(); }));
    outline.appendChild(foot);
  }else if(route === "prompts"){
    Object.keys(PROMPTS).forEach(k => {
      const b = btn(null, PROMPTS[k].label, () => { closeOutline(); const r = main.querySelector(`.prow[data-key="${k}"]`); if(r) r.scrollIntoView({behavior:"smooth", block:"start"}); });
      b.setAttribute("role","menuitem");
      outline.appendChild(b);
    });
  }
  if(!outline.children.length) return;
  outline.classList.add("show");
  runhead.setAttribute("aria-expanded", "true");
  const r = runhead.getBoundingClientRect(), w = outline.offsetWidth;
  let x = r.left + r.width/2 - w/2;
  x = Math.max(8, Math.min(x, document.documentElement.clientWidth - w - 8));
  outline.style.left = (x + window.scrollX) + "px";
  outline.style.top  = (r.bottom + window.scrollY + 6) + "px";
}
function closeOutline(){ outline.classList.remove("show"); runhead.setAttribute("aria-expanded", "false"); }
runhead.onclick = () => outline.classList.contains("show") ? closeOutline() : openOutline();

/* ══ toast ════════════════════════════════════════════════════ */
let toastT = null;
function toast(msg, o){
  o = o || {};
  toastEl.replaceChildren(el("span", null, msg));
  toastEl.classList.toggle("err", !!o.err);
  if(o.undo){
    toastEl.appendChild(btn(null, "Undo", () => { hideToast(); doUndo(); }));
  }
  if(o.raw){
    toastEl.appendChild(btn(null, "Raw", () => { hideToast(); showRaw(o.raw); }));
  }
  toastEl.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(hideToast, o.raw ? 14000 : o.err ? 9000 : 6000);
}
function hideToast(){ toastEl.classList.remove("show"); }

/* ══ raw response inspector ═══════════════════════════════════ */
const rawEl = $("#raw"), rawText = $("#rawText");
function showRaw(text){ rawText.textContent = text; rawEl.hidden = false; $("#rawClose").focus(); }
function hideRaw(){ rawEl.hidden = true; }
$("#rawClose").onclick = hideRaw;
$("#rawCopy").onclick = () => copyText(rawText.textContent, rawText);
async function copyText(text, node){
  try{ await navigator.clipboard.writeText(text); toast("Copied"); }
  catch(e){ if(node){ const r = document.createRange(); r.selectNodeContents(node); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } }
}

/* ══ prompts page ═════════════════════════════════════════════ */
function renderPrompts(){

  Object.keys(PROMPTS).forEach(k => {

      clearTimeout(t);
      t = setTimeout(async () => {

        await store.set("primer:prompts", overrides);
      }, 350);

/* ══ settings page ════════════════════════════════════════════
   Drawn from SETTINGS. One control per type; add a type here to use it. */
const CONTROLS = {
  bool(k, s, onChange){
    const b = btn("switch"); b.setAttribute("role", "switch"); b.setAttribute("aria-label", s.label);
    const paint = () => b.setAttribute("aria-checked", String(!!setting(k)));

  },
  select(k, s, onChange){

    const paint = () => g.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.value === String(setting(k))));
    (s.options || []).forEach(o => { const b = btn(null, o.label, () => { onChange(o.value); paint(); }); b.dataset.value = String(o.value); g.append(b); });

  },

};
function renderSettings(){

/* ══ raw page ═════════════════════════════════════════════════
   Every call made for the open primer, in order: what went out, what the
   agent did, what came back. Calls in flight update in place.         */
async function renderRaw(){
  const page = el("article", "doc rawpage");
  page.innerHTML = `<header class="doc-head"><h1 class="title">Raw</h1><dl class="meta"></dl></header>`;
  main.replaceChildren(page);
  if(!doc){
    page.append(el("p", "empty", "Open a primer to see every call made for it: the prompts that went out, the tools the agents used, and the text that came back."));
    return;
  }
  const d = doc, t = await traceOf(d.id);
  if(route !== "raw" || doc !== d || !main.contains(page)) return;
  const meta = page.querySelector(".meta");
  const row = (k, v) => { meta.append(el("dt", null, k), el("dd", null, v)); };
  row("Primer", d.title);
  const failed = t.filter(c => c.status === "error").length, live = t.filter(c => c.status === "running").length;
  row("Calls", t.length + (failed ? " · " + failed + " failed" : "") + (live ? " · " + live + " running" : ""));
  if(!t.length) page.append(el("p", "empty", "No calls yet."));
  t.forEach((rec, i) => page.append(callEl(rec, i)));
}
function stText(rec){
  const dur = (((rec.ended || Date.now()) - rec.started) / 1000).toFixed(1) + "s";
  const s = rec.status === "ok" ? "ok" : rec.status === "running" ? "running" : rec.status === "stopped" ? "stopped" : "failed";
  return s + " · " + dur + (rec.error && rec.status === "error" ? " · " + rec.error : "");
}
function evNode(ev){
  const li = el("li");
  if(ev.kind === "start"){ li.append(el("span", "k", "model"), ev.model + (ev.tools && ev.tools.length ? "  tools: " + ev.tools.join(", ") : "  no tools")); }
  else if(ev.kind === "tool"){ li.append(el("span", "k", "→ " + ev.name), JSON.stringify(ev.input)); }
  else if(ev.kind === "result"){ li.className = ev.ok ? "" : "bad"; li.append(el("span", "k", ev.ok ? "←" : "← error"), ev.text || ""); }
  else if(ev.kind === "retry"){ li.append(el("span", "k", "↻ asking again"), ev.reason + "\n" + (ev.output || "")); }
  else li.append(JSON.stringify(ev));
  return li;
}
function callEl(rec, i){
  const d = el("details", "call"); d.dataset.callId = rec.id;
  d.classList.toggle("running", rec.status === "running");
  d.classList.toggle("err", rec.status === "error");
  const s = el("summary");
  s.append(el("span", "n", String(i+1)), el("span", "what", rec.label || rec.role),
           el("span", "who", rec.role + (rec.model ? " → " + rec.model : "")), el("span", "st", stText(rec)));
  d.append(s);
  const body = el("div", "call-body");
  const part = (title, text, cls) => {
    const h = el("h4", null, title), pre = el("pre", cls, text || "");
    h.append(btn(null, "copy", () => copyText(pre.textContent, pre)));
    body.append(h, pre);
    return pre;
  };
  part("System", rec.system);
  part("User", rec.user);
  body.append(el("h4", null, "Events"));
  const ol = el("ol", "events"); rec.events.forEach(ev => ol.append(evNode(ev))); body.append(ol);
  part("Output", rec.output, "out");
  d.append(body);
  return d;
}
/* Keep a running call's row current while the Raw page is open. */
let rawT = 0;
function rawLive(rec){
  if(route !== "raw" || !doc || rec.docId !== doc.id || rawT) return;
  rawT = requestAnimationFrame(() => {
    rawT = 0;
    if(route !== "raw" || !doc || rec.docId !== doc.id) return;
    const page = main.querySelector(".rawpage");
    if(!page) return;
    let d = page.querySelector(`[data-call-id="${rec.id}"]`);
    if(!d){ page.querySelector(".empty")?.remove(); d = callEl(rec, page.querySelectorAll(".call").length); page.append(d); return; }
    d.classList.toggle("running", rec.status === "running");
    d.classList.toggle("err", rec.status === "error");
    d.querySelector(".st").textContent = stText(rec);
    d.querySelector(".out").textContent = rec.output || "";
    const ol = d.querySelector(".events");
    while(ol.children.length < rec.events.length) ol.append(evNode(rec.events[ol.children.length]));
  });
}
/* Jump to one call, from an issue on the desk. */
async function openRaw(docId, callId){
  const d = await loadDoc(docId);
  if(!d) return;
  doc = d; route = "raw";
  await renderRaw();
  paintHeader(); updateRunhead();
  const c = main.querySelector(`[data-call-id="${callId}"]`);
  if(c){ c.open = true; c.scrollIntoView({ block:"start", behavior:"smooth" }); }
}

/* ══ export ═══════════════════════════════════════════════════ */
function exportDoc(){
  if(!doc) return;
  const sources = [];
  const md = "# " + doc.title + "\n\n" + doc.blocks.map(b => {
    if(b.kind==="figure") return "<!-- diagram -->\n" + b.md + (b.caption ? "\n\n*" + b.caption + "*" : "");
    if(b.kind==="image")  return "![" + (b.title || b.caption || "") + "](" + (b.url || b.src) + ")" + (b.caption ? "\n\n*" + b.caption + "*" : "");
    let t = b.md;
    (b.cites || []).forEach(c => { sources.push(c); t += " [" + sources.length + "]"; });
    return t;
  }).join("\n\n") + (sources.length ? "\n\n## Sources\n\n" + sources.map((c,i) => (i+1) + ". " + (c.title ? c.title + " · " : "") + c.url).join("\n") : "") + "\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([md], {type:"text/markdown"}));
  a.download = doc.title.replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-").toLowerCase() + ".md";
  a.click(); URL.revokeObjectURL(a.href);
}

/* ══ theme ════════════════════════════════════════════════════ */
function setTheme(t, persist){
  document.documentElement.dataset.theme = t;
  themeBtn.setAttribute("aria-label", t==="dark" ? "Day" : "Night");
  if(persist){ try{ localStorage.setItem("primer:theme", t); }catch(e){} }
}
themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme==="dark" ? "light" : "dark", true);
try{
  matchMedia("(prefers-color-scheme:dark)").addEventListener("change", e => {
    if(!localStorage.getItem("primer:theme")) setTheme(e.matches ? "dark" : "light", false);
  });
}catch(e){}

/* ══ header + keys ════════════════════════════════════════════ */
$("#homeBtn").onclick = () => { route = "cover"; render(); scrollTo(0,0); };
newBtn.onclick = () => { route = "cover"; render(); scrollTo(0,0); const t = $("#cTopic"); if(t) t.focus(); };
stopBtn.onclick = () => { if(doc) stopRun(doc); };
undoBtn.onclick = doUndo;

document.addEventListener("keydown", e => {
  const tag = document.activeElement && document.activeElement.tagName;
  const inField = tag==="INPUT" || tag==="TEXTAREA";
  if(e.key === "Escape"){
    if(!rawEl.hidden){ hideRaw(); return; }
    if(outline.classList.contains("show")){ closeOutline(); return; }
    if(menu.classList.contains("show")){ closeMenu(menu, menuBtn); return; }
    if(rewriteMenu.classList.contains("show")){ closeMenu(rewriteMenu, rewriteBtn); return; }
    if(pop.classList.contains("show")){ closePop(); return; }
    if(pen.classList.contains("show")){ hideTools(); return; }
    return;
  }
  if((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase()==="z" && !inField){
    if(route==="doc" && undoStack.length){ e.preventDefault(); doUndo(); hideToast(); }
    return;
  }
  if(!inField && !e.metaKey && !e.ctrlKey && !e.altKey &&
     pen.classList.contains("show") && !pen.classList.contains("asking")){
    const act = Object.keys(ACTIONS).find(k => ACTIONS[k].key === e.key);
    if(act){ e.preventDefault(); trigger(act); }
  }
});

/* ══ boot ═════════════════════════════════════════════════════ */
(async function boot(){
  $("#homeBtn").insertAdjacentHTML("afterbegin", LOGO);
  setTheme(document.documentElement.dataset.theme || "light", false);
  const missing = await loadPrompts();
  index = (await store.get("primer:index")) || [];
  overrides = (await store.get("primer:prompts")) || {};
  settings = (await store.get("primer:settings")) || {};
  applySettings();
  render();
  if(missing.length) toast("Couldn't read " + (missing.length===1 ? "prompts/"+missing[0]+".txt" : missing.length+" files in prompts/") +
    ". Primer has to be served over http, e.g. npm start", { err:true });
})();
</script>
