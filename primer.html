<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>primer</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>/* theme and look before first paint */
(function(){try{var d=document.documentElement,t=localStorage.getItem("primer:theme")||"";d.dataset.theme=t==="dark"||t==="paper-dark"||(!t&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light";if(t.indexOf("paper")===0)d.dataset.look="paper";}catch(e){}})();
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.14/purify.min.js"></script>

<style>
/* ══ tokens ═══════════════════════════════════════════════════
   Four themes. Plain: white, black, grey, and one blue for anything that
   can be followed, in the system face. Paper: warm paper and ink with an
   editor's red, in Fraunces, Literata and Plex Mono. Each light and
   dark: data-theme is the palette's side, data-look the family, and a
   look brings its faces as well as its colours.                      */
:root{
  --bg:#fff; --bg-2:#f6f6f6;
  --fg:#1a1a1a; --fg-2:#5c5c5c; --fg-3:#8c8c8c;
  --rule:#e5e5e5; --rule-2:#c9c9c9;
  --accent:#0b47b5; --accent-line:rgba(11,71,181,.35); --accent-bg:rgba(11,71,181,.07);
  --lift:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.07);
  --col:40rem; --gutter:1.5rem; --marg:6rem; --side:13rem; --sgap:2.5rem; --head:2.5rem;
  --text:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --disp:Charter,"Iowan Old Style",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#141414; --bg-2:#1e1e1e;
  --fg:#e6e6e6; --fg-2:#a6a6a6; --fg-3:#767676;
  --rule:#2a2a2a; --rule-2:#3f3f3f;
  --accent:#8ab4f8; --accent-line:rgba(138,180,248,.4); --accent-bg:rgba(138,180,248,.1);
  --lift:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.45);
  color-scheme:dark;
}
:root[data-look="paper"]{
  --bg:#F5F0E6; --bg-2:#ECE5D6;
  --fg:#1E1A15; --fg-2:#564A3F; --fg-3:#8E8375;
  --rule:#E0D8C8; --rule-2:#CBC0AC;
  --accent:#A23B2A; --accent-line:rgba(162,59,42,.35); --accent-bg:rgba(162,59,42,.08);
  --lift:0 1px 2px rgba(50,35,20,.10),0 4px 14px rgba(50,35,20,.14);
  --text:"Literata",Charter,"Iowan Old Style",Georgia,serif;
  --disp:"Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
:root[data-look="paper"][data-theme="dark"]{
  --bg:#191613; --bg-2:#12100E;
  --fg:#EAE2D4; --fg-2:#B7AC9D; --fg-3:#7E7468;
  --rule:#2D2721; --rule-2:#3D352D;
  --accent:#E2836B; --accent-line:rgba(226,131,107,.4); --accent-bg:rgba(226,131,107,.12);
  --lift:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.55);
}

/* ══ base ═════════════════════════════════════════════════════ */
*{box-sizing:border-box}
html{background:var(--bg);overscroll-behavior-y:none}
body{
  margin:0; min-height:100dvh; background:var(--bg); color:var(--fg);
  font-family:var(--text); font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
[hidden]{display:none!important}
a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:var(--accent-line);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}

/* Small text, used for everything that is not the reading matter: labels,
   metadata, controls. One size, one colour, no capitals. */
.lab{display:block;font-size:13px;line-height:1.4;font-weight:400;color:var(--fg-3);margin:0 0 .3rem}
:root[data-look="paper"] .lab{font-size:14px;font-weight:500;font-variant-caps:all-small-caps;letter-spacing:.12em}
.empty{font-size:15px;color:var(--fg-3);margin:0}

/* ══ header ═══════════════════════════════════════════════════ */
.head{
  position:sticky; top:0; z-index:40; height:var(--head);
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:0 .75rem; background:var(--bg); border-bottom:1px solid transparent;
  font-size:13px;
}
.head.scrolled{border-bottom-color:var(--rule)}
.wordmark{display:inline-flex;align-items:center;gap:.55rem;color:var(--fg);font-family:var(--disp);font-size:20px;line-height:1}
.wordmark svg{width:19px;height:19px;display:block;flex:0 0 auto}
.wordmark:hover{color:var(--accent)}
.acts{display:flex;align-items:center;gap:1.1rem}
.act{color:var(--fg-2);white-space:nowrap}
.act:hover{color:var(--fg)}
.act.on{color:var(--fg);text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--rule-2)}
.act.hide{display:none}
.act.back{font-size:17px;line-height:1;position:relative;top:-1px}
/* Feedback stands out from the other words in the bar: this is a beta,
   and hearing back matters more than quiet. */
.act.feedback{color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:.22rem .7rem;line-height:1.2}
.act.feedback:hover,.act.feedback[aria-expanded="true"]{background:var(--accent);color:#fff}
.act.stop{color:var(--accent)}
.act.stop::before{
  content:""; display:inline-block; width:.4em; height:.4em; border-radius:50%; background:currentColor;
  margin-right:.45em; vertical-align:middle; position:relative; top:-.1em; animation:pulse 1.6s ease-in-out infinite;
}

main{padding:1.5rem var(--gutter) 8rem}

/* ══ cover ════════════════════════════════════════════════════
   A topic line, then the list. The rest of the form appears once there is
   a topic to write about.                                               */
.cover{max-width:var(--col);margin:3.5rem auto 0}
@media (min-width:1100px){
  /* The two columns share a first baseline: the library's head sits on the greeting's line. */
  .cover:has(.shelf){max-width:72rem;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 3.5rem;align-items:baseline}
  .cover:has(.shelf) .library{margin-top:0;padding-left:3.5rem;border-left:1px solid var(--rule)}
}
.title.hello{display:flex;align-items:center;gap:.6rem;margin:0 0 1.4rem;padding:0;border:0}
.hello svg{width:.78em;height:.78em;flex:0 0 auto}
/* One kind of field, on the home page and the sign-in page alike: a label
   above a box, and the box is what asks to be typed in. */
.field{
  width:100%; display:block; font-size:16px; line-height:1.5; color:var(--fg);
  background:none; border:1px solid var(--rule-2); border-radius:3px; padding:.4rem .65rem .45rem;
  resize:none; overflow:hidden;
}
.field:focus{outline:none;border-color:var(--accent)}
.field + .lab,.field + .more,.invite + .lab{margin-top:1.4rem}
.login .composer-foot{display:flex;gap:1.5rem;align-items:center}
.invite{margin-top:1.4rem}
.login .title{margin-bottom:1.8rem}
.oops{font-size:14px;line-height:1.5;color:var(--accent);margin:1rem 0 0}
.login .guest{margin:1.6rem 0 0;font-size:14px;line-height:1.5;color:var(--fg-3)}
.login .guest + .guest{margin-top:.5rem}
.login .guest .act{color:var(--fg);margin-right:.5rem}
.login .guest .act:hover{color:var(--accent)}
/* ══ setup guide ══════════════════════════════════════════════ */
/* A page of plain prose under a title: the guide, a link that leads nowhere. */
.page .body{margin-top:1.5rem}
.page .body h2{margin-top:2.2rem}
.page .body h2:first-child{margin-top:0}
/* Common instructions, one click each; they add up and toggle back off. */
.chips{display:flex;flex-wrap:wrap;gap:.35rem 1rem;margin-top:.6rem;font-size:13.5px}
.chip{color:var(--fg-2);text-decoration:underline;text-decoration-thickness:1px;text-decoration-color:var(--rule-2);text-underline-offset:3px}
.chip:hover{color:var(--fg);text-decoration-color:currentColor}
.chip.on{color:var(--accent);text-decoration-color:currentColor}
.composer-foot{margin-top:1.75rem}
.go{
  font-size:14px; font-weight:500; color:var(--bg); background:var(--fg);
  padding:.45rem .95rem .5rem; border-radius:3px; white-space:nowrap;
}
.go:hover{background:var(--accent);color:#fff}
.go kbd{font-family:inherit;font-size:12px;opacity:.55;margin-left:.7em}
.library{margin-top:3rem}
.lib-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:.45rem}
.lib-head .lab{margin:0}
.find{
  font-size:13px; line-height:1.5; color:var(--fg); background:none; border:0; border-bottom:1px solid var(--rule-2);
  padding:.05rem 0 .15rem; width:11rem; max-width:45%; border-radius:0;
}
.find::placeholder{color:var(--fg-3)}
.find:focus{outline:none;border-bottom-color:var(--accent)}
.shelf .none{padding:.7rem 0 .75rem;font-size:15px;color:var(--fg-3)}
.more-lib{display:block;margin-top:.6rem;font-size:13px;color:var(--fg-2)}
.more-lib:hover{color:var(--accent)}
.shelf{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.shelf li{display:flex;align-items:baseline;gap:1rem;border-bottom:1px solid var(--rule);position:relative}
/* Delete waits beside the row, outside it, where there is a pointer to hover with. */
@media (hover:hover){ .shelf .x{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:1rem;padding:0} }
.shelf .open{
  flex:1; min-width:0; padding:.7rem 0 .75rem; font-size:16px; line-height:1.4;
  display:flex; align-items:baseline; gap:1rem; color:var(--fg); text-decoration:none;
}
.shelf .open>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shelf .open:hover>span:first-child{color:var(--accent)}
.shelf time,.shelf .state,.shelf .words{font-size:13px;color:var(--fg-3);white-space:nowrap;flex:0 0 auto;font-variant-numeric:tabular-nums}
.shelf time{min-width:3.4rem;text-align:right}
.shelf .words{min-width:5.6rem;text-align:right}
.shelf .state.live,.shelf .state.failed{color:var(--accent)}
.shelf .state .dot{margin-right:.45em}
.shelf .x{font-size:13px;color:var(--fg-3);visibility:hidden;padding:.4rem 0}
.shelf li:hover .x,.shelf .x:focus-visible,.shelf .x.stop{visibility:visible}
.shelf .x:hover,.shelf .x.stop{color:var(--accent)}
.shelf .confirm{flex:1;padding:.7rem 0 .75rem;display:flex;gap:1.25rem;align-items:baseline;flex-wrap:wrap;font-size:15px;color:var(--fg-2)}
.shelf .confirm span{min-width:0;flex:1}
.shelf .confirm button{font-size:13px;color:var(--fg-2)}
.shelf .confirm button:hover{color:var(--fg)}
.shelf .confirm button.danger{color:var(--accent)}

/* ══ document ═════════════════════════════════════════════════ */
.doc{position:relative;max-width:var(--col);margin:1.5rem auto 0}
.doc-head{margin:0 0 2.5rem}
/* What the planner had to say about the request, above the first section. */
.pnote{margin:1.6rem 0 0;padding:.1rem 0 .1rem .8rem;border-left:2px solid var(--accent)}
.pnote .lab{margin-bottom:.2rem}
.pnote p{margin:0;font-size:15px;line-height:1.55;color:var(--fg-2)}
.title{
  margin:0 0 .8rem; padding-bottom:.55rem; border-bottom:1px solid var(--rule);
  font-family:var(--disp); font-size:2.3rem; line-height:1.15; font-weight:400; text-wrap:balance;
}
/* One row under the title: what can be done with this primer, then where
   it stands (who is working on it, what went wrong), then Undo at the end.
   The two parts are painted separately, so each is a flex-transparent
   wrapper and their children share the row. */
.doc-bar{display:flex;flex-wrap:wrap;gap:.3rem 1.1rem;align-items:baseline;margin:0 0 .55rem;font-size:13px;line-height:1.5}
.doc-tools,.status-row{display:contents}
.status-row{color:var(--fg-2)}
.status-row>span{order:1;padding-left:1.1rem;border-left:1px solid var(--rule-2)}
.status-row>span:first-child:empty{display:none}
.status-row .lnk{color:var(--accent);white-space:nowrap;margin-left:.5rem}
.status-row .lnk:hover{text-decoration:underline;text-underline-offset:3px}
.status-row .note{color:var(--fg-3);font-family:var(--mono);font-size:12px}
.status-row .sep{color:var(--rule-2);margin:0 .15rem}
.status-row ul{list-style:none;margin:.1rem 0 0;padding:0;order:3;flex-basis:100%;font-size:14px}
.status-row li{display:flex;flex-wrap:wrap;gap:.2rem .6rem;align-items:baseline;padding:.05rem 0}
.status-row .issues li{color:var(--fg)}
.doc-tools .undo{order:2;margin-left:auto}
/* What was asked for, shown when About is on. */
.meta{
  margin:.35rem 0 .4rem; padding:.45rem 0 .8rem; border-bottom:1px solid var(--rule);
  display:grid; grid-template-columns:auto 1fr; gap:.2rem 1.25rem; align-items:baseline; font-size:14px; line-height:1.45;
}
.meta dt{color:var(--fg-3);white-space:nowrap}
.meta dd{margin:0;color:var(--fg-2)}
.meta dd .link{color:var(--accent)}
.meta dd .link:hover{text-decoration:underline;text-underline-offset:3px}
.dot{
  display:inline-block; width:.4em; height:.4em; border-radius:50%; background:var(--accent);
  margin-right:.5em; vertical-align:middle; position:relative; top:-.08em; animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

/* ── contents ─────────────────────────────── */
.toc{margin:1.75rem 0 0}
.toc ol{list-style:none;margin:.2rem 0 0;padding:0;font-size:15px;line-height:1.45}
.toc li{margin:0}
.toc button{display:flex;gap:.7rem;align-items:baseline;width:100%;color:var(--fg);padding:.17rem 0}
.toc button:hover .t{color:var(--accent)}
.toc .n{color:var(--fg-3);flex:0 0 1.4rem;font-variant-numeric:tabular-nums}
.toc .t{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toc .todo .t{color:var(--fg-3)}
/* A subsection sits under its section, numbered 3.1, 3.2, the way a
   textbook or Wikipedia numbers them. */
.toc li.subsec button{padding-left:2.1rem;font-size:14px}
.toc li.subsec .n{flex-basis:2.3rem}
.toc li.subsec .t{color:var(--fg-2)}
/* On a wide screen the contents move into the left margin and stay there,
   unless the Contents setting keeps them under the title, or off. */
.side-toc{display:none}
body[data-contents="off"] .toc,body[data-contents="off"] .side-toc{display:none!important}
@media (min-width:1340px){
  body:not([data-contents="top"]) .toc{display:none}
  body:not([data-contents="top"]) .side-toc{
    display:block; position:fixed; top:calc(var(--head) + 2.7rem); left:calc(50% - 20rem - var(--gutter) - var(--marg) - 12.75rem); width:12rem;
    max-height:calc(100vh - var(--head) - 4rem); overflow:auto; font-size:13px; line-height:1.4;
  }
  .side-toc ol{list-style:none;margin:0;padding:0}
  .side-toc button{display:flex;gap:.5rem;align-items:baseline;width:100%;color:var(--fg-3);padding:.2rem 0}
  .side-toc button:hover,.side-toc button.cur{color:var(--fg)}
  .side-toc .n{flex:0 0 1.2rem;font-variant-numeric:tabular-nums}
  .side-toc .t{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .side-toc .todo button{color:var(--fg-3);opacity:.55}
  .side-toc li.subsec button{padding-left:1.7rem;font-size:12.5px}
  .side-toc li.subsec .n{flex-basis:2rem}
}

.block{position:relative;margin:0 0 1rem;scroll-margin-top:calc(var(--head) + 1.25rem)}
.block[data-kind="heading"]{margin:2.6rem 0 1rem}
.doc-head + .block[data-kind="heading"]{margin-top:0}
.block[data-kind="subheading"]{margin:1.9rem 0 .55rem}
.body>*:first-child{margin-top:0}
.body>*:last-child{margin-bottom:0}
.body p{margin:0 0 1rem;text-wrap:pretty}
.body h2{
  margin:0; padding-bottom:.3rem; border-bottom:1px solid var(--rule);
  font-family:var(--disp); font-size:1.55rem; line-height:1.25; font-weight:400; text-wrap:balance;
}
.body h3{font-size:1.08rem;font-weight:600;margin:1.5rem 0 .4rem}
.body h4{font-size:1rem;font-weight:600;margin:1.25rem 0 .3rem}
.body ul,.body ol{margin:0 0 1rem;padding-left:1.5rem}
.body li{margin:.3rem 0;text-wrap:pretty}
.body li::marker{color:var(--fg-3)}
.body strong{font-weight:600}
.body code{font-family:var(--mono);font-size:.86em;background:var(--bg-2);padding:.1em .3em;border-radius:3px}
.body pre{
  background:var(--bg-2); border:1px solid var(--rule); border-radius:3px; padding:.8rem 1rem; margin:0 0 1rem;
  overflow-x:auto; font-size:13px; line-height:1.6;
}
.body pre code{background:none;padding:0;font-size:inherit}
.body blockquote{margin:0 0 1rem;padding-left:1rem;border-left:2px solid var(--rule-2);color:var(--fg-2)}
.body hr{border:0;border-top:1px solid var(--rule);margin:1.5rem 0}
.body table{border-collapse:collapse;margin:0 0 1rem;font-size:15px;max-width:100%;display:block;overflow-x:auto}
.body th,.body td{padding:.4rem .9rem .4rem 0;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.body th{font-weight:600;border-bottom-color:var(--rule-2)}
.body img{max-width:100%;height:auto}
.body .katex-display{margin:1.1rem 0;overflow-x:auto;overflow-y:hidden;padding:.2rem 0}
.body .katex{font-size:1.06em}

.block[data-kind="figure"] .body,.block[data-kind="image"] .body{padding:.4rem 0 .5rem}
.block[data-kind="figure"] figure,.block[data-kind="image"] figure{margin:0}
.block[data-kind="figure"] svg{max-width:100%;height:auto;display:block;color:var(--fg)}
.block[data-kind="figure"] figcaption,.block[data-kind="image"] figcaption{margin-top:.6rem;font-size:14px;line-height:1.5;color:var(--fg-2);text-wrap:pretty}
.block[data-kind="figure"] svg [stroke="#A23B2A"],.block[data-kind="figure"] svg [stroke="#2C6B60"]{stroke:var(--accent)}
.block[data-kind="figure"] svg [fill="#A23B2A"],.block[data-kind="figure"] svg [fill="#2C6B60"]{fill:var(--accent)}
.block[data-kind="image"] img{display:block;max-width:100%;height:auto;background:var(--bg-2)}
.block[data-kind="image"] .credit{display:block;font-size:12.5px;color:var(--fg-3);margin-top:.15rem}

/* ── citations: [n] after the claim ── */
.cite{font-size:.72em;line-height:0;vertical-align:super;margin-left:.1em;white-space:nowrap}
.cite::before{content:"[";color:var(--accent)}
.cite::after{content:"]";color:var(--accent)}
.body .cite a{text-decoration:none}
.body .cite a:hover{text-decoration:underline}
body[data-sources="off"] .cite{display:none}

/* ── the margin: numbers, status, and what touched a block ── */
.marg{
  position:absolute; top:.2em; right:calc(100% + var(--gutter)); width:var(--marg);
  text-align:right; font-size:13px; line-height:1.45; color:var(--fg-3); pointer-events:none;
  font-variant-numeric:tabular-nums;
}
/* The section number sits in the margin at the heading's own size and face,
   greyed, so the two read as one line. */
.num{top:0;font-family:var(--disp);font-size:1.55rem;line-height:1.25;font-variant-numeric:lining-nums tabular-nums}
.block:has(.status) .num{display:none}
/* A subsection's number matches its smaller heading. */
.num.numsub{font-family:inherit;font-size:1.08rem;font-weight:600;line-height:inherit}
.mark{pointer-events:auto;text-align:right;color:var(--fg-3)}
.mark:hover,.mark[aria-expanded="true"]{color:var(--accent)}
body[data-marks="off"] .mark,body[data-marks="off"] .block.edited .bar{display:none}
/* A rule in the gutter: grey where something changed, blue while
   something is happening, faint where something is still to come, blue
   again where something went wrong. The rule on an edited block is a real
   element: hovering it shows the passage that was asked about. */
.block.edited .bar,.block.busy::before,.block.pending::before,.err::before{
  content:""; position:absolute; top:.3em; bottom:.2em; right:calc(100% + .75rem); width:2px; background:var(--rule-2);
}
.block.edited .bar{
  right:calc(100% + .75rem - 5px); padding:0 5px; box-sizing:content-box; background-clip:content-box;
  pointer-events:auto; cursor:pointer; border:0;
}
.block.edited:hover .bar,.block.edited .bar:hover{background-color:var(--accent)}
.block.busy::before{background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
.block.pending::before{background:var(--rule)}
.status{color:var(--fg-3)}
.block.busy .body{opacity:.6}
::highlight(pen){background-color:color-mix(in srgb, var(--accent) 28%, transparent)}
.block.pending .body{min-height:3.2em}
.block.pending.queued{opacity:.5}
/* The model's raw output so far, while we wait. */
.block.pending .live{
  margin:0; padding:0; background:none; border:0; overflow:visible;
  font-family:var(--mono); font-size:12.5px; line-height:1.6; color:var(--fg-3);
  white-space:pre-wrap; word-break:break-word;
}
.block.pending .live.prose{font-family:var(--text);font-size:16px;line-height:1.55;color:var(--fg-2);white-space:pre-wrap}
.block.pending[data-kind="figure"] .body,.block.pending[data-kind="image"] .body{min-height:3.2em}
.block.pending .brief{margin:0;font-size:14px;color:var(--fg-3)}

.err{position:relative;font-size:14px;line-height:1.5;color:var(--fg-2)}
.err::before{background:var(--accent)}
.err button{color:var(--accent);margin-left:.7rem}
.err button:hover{text-decoration:underline;text-underline-offset:3px}
.err.soft{color:var(--fg-3)}
.err.soft::before{background:var(--rule-2)}
.block[data-kind="heading"] .err{margin-top:.6rem}

/* ── notes: inline aside, or a sidenote when there is room ── */
.block[data-kind="note"]{margin:.25rem 0 1.25rem;padding:0 0 0 1rem;border-left:2px solid var(--rule)}
.block[data-kind="note"] .body{font-size:15px;line-height:1.5;color:var(--fg-2)}
.side-q{display:block;font-size:14px;color:var(--fg-3);margin:0 0 .3rem;line-height:1.45}
.side-q:hover{color:var(--accent)}

/* ── colophon ─────────────────────────────── */
.colophon{
  margin-top:4rem; padding-top:.8rem; border-top:1px solid var(--rule); display:flex; flex-wrap:wrap;
  gap:.4rem 1.25rem; align-items:baseline; font-size:13px; color:var(--fg-3);
}
/* The same toolbar and About panel again at the foot, for a reader who
   arrives at the end and wants what was at the top. */
.doc-foot{margin-top:3.2rem;padding-top:.8rem;border-top:1px solid var(--rule)}
.doc-foot .doc-bar{margin-bottom:0}
.doc-foot .meta{border-bottom:0;margin:.6rem 0 0;padding-bottom:.2rem}
.doc-foot + .colophon{margin-top:1.4rem}
.colophon .fill{flex:1}
.colophon button{color:var(--fg-2)}
.colophon button:hover{color:var(--accent)}
.colophon .confirm{display:flex;gap:1.25rem;align-items:baseline}
.colophon .confirm .danger{color:var(--accent)}

/* ══ floating layers: one look for all of them ════════════════ */
.pen,.pop{background:var(--bg);border:1px solid var(--rule-2);border-radius:3px;box-shadow:var(--lift)}

/* ── the pen (selection toolbar) ── */
.pen{position:absolute;z-index:60;display:none;align-items:center;user-select:none;padding:.2rem .25rem}
.pen.show{display:flex}
.pen-row{display:flex;align-items:center}
.pen-row button{font-size:13.5px;color:var(--fg-2);padding:.35rem .55rem;border-radius:2px;white-space:nowrap;display:inline-flex;align-items:baseline;gap:.45em}
.pen-row button:hover,.pen-row button:focus-visible{color:var(--fg);background:var(--bg-2);outline:none}
.pen kbd{font-family:inherit;font-size:11.5px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.pen .sep{width:1px;height:1rem;background:var(--rule);margin:0 .3rem}
.pen-ask{display:none;align-items:center;gap:.4rem;padding:.1rem .2rem .1rem .45rem}
.pen.asking .pen-row{display:none}
.pen.asking .pen-ask{display:flex}
.pen-ask input{width:min(24rem,58vw);background:none;border:0;border-bottom:1px solid var(--rule-2);padding:.3rem .1rem .35rem;font-size:15px;border-radius:0}
.pen-ask input:focus{outline:none;border-bottom-color:var(--accent)}
.pen-ask button{font-size:13.5px;color:var(--accent);padding:.35rem .5rem;border-radius:2px}
.pen-ask button:hover{background:var(--bg-2)}

/* ── popovers ── */
.pop{position:absolute;z-index:55;display:none;width:min(21rem,88vw);padding:.7rem .9rem .75rem;font-size:14px;line-height:1.5}
.pop.show{display:block}
.pop .k{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;margin-bottom:.25rem;font-size:12.5px;color:var(--fg-3)}
.pop .q{color:var(--fg-2);margin-bottom:.6rem}
.pop .t{color:var(--fg);margin-bottom:.15rem}
.pop .s{color:var(--fg-2);font-size:13.5px;margin-bottom:.5rem}
.pop .row{display:flex;gap:1.1rem;flex-wrap:wrap;font-size:13px}
.pop .row button,.pop .row a{color:var(--accent);text-decoration:none}
.pop .row button:hover,.pop .row a:hover{text-decoration:underline;text-underline-offset:3px}
.pop .row .host{color:var(--fg-3);font-family:var(--mono);font-size:11.5px;margin-left:.4em}
.pop .prev{color:var(--fg-2);font-size:13.5px;line-height:1.45;margin-bottom:.5rem;max-height:9rem;overflow:hidden}
.pop .s .dot{margin-right:.4em}

.outline{width:min(22rem,90vw);padding:.35rem .35rem}
.outline button{display:flex;width:100%;gap:.7rem;align-items:baseline;padding:.38rem .6rem;border-radius:2px;color:var(--fg-2);line-height:1.35;font-size:14px}
.outline button:hover{background:var(--bg-2);color:var(--fg)}
.outline button.cur{color:var(--fg);font-weight:500}
.outline button .n{color:var(--fg-3);flex:0 0 2rem;font-weight:400;font-variant-numeric:tabular-nums}
.outline .foot{border-top:1px solid var(--rule);margin:.35rem .25rem 0;padding-top:.35rem;display:flex;gap:.15rem}
.outline .foot button{width:auto;font-size:13px;padding:.3rem .5rem}
.outline .hint{display:block;padding:.35rem .6rem .15rem;font-size:12.5px;color:var(--fg-3)}
.outline .hint.div{border-top:1px solid var(--rule);margin:.35rem .25rem 0;padding-top:.45rem}
.outline form{display:flex;gap:.4rem;align-items:baseline;padding:.3rem .6rem .25rem;border-top:1px solid var(--rule);margin-top:.35rem}
.outline form input{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--rule-2);padding:.3rem .1rem .35rem;font-size:14px;border-radius:0}
.outline form input:focus{outline:none;border-bottom-color:var(--accent)}
.outline form button{width:auto;flex:0 0 auto;color:var(--accent);font-size:13px;padding:.3rem .4rem}
.outline .rule{border-top:1px solid var(--rule);margin:.35rem .25rem}
.feedback form{flex-direction:column;align-items:stretch;border-top:0;margin-top:0;gap:.5rem}
.feedback form textarea{
  width:100%; background:none; border:0; border-bottom:1px solid var(--rule-2); border-radius:0; padding:.3rem .1rem .4rem;
  font-size:14.5px; line-height:1.45; resize:none; overflow:hidden; color:var(--fg);
}
.feedback form textarea:focus{outline:none;border-bottom-color:var(--accent)}
.feedback form button{align-self:flex-end}
/* What readers sent, on the host's Feedback page in Settings. */
.inbox{list-style:none;margin:0;padding:0;font-size:15px}
.inbox li{padding:.7rem 0}
.inbox .k{font-size:13px;color:var(--fg-3);margin-bottom:.15rem}
.inbox .k .sep{margin:0 .4em}
.inbox .msg{margin:0;white-space:pre-wrap;text-wrap:pretty}
.inbox .src{font-size:13.5px;color:var(--fg-2);margin-top:.25rem}
.inbox .src q{display:block;color:var(--fg-3);margin-bottom:.1rem}
.inbox .src a{color:var(--accent);text-decoration:none}
.inbox .src a:hover{text-decoration:underline;text-underline-offset:3px}
.inbox .none{color:var(--fg-3);font-size:14px}
/* The Share menu: a link for the primer as it stands, the links made before, and other ways out. */
.share{width:min(20rem,90vw)}
.share .pub{display:flex;align-items:center;gap:.7rem;padding:.4rem .6rem .1rem;font-size:14px;color:var(--fg)}
.share .pub span{flex:1}
.share .pub .switch,.share .pub .switch:hover{display:block;width:2.5rem;height:1.45rem;padding:0;margin:0;border-radius:999px;background:var(--rule-2)}
.share .pub .switch[aria-checked="true"],.share .pub .switch[aria-checked="true"]:hover{background:var(--accent)}
.share .hint.under{padding-top:0;padding-bottom:.3rem}
.share .linkrow{display:flex;align-items:baseline}
.share .linkrow button:first-child{flex:1}
.share .linkrow .rm{width:auto;flex:0 0 auto;font-size:13px;color:var(--fg-3)}
.share .linkrow .rm:hover{color:var(--accent);background:none}
.share .url{display:block;padding:.35rem .6rem .3rem;font-family:var(--mono);font-size:12.5px;line-height:1.5;color:var(--fg);word-break:break-all;user-select:all;text-decoration:none;cursor:pointer}
.share .url:hover{color:var(--accent)}

/* ── toast ── */
.toast{
  position:fixed; left:50%; bottom:calc(1.5rem + env(safe-area-inset-bottom)); z-index:65;
  transform:translateX(-50%); visibility:hidden; opacity:0; transition:opacity .15s;
  background:var(--fg); color:var(--bg); border-radius:3px; box-shadow:var(--lift);
  padding:.55rem 1rem .6rem; font-size:14px; display:flex; align-items:baseline; gap:1.1rem; max-width:min(34rem,92vw);
}
.toast.show{visibility:visible;opacity:1}
.toast button{color:inherit;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.toast.err{background:var(--accent);color:#fff}

/* A section heading on a page that is not a primer: Settings, the Inspector. */
.sub{
  margin:2.5rem 0 .6rem; padding-bottom:.3rem; border-bottom:1px solid var(--rule);
  font-family:var(--disp); font-size:1.55rem; line-height:1.25; font-weight:400;
}
.sub + .lab{margin-bottom:.6rem}
/* ══ inspector: usage by agent ════════════════════════════════ */
.scroll{overflow-x:auto}
.usage{border-collapse:collapse;width:100%;font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
.usage th,.usage td{padding:.45rem 1rem .45rem 0;border-bottom:1px solid var(--rule);text-align:left;vertical-align:baseline;white-space:nowrap}
.usage th:last-child,.usage td:last-child{padding-right:0}
.usage th{font-weight:400;font-size:13px;color:var(--fg-3)}
.usage .n{text-align:right}
.usage .model{font-family:var(--mono);font-size:12px;color:var(--fg-2)}
.usage .dim{color:var(--fg-3)}
.usage .total td{border-bottom:0;color:var(--fg)}
.usage .total td:first-child{font-weight:500}
/* ══ picker ═══════════════════════════════════════════════════
   Two choices on one line, each with a chevron; the chosen one's form
   opens under the line and the chevron turns. */
.pick-row{display:flex;flex-wrap:wrap;gap:.4rem 1.6rem;align-items:baseline;padding:.75rem 0 .2rem}
.pick-b{font-size:14px;color:var(--fg-2);display:inline-flex;align-items:baseline;gap:.5rem}
.pick-b:hover{color:var(--accent)}
.pick-b:hover::after{border-color:var(--accent)}
.pick-b.on{color:var(--fg)}
.pick-b::after,.krow summary::after{
  content:""; flex:0 0 auto; width:.38em; height:.38em; position:relative; top:-.12em;
  border-right:1.5px solid var(--fg-3); border-bottom:1.5px solid var(--fg-3); transform:rotate(-45deg); transition:transform .15s;
}
.pick-b.on::after,.krow details[open] summary::after{transform:rotate(45deg);top:-.2em}
.pick-row .tail{margin-left:auto;font-size:14px;color:var(--fg-3);text-decoration:none}
.pick-row .tail:hover{color:var(--accent)}
.pick-form .kform{padding:.2rem 0 .5rem}
/* ── prompts: one folded row each; an edited prompt keeps a rule in the
      margin and its Reset, open or closed ── */
/* A subsection heading on Settings, numbered in the margin like a primer's. */
.ssub{position:relative;margin:1.9rem 0 .55rem;scroll-margin-top:calc(var(--head) + 1.25rem)}
.ssub h3{margin:0;font-size:1.08rem;font-weight:600}
.sub + .ssub{margin-top:.8rem}
.prow{position:relative}
.prow .reset{font-size:13px;color:var(--accent);visibility:hidden}
.prow.mod .reset{visibility:visible}
.prow .reset:hover{text-decoration:underline;text-underline-offset:3px}
.prow.mod::before{content:"";position:absolute;top:.7rem;bottom:.7rem;right:calc(100% + .75rem);width:2px;background:var(--accent)}
.p-text{
  width:100%; display:block; margin:0 0 1rem; font-family:var(--mono); font-size:12.5px; line-height:1.65; tab-size:2;
  background:var(--bg-2); border:1px solid var(--rule); border-radius:3px; padding:.75rem .9rem; resize:none; overflow:hidden; color:var(--fg-2);
}
.p-text:focus{outline:none;border-color:var(--accent);color:var(--fg)}

/* ══ settings page ════════════════════════════════════════════
   Laid out like a primer: numbered sections, a contents list, and one
   kind of row throughout: a label on the left, its control on the right.
   The forms under Keys are made of the same rows.                     */
/* A touch left of centre: with its numbers hanging in the margin the page
   reads right-heavy when centred exactly. */
@media (min-width:1000px){ .settings{translate:-1.25rem 0} }
.ssec{position:relative;margin:2.6rem 0 0;scroll-margin-top:calc(var(--head) + 1.25rem)}
.doc-head + .ssec{margin-top:0}
.ssec .sub{margin-top:0}
.srow{display:flex;justify-content:space-between;gap:2rem;align-items:center;padding:.7rem 0}
.srow .lab{font-size:16px;color:var(--fg);margin:0}
.switch{flex:0 0 auto;width:2.5rem;height:1.45rem;border-radius:999px;background:var(--rule-2);position:relative;transition:background .2s}
.switch i{position:absolute;top:.15rem;left:.15rem;width:1.15rem;height:1.15rem;border-radius:50%;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] i{left:1.2rem}
.seg{display:flex;gap:1rem;flex:0 0 auto;font-size:14px}
.seg label{display:flex;gap:.4rem;align-items:center;color:var(--fg-2)}
.seg input{accent-color:var(--accent);margin:0}
.srow .field{flex:0 1 18rem;width:auto;font-size:15px;padding:.3rem .55rem .35rem}
/* A row that runs full width: its label above, its control below. */
.srow.wide{flex-direction:column;align-items:stretch;gap:.9rem}
.keys{font-size:14px}
.keys .warn{margin:0 0 .9rem;padding-left:.8rem;border-left:2px solid var(--accent);color:var(--fg);font-size:14px;line-height:1.5}
/* The keys, one to a row, ruled like the library. */
.klist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.krow{display:flex;gap:.8rem;align-items:flex-start;padding:.6rem 0;border-bottom:1px solid var(--rule)}
.krow input[type="radio"]{accent-color:var(--accent);margin:.35rem 0 0;flex:0 0 auto}
.krow details,.krow .kinfo{flex:1;min-width:0}
.krow summary,.krow .kinfo{list-style:none;display:flex;flex-wrap:wrap;gap:.15rem 1rem;align-items:baseline}
.krow summary{cursor:pointer}
.krow summary::-webkit-details-marker{display:none}
.krow summary:hover .kname{color:var(--accent)}
.krow .kname{color:var(--fg);font-size:16px}
.krow .kmeta{color:var(--fg-3);font-size:13px}
.krow .kuse{color:var(--fg-2);font-size:13px;margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.krow .kbody{margin:.3rem 0 .4rem}
.krow .kbody>.lab{font-size:13px;color:var(--fg-3);margin:1rem 0 .4rem}
.krow .kbody .usage{font-size:13px}
.krow .unlink{font-size:13px;color:var(--fg-3);flex:0 0 auto;margin-top:.2rem}
.krow .unlink:hover{color:var(--accent)}
/* A form of rows: the labels a step quieter than the page's own rows. */
.kform .srow{padding:.4rem 0}
.kform .srow .lab{font-size:14px;color:var(--fg-2)}
.kform .acts{display:flex;gap:1.25rem;align-items:center;padding:.65rem 0 .25rem}
.quiet{font-size:14px;color:var(--fg-3)}
.quiet:hover{color:var(--accent)}
.kform .confirm{display:flex;gap:1rem;align-items:baseline;color:var(--fg-2);font-size:14px}
.kform .confirm .danger{color:var(--accent)}
.account{flex:1;display:flex;justify-content:space-between;align-items:baseline;gap:1rem;font-size:16px}

/* ══ inspector: the calls ═════════════════════════════════════ */
.call{border-top:1px solid var(--rule)}
.call:last-of-type{border-bottom:1px solid var(--rule)}
.call summary{display:flex;gap:1rem;align-items:baseline;padding:.65rem 0;cursor:pointer;list-style:none;font-size:15px}
.call summary::-webkit-details-marker{display:none}
.call .n{color:var(--fg-3);flex:0 0 2rem;font-variant-numeric:tabular-nums}
.call .what{color:var(--fg);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call .who{font-family:var(--mono);font-size:11.5px;color:var(--fg-3);white-space:nowrap}
.call .st{font-size:13px;color:var(--fg-3);white-space:nowrap;flex:0 1 auto;min-width:4rem;max-width:14rem;overflow:hidden;text-overflow:ellipsis}
.call.failed .st{color:var(--accent)}
.call.lost .st{color:var(--fg-3);font-style:italic}
/* the tree: a call's children sit indented beneath it, on a rule */
.calls{margin-top:.5rem}
.node .kids{margin-left:1.5rem;padding-left:.75rem;border-left:1px solid var(--rule-2)}
@media (max-width:700px){.node .kids{margin-left:.75rem;padding-left:.5rem}}
.node .kids:empty{display:none}
.kids > .node > .call:first-of-type{border-top:0}
.kids > .node > .call{border-top:1px solid var(--rule)}
.kids > .node:first-child > .call{border-top:0}
.node .kids .call .n::before{content:"↳";color:var(--fg-3);margin-right:.35em}
.call-body .from{margin:.6rem 0 0;font-size:13px;color:var(--fg-2)}
.call-body .from .k{color:var(--fg-3);margin-right:.6em}
.call-body .from button{color:var(--accent)}
.call-body .from button:hover{text-decoration:underline;text-underline-offset:3px}
.call-body .why{margin:.4rem 0 0;font-size:13.5px;line-height:1.5;color:var(--fg);padding-left:.75rem;border-left:2px solid var(--accent)}
.call-body .why.soft{border-left-color:var(--rule-2);color:var(--fg-3)}
.call.running .st::before{content:"";display:inline-block;width:.4em;height:.4em;border-radius:50%;background:var(--accent);margin-right:.45em;vertical-align:middle;position:relative;top:-.08em;animation:pulse 1.6s ease-in-out infinite}
.call-body{padding:0 0 1.25rem}
/* A part of a call is headed the same way whether it always shows (h4) or
   folds (a prompt's summary); the two prompts share a row until one opens. */
.call-body h4,.call-body .prompt summary{font-size:12.5px;font-weight:500;color:var(--fg-3);display:flex;justify-content:space-between;align-items:baseline}
.call-body h4{margin:.9rem 0 .3rem}
.call-body h4 button,.call-body .prompt summary button{font-size:12.5px;color:var(--fg-3)}
.call-body .prompts{display:grid;grid-template-columns:1fr 1fr;gap:0 1.25rem;margin-top:.9rem}
.call-body .prompt{min-width:0}
.call-body .prompt[open]{grid-column:1 / -1}
.call-body .prompt summary{padding:.2rem 0 .3rem;cursor:pointer;list-style:none}
.call-body .prompt summary::-webkit-details-marker{display:none}
.call-body .prompt summary>span::before{content:"▸";display:inline-block;width:1em}
.call-body .prompt[open] summary>span::before{content:"▾"}
@media (max-width:700px){ .call-body .prompts{grid-template-columns:1fr} }
.call-body h4 button:hover{color:var(--accent)}
.call-body pre{
  margin:0; padding:.7rem .9rem; background:var(--bg-2); border:1px solid var(--rule); border-radius:3px;
  font-family:var(--mono); font-size:12.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word; max-height:28rem; overflow:auto; tab-size:2;
}
.call .events{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--fg-2)}
.call .events li{padding:.15rem 0;border-bottom:1px solid var(--rule);white-space:pre-wrap;word-break:break-word}
.call .events .k{color:var(--accent);margin-right:.6em}
.call .events .bad .k{color:var(--fg-3)}

/* ══ wide: sidenotes in the right margin ══════════════════════ */
@media (min-width:1240px){
  .block[data-kind="note"]{
    position:absolute; left:calc(100% + var(--sgap)); width:var(--side); margin:0; padding:0; border:0;
    font-size:13.5px; line-height:1.5; scroll-margin-top:calc(var(--head) + 1.25rem);
  }
  .block[data-kind="note"] .body{font-size:inherit;line-height:inherit;color:var(--fg-2)}
  .block[data-kind="note"] .body p{margin-bottom:.6rem}
  .side-q{font-size:13px;margin-bottom:.3rem}
  .block[data-kind="note"].busy::before{display:none}
}

/* ══ no room in the margin: labels move above their block ═════ */
@media (max-width:1049px){
  main{padding-left:2rem;padding-right:var(--gutter)}
  .marg{position:static;display:block;width:auto;text-align:left;font-size:12.5px;margin:0 0 .25rem;pointer-events:auto}

<script>
/* ══ server ═══════════════════════════════════════════════════
   One signed-in person, `me`, and one way to talk to the server. A 401
   means the session is gone: back to the sign-in page. */
let me = null;
async function api(path, body, method){
  const r = await fetch(path, { method: method || (body ? "POST" : "GET"),
    headers: body ? { "Content-Type":"application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if(r.status === 401 && me) signedOut();
  if(!r.ok){ const e = new Error(j.error && j.error.message || "Request failed (" + r.status + ")"); e.status = r.status; throw e; }
  return j;
}
function signedOut(){ me = null; doc = null; index = []; undoStack = []; route = "login"; render(); }

/* ══ storage ══════════════════════════════════════════════════
   Keys: primer:index, primer:doc:<id>, primer:raw:<id>, primer:prompts,
   primer:settings. Kept on the server under the signed-in user; the page
   sees get/set/del by key and nothing else.                          */
let saveWarned = false;
/* A guest has no account: the same keys live in this browser's localStorage. */
const isGuest = () => !!(me && me.guest);
const local = {
  get(k){ try{ const v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); }catch(e){ return null; } },
  set(k, v){
    try{ localStorage.setItem(k, JSON.stringify(v)); saveWarned = false; }
    catch(e){ if(!saveWarned){ saveWarned = true; toast("Couldn't save in this browser: " + e.message, { err:true }); } }
  },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const store = {
  async get(k){
    if(isGuest()) return local.get(k);
    try{ return await api("/api/store/" + encodeURIComponent(k)); }
    catch(e){ if(e.status === 404) return null; throw e; }
  },
  async set(k,v){
    if(isGuest()) return local.set(k, v);
    try{ await api("/api/store/" + encodeURIComponent(k), v, "PUT"); saveWarned = false; }
    catch(e){ if(!saveWarned){ saveWarned = true; toast("Couldn't save: " + e.message, { err:true }); } }
  },
  async del(k){
    if(isGuest()) return local.del(k);
    try{ await api("/api/store/" + encodeURIComponent(k), null, "DELETE"); }catch(e){}
  },
  /* The library's list is changed an entry at a time, never written whole,
     so two tabs saving at once keep each other's primers. What comes back
     is the list as it now stands, with whatever another tab added. */
  async index(id, entry){
    if(isGuest()){ const l = mergedIndex(local.get("primer:index") || [], id, entry); local.set("primer:index", l); return l; }
    try{ const l = await api("/api/index/" + encodeURIComponent(id), entry, entry ? "PUT" : "DELETE"); saveWarned = false; return l; }
    catch(e){ if(!saveWarned){ saveWarned = true; toast("Couldn't save: " + e.message, { err:true }); } return mergedIndex(index, id, entry); }
  }
};
/* An entry replaced in place, or added at the top, or taken out. */
function mergedIndex(list, id, entry){
  list = Array.isArray(list) ? list.filter(x => x && x.id) : [];
  const i = list.findIndex(x => x.id === id);
  if(!entry) return list.filter(x => x.id !== id);
  if(i < 0) list.unshift(entry); else list[i] = entry;
  return list;
}
/* A guest's credential, kept in this browser and sent with each call:
   {kind, value, hint} for a key of their own, {name, password, owner, kind}
   for someone's shared key. Under its own prefix, so signing in later
   moves the primers into the account but never this.                */
const GUEST_CRED = "primer-guest:cred";
const guestCred = () => local.get(GUEST_CRED);
function setGuestCred(c){
  if(c) local.set(GUEST_CRED, c); else local.del(GUEST_CRED);
  if(isGuest()) me.key = guestKeyInfo();
}
/* What `me.key` says of it: the same shape a signed-in user's key has. */
function guestKeyInfo(){
  const c = guestCred();
  if(!c) return null;
  return c.name ? { name:c.name, kind:c.kind, owner:c.owner } : { name:kindWord(c.kind) + " " + c.hint, kind:c.kind, owner:"you" };
}
const guestMe = () => ({ guest:true, name:"Guest", key:guestKeyInfo() });

/* ══ settings ═════════════════════════════════════════════════
   One entry per setting; the Settings page is drawn from this table,
   one section per SECTIONS entry, each setting under its `section`.
   type is "bool", "select" (with options:[{value,label}]) or "text";
   a `wide` setting takes the whole column. A setting with `attr` is a
   display switch: it puts on/off in body[data-<attr>], and CSS does the
   rest, so showing or hiding a part of the page needs no code beyond one
   rule. Only values that differ from def are stored.                  */
const SECTIONS = [
  { id:"keys", title:"Keys" }, { id:"writing", title:"Writing" }, { id:"display", title:"Display" },
  { id:"account", title:"Account" }, { id:"prompts", title:"Prompts" }, { id:"inbox", title:"Feedback", admin:true }
];
const SETTINGS = {
  keys: { type:"keys", section:"keys", wide:true },
  research: { type:"bool", section:"writing", def:false, label:"Research after writing" },
  showSources: { type:"bool", section:"display", def:true, attr:"sources", label:"Show sources" },
  showMarks: { type:"bool", section:"display", def:true, attr:"marks", label:"Show margin annotations" },
  contents: { type:"select", section:"display", def:"margin", attr:"contents", label:"Contents",
    options:[{ value:"margin", label:"Margin" }, { value:"top", label:"Under the title" }, { value:"off", label:"Off" }] },
  theme: { type:"select", section:"display", def:"system", label:"Theme",
    options:[{ value:"system", label:"System" }, { value:"light", label:"Light" }, { value:"dark", label:"Dark" },
             { value:"paper", label:"Paper" }, { value:"paper-dark", label:"Paper dark" }] },
  account: { type:"account", section:"account" },
  inbox: { type:"inbox", section:"inbox", wide:true }
};
let settings = {};
const setting = k => (k in settings) ? settings[k] : SETTINGS[k].def;
async function setSetting(k, v){
  if(!("def" in SETTINGS[k])) return;
  if(v === SETTINGS[k].def) delete settings[k]; else settings[k] = v;
  await store.set("primer:settings", settings);
  applySettings();
}
/* On a shared primer the display switches are the sharer's, frozen with
   it, so the reader sees the page as the sharer did. */
function applySettings(){
  const v = (route === "shared" && doc && doc.view) || null;
  Object.keys(SETTINGS).forEach(k => {
    const a = SETTINGS[k].attr;
    if(!a) return;
    const on = v && (a in v) ? v[a] : setting(k);
    document.body.dataset[a] = SETTINGS[k].type === "bool" ? (on ? "on" : "off") : String(on);
  });
  applyTheme();
}

/* ══ model ════════════════════════════════════════════════════
   server.mjs answers POST /api/complete {system, user, role} with a stream
   of newline-delimited JSON frames: {start} first, {delta} as text arrives,
   {event} when an agent uses a tool, then {done,text} or {error}. role
   picks the model and tools server-side. o.onDelta(soFar, delta) fires per
   text frame, o.onEvent(event) per start/tool/result frame; o.signal aborts,
   which the server turns into a stopped model call. A guest's credential
   goes along as `cred`.                                                */
const ENDPOINT = "/api/complete";
const RETRIES = 4;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function stopped(partial){ const e = new Error("Stopped."); e.name = "AbortError"; e.stopped = true; if(partial) e.partial = partial; return e; }

async function claude(system, user, role, o){
  o = o || {};
  for(let attempt = 0; ; attempt++){
    if(o.signal && o.signal.aborted) throw stopped();
    let r;
    try{
      r = await fetch(ENDPOINT, { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ system, user, role, cred: isGuest() ? guestCred() : undefined }), signal: o.signal });
    }catch(e){
      if(e.name === "AbortError") throw stopped();
      if(attempt >= RETRIES) throw new Error("Network error. "+e.message);
      await sleep(800 * Math.pow(2, attempt));
      continue;
    }
    if(r.status===429 || r.status===529 || r.status>=500){
      if(attempt >= RETRIES) throw new Error("Rate limited after "+(RETRIES+1)+" tries.");
      const ra = parseFloat(r.headers.get("retry-after"));
      await sleep(ra ? ra*1000 : 900*Math.pow(2,attempt) + Math.random()*400);
      continue;
    }
    if(!r.ok){
      const d = await r.json().catch(() => ({}));
      if(r.status === 401){ signedOut(); throw new Error("Signed out."); }
      const e = new Error(d.error && d.error.message || "Request failed ("+r.status+")");
      if(d.error && d.error.kind) e.kind = d.error.kind;
      throw e;
    }
    return readFrames(r, o);
  }
}

/* Once bytes have flowed there is no retry; the server's client already
   retried rate limits before the first delta. A dropped connection throws
   with what arrived on e.partial so the inspector can show it. */
async function readFrames(r, o){
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "", acc = "";
  try{
    for(;;){
      const { value, done } = await reader.read();
      buf += done ? dec.decode() : dec.decode(value, { stream:true });
      const lines = buf.split("\n"); buf = lines.pop();
      for(const line of lines){
        if(!line.trim()) continue;
        const f = JSON.parse(line);
        if(f.start && o.onEvent) o.onEvent({ kind:"start", ...f.start });
        if(f.event && o.onEvent) o.onEvent(f.event);
        if(f.delta != null){ acc += f.delta; if(o.onDelta) o.onDelta(acc, f.delta); }
        if(f.usage && o.onEvent) o.onEvent({ kind:"usage", ...f.usage });
        if(f.error){ const e = new Error(f.error.message || "Request failed."); e.partial = acc; if(f.error.kind) e.kind = f.error.kind; throw e; }
        if(f.done) return String(f.text != null ? f.text : acc);
      }
      if(done) break;
    }
  }catch(e){ if(e.name === "AbortError") throw stopped(acc); throw e; }
  if(o.signal && o.signal.aborted) throw stopped(acc);
  const e = new Error("Connection dropped mid-response."); e.partial = acc; throw e;
}

/* Models write LaTeX inside JSON strings and sometimes forget to double the
   backslash: \{ or \alpha instead of \\{ and \\alpha. A backslash that does
   not start a valid JSON escape is doubled; valid JSON passes untouched. */
const TEX_AMBIG = /^(?:t(?:au|heta|o|imes|ext(?:bf|it|rm|sf|tt)?|op|an|anh|ilde|riangle|frac|herefore)|b(?:eta|ar|f|egin|inom|oldsymbol|matrix|ig[lrg]*|ackslash|ot|ullet|mod)|f(?:rac|orall|lat|box)|r(?:ho|ight|angle|m|floor|ceil|ightarrow|ightleftharpoons)|n(?:abla|eq|e|u|ot|otin|onumber|ewline|atural|mid|leq|geq|i))(?![A-Za-z])/;
function fixEscapes(s){
  return s.replace(/\\(?:["\\/bfnrt]|u[0-9a-fA-F]{4})|\\/g, (m, at) => {
    if(m.length === 1) return "\\\\";
    if(m.length === 2 && "tbfrn".includes(m[1]) && TEX_AMBIG.test(s.slice(at+1))) return "\\\\" + m[1];
    return m;
  });
}
/* Where the JSON begins in an answer that may open with prose: the first
   bracket that starts a structure, an array of things or an object with
   a key, rather than a brace inside the prose's TeX. */
function jsonStart(s){
  const m = /\[\s*[{\["\d]|\{\s*"/.exec(s);
  if(m) return m.index;
  const a = s.indexOf("["), o = s.indexOf("{");
  return (a<0)?o : (o<0)?a : Math.min(a,o);
}
function parseJSON(txt){
  let s = String(txt).trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const start = jsonStart(s);
  if(start>0) s = s.slice(start);
  s = fixEscapes(s);
  try{ return JSON.parse(s); }catch(e){ return repairJSON(s); }
}

/* Ask and parse; if the answer will not parse, ask once more. Returns
   {value, raws}: every answer as it came, the last of them for the trace. */
async function askJSON(system, user, role, o){
  o = o || {};
  const raws = [];
  for(let attempt = 0; attempt < 2; attempt++){
    const text = await claude(system, user, role, o);
    raws.push(text);
    try{ return { value: parseJSON(text), raws }; }
    catch(e){
      if(o.signal && o.signal.aborted) throw e;
      /* A writer that answers a section in plain prose, with no element in
         it at all, still wrote the section: on its last try, take the prose. */
      if(attempt === 1 && role === "section" && !/"kind"\s*:/.test(text) && text.trim().length > 200) return { value:[{ kind:"prose", md:text.trim() }], raws };
      if(attempt === 1) throw e;
      if(o.onEvent) o.onEvent({ kind:"retry", reason:e.message, output:text });
    }
  }
}
/* A response cut off mid-way leaves a half-written element.
   Walk to the last element that closed cleanly and discard the rest. */
function repairJSON(s){
  const root = s[0];
  if(root!=="[" && root!=="{") throw new Error("Response wasn't JSON.");
  let depth=0, inStr=false, esc=false, close1=-1, close2=-1;
  for(let i=0;i<s.length;i++){
    const c = s[i];
    if(inStr){
      if(esc) esc = false;
      else if(c==="\\") esc = true;
      else if(c==='"') inStr = false;
      continue;
    }
    if(c==='"'){ inStr = true; continue; }
    if(c==="{" || c==="[") depth++;
    else if(c==="}" || c==="]"){
      depth--;
      if(depth===1) close1 = i;
      if(depth===2) close2 = i;
    }
  }
  if(root==="[" && close1 > 0) return JSON.parse(s.slice(0, close1+1) + "]");
  if(root==="{" && close2 > 0) return JSON.parse(s.slice(0, close2+1) + "]}");
  throw new Error("Response was cut off mid-element.");
}

/* ══ prompts ══════════════════════════════════════════════════
   Every string Primer sends the model, system and user, lives in
   prompts/<key>.txt, raw text, loaded at boot. This table fixes the
   order and the labels on the Prompts page; runtime edits there are
   stored as overrides and Reset returns to the file. {{PLACEHOLDERS}}
   are filled in at call time. `group` sorts them on the page. The
   templates marked `user` only arrange the fields into a message; they
   are loaded but not shown, there being nothing in them to change.   */
const PROMPT_GROUPS = { base:"Base", write:"Writing a primer", revise:"Revising a selection", rewrite:"Rewriting a primer" };
const PROMPTS = {
  house:                { group:"base",    label:"House style" },
  reader:               { group:"base",    label:"Reader" },
  instruction:          { group:"base",    label:"Instructions wrapper", user:true },
  outline:              { group:"write",   label:"Outline" },
  outline_user:         { group:"write",   label:"Outline · user", user:true },
  section:              { group:"write",   label:"Section" },
  section_user:         { group:"write",   label:"Section · user", user:true },
  figure:               { group:"write",   label:"Illustrator" },
  figure_user:          { group:"write",   label:"Diagram · user", user:true },
  finder:               { group:"write",   label:"Image finder" },
  finder_user:          { group:"write",   label:"Image finder · user", user:true },
  research:             { group:"write",   label:"Researcher" },
  research_user:        { group:"write",   label:"Research · user", user:true },
  define:               { group:"write",   label:"Definer" },
  define_user:          { group:"write",   label:"Definition · user", user:true },
  edit:                 { group:"revise",  label:"Reviser" },
  edit_user:            { group:"revise",  label:"Edit · user", user:true },
  explain:              { group:"revise",  label:"Explain" },
  example:              { group:"revise",  label:"Example" },
  derive:               { group:"revise",  label:"Derive" },
  tighter:              { group:"revise",  label:"Tighter" },
  revise:               { group:"revise",  label:"Edit" },
  ask:                  { group:"revise",  label:"Ask" },
  figure_action:        { group:"revise",  label:"Diagram" },
  rewrite_outline:      { group:"rewrite", label:"Outline" },
  rewrite_outline_user: { group:"rewrite", label:"Outline · user", user:true },
  rewrite_section_user: { group:"rewrite", label:"Section · user", user:true }
};

/* Fetch prompts/<key>.txt for every entry. Returns the keys that failed.
   Needs http; file:// blocks fetch. */
async function loadPrompts(){
  const missing = [];
  await Promise.all(Object.keys(PROMPTS).map(async k => {
    try{
      const r = await fetch("/prompts/"+k+".txt", { cache:"no-cache" });
      if(!r.ok) throw new Error(r.status);
      PROMPTS[k].text = (await r.text()).replace(/\r\n/g, "\n").replace(/\n$/, "");
    }catch(e){ PROMPTS[k].text = ""; missing.push(k); }
  }));
  return missing;
}

let overrides = {};   // {key: text} from storage
function rawPrompt(k){ return (k in overrides) ? overrides[k] : PROMPTS[k].text; }

/* {{KEY}} → vars.KEY. Unknown keys are left visible. Blank runs collapse. */
function fill(tpl, vars){
  return tpl.replace(/\{\{(\w+)\}\}/g, (m, key) =>
      (key in vars) ? String(vars[key]) : m)
    .replace(/\n{3,}/g, "\n\n").trim();
}
function sys(k){ return fill(rawPrompt(k), { HOUSE: rawPrompt("house").trim() }); }

const $ = s => document.querySelector(s);

function el(tag, cls, text){

  const d = Date.now()-ts, m = Math.round(d/6e4), h = Math.round(d/36e5), dd = Math.round(d/864e5);

/* A link out to the web, in a new tab. A URL the model or a reader supplied

function grow(ta){ ta.style.height = "auto"; const h = ta.scrollHeight; ta.style.height = h ? h + "px" : ""; }

/* The subsections of a section, as {title, block?}: its subheading blocks

function subsOf(d, h){

/* The outline as the writers read it: numbered sections, subsections under them. */

    [(i+1) + ". " + headingTitle(h), ...subsOf(d, h).map((x, j) => "   " + (i+1) + "." + (j+1) + " " + x.title)].join("\n")).join("\n");

/* The number a block carries in the margin: "3" for a section, "3.2" for
   a subsection. */

/* A subheading block from a title the writer or the reviser gave. */
const subBlock = (title, base) => ({ id:uid(), kind:"subheading", md:"### " + trimTitle(title, 72, "Subsection"), fresh:true, ...base });
/* Prose as blocks. A model that puts a markdown heading inside its prose,
   though asked not to, gets it split out as the subheading it meant. Code

function proseBlocks(md, base){
  const out = []; let buf = [], fenced = false;
  const flush = () => { const t = buf.join("\n").trim(); if(t) out.push({ id:uid(), kind:"prose", md:t, fresh:true, ...base }); buf = []; };

/* ══ markdown + math ══════════════════════════════════════════ */
marked.setOptions({breaks:false, gfm:true});
/* Inline math opens at a $ that touches what follows and closes at one that
   touches what precedes and is not followed by a digit, so "$1000 in the
   bank … you have $1100" is money, not a formula. */
const MATH_RE = /\$\$[\s\S]*?\$\$|\$(?!\s)(?:\\.|[^$\\\n])+?(?<!\s)\$(?!\d)/g;
/* Math is handed to KaTeX in its \( \) and \[ \] forms, so a dollar sign
   left in the prose is only ever a dollar sign. It goes into the HTML as
   text, so a < in a formula is never the start of a tag. */
const escHtml = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const texForm = m => escHtml(m.startsWith("$$") ? "\\[" + m.slice(2, -2) + "\\]" : "\\(" + m.slice(1, -1) + "\\)");
/* Nothing the model wrote reaches the page as HTML until DOMPurify has
   been over it. Prose keeps what marked makes of it and its links to
   other primers; a diagram keeps its SVG and nothing that could run,
   restyle the page or reach outside it. Math is typeset in the DOM
   afterwards.                                                          */
const SAFE_URI = /^(?:(?:https?|mailto|primer):|[^a-z]|[a-z+.\-]+(?:[^a-z+.\-:]|$))/i;
const safeHtml = html => DOMPurify.sanitize(html, { USE_PROFILES:{ html:true }, FORBID_TAGS:["style"], ALLOWED_URI_REGEXP:SAFE_URI });
const safeSvg = svg => DOMPurify.sanitize(String(svg), { USE_PROFILES:{ svg:true, svgFilters:true }, FORBID_TAGS:["style", "image"], ADD_ATTR:["role"] });

function mdToHtml(md){
  const parts = String(md).split(/(```[\s\S]*?```)/g);
  const stash = [];
  const masked = parts.map(p => p.startsWith("```") ? p :
    p.replace(MATH_RE, m => { stash.push(texForm(m)); return "@@PM"+(stash.length-1)+"@@"; })
  ).join("");
  const html = marked.parse(masked);
  return safeHtml(html.replace(/@@PM(\d+)@@/g, (_,i) => stash[+i]));
}
function mdInline(md){
  const stash = [];
  const masked = String(md).replace(MATH_RE, m => { stash.push(texForm(m)); return "@@PM"+(stash.length-1)+"@@"; });
  return safeHtml(marked.parseInline(masked).replace(/@@PM(\d+)@@/g, (_,i) => stash[+i]));
}
function typeset(el){
  try{
    renderMathInElement(el,{ throwOnError:false, delimiters:[
      {left:"\\[",right:"\\]",display:true},{left:"\\(",right:"\\)",display:false}]});
  }catch(e){}
}

/* ══ trace ════════════════════════════════════════════════════
   Every model call made for a document, in order, with the prompts that
   went out, the tools the agent used, and the text that came back. Kept
   under primer:raw:<id> and shown in the Inspector.                     */
const traces = new Map();          // docId → [record]
const traceSaveT = new Map();
const TRACE_MAX = 150, TRACE_TEXT = 20000;
const clip = s => (s && s.length > TRACE_TEXT) ? s.slice(0, TRACE_TEXT) + "\n…[" + (s.length - TRACE_TEXT) + " more characters]" : s;
async function traceOf(id){
  if(!traces.has(id)){
    const t = (await store.get("primer:raw:"+id)) || [];
    /* A call still "running" in storage was cut off when the page closed. */
    t.forEach(r => { if(r.status === "running"){ r.status = "lost"; r.error = "The page was closed while this call was running."; } });
    traces.set(id, t);
  }
  return traces.get(id);

/* Persist soon; while text is streaming, no more often than every few
   seconds, so a closed page still leaves what had arrived by then. */
function saveTrace(id, streaming){
  if(traceSaveT.has(id)) return;
  traceSaveT.set(id, setTimeout(() => { traceSaveT.delete(id); writeTrace(id); }, streaming ? 2500 : 600));
}
/* At once: when a run ends, so a page closed the next moment keeps its last calls. */
function flushTrace(id){
  clearTimeout(traceSaveT.get(id)); traceSaveT.delete(id);
  return writeTrace(id);
}
function writeTrace(id){
  const t = traces.get(id); if(!t) return;
  if(t.length > TRACE_MAX) t.splice(0, t.length - TRACE_MAX);
  return store.set("primer:raw:"+id, t.map(c => ({ ...c, output:clip(c.output), system:clip(c.system), user:clip(c.user) })));
}
/* The key a block's calls are filed under in the trace, so a failed piece
   can find the call behind it after a retry or a reload: the outline,
   a section by number, or a diagram or image by its original id.   */
function keyOf(b){
  if(b.slot) return "sec:" + b.sec;
  if((b.kind === "figure" || b.kind === "image") && b.brief) return b.origin || b.id;
  return b.sec == null ? "plan" : null;
}
/* What a document has cost so far, summed over its calls. Tokens counted
   as the API counts them; cost at API rates, even on a subscription. */
function usageOf(d){
  const t = { calls:0, in:0, out:0, cost:0, searches:0 };
  for(const r of (traces.get(d.id) || [])){
    if(!r.usage) continue;
    t.calls++; t.in += r.usage.in || 0; t.out += r.usage.out || 0; t.cost += r.usage.cost || 0; t.searches += r.usage.searches || 0;
  }

}
/* The About panel's cost line is drawn with the page; a call that ends
   after that, a revision say, redraws it so it agrees with the Inspector. */
function usagePaint(d){
  if(doc !== d || route !== "doc") return;
  main.querySelectorAll(".doc .meta").forEach(m => m.replaceWith(metaNode(d)));
}
const kTok = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "k" : String(n);

function usageText(u){
  if(!u.calls) return "";
  const parts = [kTok(u.in) + " tokens in", kTok(u.out) + " out"];
  if(u.searches) parts.push(u.searches + (u.searches === 1 ? " search" : " searches"));
  parts.push(usd(u.cost) + " at API rates");
  return parts.join(" · ");
}
/* The most recent call filed under a block, if any. */
function callFor(t, b){
  const k = keyOf(b);
  for(let i = t.length - 1; i >= 0; i--) if(t[i].key === k) return t[i];
  return null;

/* ══ runs and jobs ════════════════════════════════════════════
   A run is everything in flight for one document: its jobs (one per model
   call) and the switch that stops them. Generation never touches the global
   `doc`; it works on the document it was given, and the page redraws only
   when that document is the one on screen. So a second primer can be
   started, or the library opened, while the first is still being written. */
const runs = new Map();   // docId → {doc, jobs:Set<job>, cancelled, active, side}
function runOf(d){
  let r = runs.get(d.id);
  if(!r){ r = { doc:d, jobs:new Set(), cancelled:false, active:false, side:Promise.resolve() }; runs.set(d.id, r); }
  return r;
}
const running = d => { const r = d && runs.get(d.id); return !!(r && (r.jobs.size || r.active)); };
function stopRun(d){
  const r = runs.get(d.id);

  r.cancelled = true;

}
function tidyRun(d){ const r = runs.get(d.id); if(r && !r.jobs.size && !r.active) runs.delete(d.id); }

/* One model call on a document's behalf. While it runs it is a job the desk
   shows; its text streams into `block`; every prompt, tool call and reply
   lands in the document's trace. Throws with e.stopped when the run was
   stopped. s: {role, label, sec, block, system, user, parent, by}:
   `parent` is the id of the call whose answer asked for this one, `by`
   is "you" when a person started it. The id of the call comes back as
   out.callId (or e.callId) so its children can name it.               */
async function agent(d, s){
  const run = runOf(d);

  const job = { id:uid(), doc:d, role:s.role, label:s.label, sec:s.sec, key,
                ctrl:new AbortController(), started:Date.now(), note:"" };
  run.jobs.add(job);
  const trace = await traceOf(d.id);
  const rec = { id:job.id, docId:d.id, role:s.role, label:s.label, sec:s.sec, key, parent:s.parent || null, by:s.by || "",

  trace.push(rec); saveTrace(d.id);
  if(s.block) s.block.liveRole = s.role;
  const live = s.block ? liveInto(d, s.block) : null;
  livePaint();
  try{
    const out = await askJSON(s.system, s.user, s.role, {
      signal: job.ctrl.signal,
      onDelta: soFar => { rec.output = soFar; if(live) live(soFar); liveCall(rec); saveTrace(d.id, true); },
      onEvent: ev => {
        rec.events.push({ t:Date.now(), ...ev });
        if(ev.kind === "start") rec.model = ev.model;
        if(ev.kind === "usage"){ rec.usage = { in:ev.in, out:ev.out, cost:ev.cost, searches:ev.searches, turns:ev.turns }; usagePaint(d); return; }
        if(ev.kind === "tool") job.note = toolNote(ev);
        if(ev.kind === "result") job.note = ev.ok ? job.note : "tool failed, trying another way";
        if(ev.kind === "retry"){ rec.output = ""; job.note = "answer didn't parse, asking again"; }

      }

    rec.status = "ok";
    out.callId = rec.id;
    return out;
  }catch(e){
    rec.status = e.stopped ? "stopped" : "error";
    rec.error = e.message;
    e.callId = rec.id;
    if(e.partial) rec.output = e.partial;
    if(e.kind) rec.kind = e.kind;
    if(!e.stopped) issue(d, cap(s.label || "a call") + " failed: " + e.message, rec, e.kind);
    /* No key, no credit, no login, or a limit reached: nothing else will
       succeed either, so the run stops here rather than failing piece by piece. */
    if(e.kind && running(d)){ stopRun(d); d.statusNote = e.kind === "no_key" ? "no key in Settings" : "no credit or login"; }
    throw e;
  }finally{
    rec.ended = Date.now(); saveTrace(d.id);

  }

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function toolNote(ev){
  const i = ev.input || {};

  if(ev.name === "WebFetch") return "reading " + host(i.url);
  if(/look_at_image$/.test(ev.name)) return "looking at " + host(i.url);
  return ev.name;

/* ══ issues ═══════════════════════════════════════════════════
   Everything that went wrong this session, newest first, shown in the
   status line of the document it belongs to.
   Each one also lives on in its block's error and in the trace.      */
const issues = [];
function issue(d, msg, rec, kind){
  const last = issues[0];
  if(last && last.docId === d.id && last.msg === msg) return;
  issues.unshift({ id:uid(), ts:Date.now(), docId:d.id, title:d.title, msg, rec, kind });
  if(issues.length > 8) issues.pop();
  toast(msg, { err:true, call: rec ? { docId:d.id, id:rec.id } : null });
  livePaint();
}

/* ══ live repaint ═════════════════════════════════════════════
   Whatever a running job changes is shown in place: the status line of the
   document on screen, the header, and the library's state column. */
let liveT = 0, shelfSig = null;
function livePaint(){
  if(liveT) return;
  liveT = requestAnimationFrame(() => { liveT = 0; statusPaint(); paintHeader(); if(route === "cover") renderLibrary(); });
}

/* ══ render ═══════════════════════════════════════════════════ */
function render(){
  document.body.dataset.route = route;
  applySettings();
  closePops(); hideTools();
  if(route === "login") renderLogin();
  else if(route === "settings") renderSettings();
  else if(route === "guide") renderGuide();
  else if(route === "missing") renderMissing();
  else if(route === "inspector" && doc) renderInspector();
  else if((route === "doc" || route === "shared") && doc) renderDoc();
  else { route = me ? "cover" : "login"; document.body.dataset.route = route; if(me) renderCover(); else renderLogin(); }
  syncHistory();
  document.title = pageTitle();
  paintHeader();
  markCurrent();
}
/* A primer can be shared, rewritten or exported once it has prose and
   nothing is being written into it. */
const settled = d => !!(d && !running(d) && d.blocks.some(b => b.md && b.kind !== "heading"));
/* The top bar holds what is not about any one primer. */
function paintHeader(){
  backBtn.classList.toggle("hide", !aside());
  newBtn.classList.toggle("hide", !me || route === "cover" || route === "login");
  settingsBtn.classList.toggle("hide", !me || route === "login");
  settingsBtn.classList.toggle("on", route === "settings");
  toolsPaint();
}

/* ── the primer's own toolbar, under its title ── */
function toolsNode(d){
  const nav = el("nav", "doc-tools m-tools"); nav.setAttribute("aria-label", "This primer");
  const add = (label, fn, on) => { const b = btn("act" + (on ? " on" : ""), label, fn); nav.append(b); return b; };
  add("About", () => { aboutOpen = !aboutOpen; aboutPaint(); }, aboutOpen);
  /* Links need an account; a guest can still export. */
  if(readonly() || (settled(d) && !isGuest())){

  }

  }

/* The toolbar and the status line share one row under the title. */
function barNode(d){ const bar = el("div", "doc-bar"); bar.append(toolsNode(d), statusNode(d)); return bar; }

/* The home page's title: the time of day, and who is signed in. */
function greeting(){
  const h = new Date().getHours();
  return "Good " + (h < 12 ? "morning" : h < 18 ? "afternoon" : "evening") + (me && !me.guest ? ", " + me.name : "");
}
function renderCover(){
  const c = el("section", "cover");
  c.innerHTML = `<form class="composer" id="composer">
      <h1 class="title hello">${LOGO}<span id="hello"></span></h1>
      <label class="lab" for="cTopic">What do you want to understand?</label>
      <textarea id="cTopic" class="field" rows="1" autocomplete="off"></textarea>
      <div class="more">
        <label class="lab" for="cKnown">What you already know (optional)</label>
        <textarea id="cKnown" class="field" rows="1"></textarea>
        <label class="lab" for="cInstr">Instructions (optional)</label>
        <textarea id="cInstr" class="field" rows="1"></textarea>
        <div class="chips" id="cChips"></div>
        <div class="composer-foot"><button class="go" type="submit">Write new primer<kbd>↵</kbd></button></div>
      </div>
    </form>
    <section class="library" id="library"></section>`;
  c.querySelector("#hello").textContent = greeting();
  main.replaceChildren(c);

  const form = $("#composer"), topic = $("#cTopic"), known = $("#cKnown"), instr = $("#cInstr");
  const fields = [topic, known, instr];
  fields.forEach(f => { f.oninput = () => grow(f); });
  topic.onkeydown = e => { if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); } };
  [known, instr].forEach(f => {
    f.onkeydown = e => { if(e.key==="Enter" && (e.metaKey||e.ctrlKey)){ e.preventDefault(); form.requestSubmit(); } };
  });

  /* A chip appends its instruction, so several can be combined, and clicking
     one again takes it back off. */
  const chips = $("#cChips");
  BRIEFS.forEach(p => {
    const b = btn("chip", p.label, () => {
      const has = instr.value.includes(p.text);
      const rest = instr.value.split(/\n+/).map(s => s.trim()).filter(s => s && s !== p.text);
      instr.value = (has ? rest : rest.concat(p.text)).join("\n");
      instr.dispatchEvent(new Event("input"));
      instr.focus();
    });
    b.dataset.text = p.text; b.title = p.text;
    chips.append(b);
  });
  instr.addEventListener("input", () =>
    chips.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", instr.value.includes(c.dataset.text))));

  /* What was typed stays put through a trip to Settings or a reload of the
     tab, until a primer is started from it. */
  const DRAFT = "primer:draft";
  try{
    const d = JSON.parse(sessionStorage.getItem(DRAFT) || "null");
    if(d){ topic.value = d.topic || ""; known.value = d.known || ""; instr.value = d.instr || ""; }
  }catch(e){}
  if(instr.value) instr.dispatchEvent(new Event("input"));
  form.addEventListener("input", () => {
    try{ sessionStorage.setItem(DRAFT, JSON.stringify({ topic:topic.value, known:known.value, instr:instr.value })); }catch(e){}
  });

  form.onsubmit = e => {
    e.preventDefault();
    const t = topic.value.trim(); if(!t){ topic.focus(); return; }
    if(me && !me.key){ goto("settings"); toast("Add a key, or link to a shared one, first"); return; }
    try{ sessionStorage.removeItem(DRAFT); }catch(e){}
    startDoc({ topic:t, known:known.value.trim(), instruction:instr.value.trim() });
  };
  shelfSig = null; libQuery = "";
  renderLibrary();
  requestAnimationFrame(() => fields.forEach(grow));
  if(!matchMedia("(pointer:coarse)").matches) topic.focus({ preventScroll:true });
}

/* What the library says about a document: nothing when it is finished,
   otherwise where it is, live if it is being written right now. */
function shelfState(it){
  const d = docs.get(it.id);
  if(d && running(d)) return { live:true, text: docState(d).text };
  if(d) { const st = docState(d); return st.kind === "done" ? null : { failed: st.kind === "failed", text: st.kind === "short" ? st.text : st.text.split(",")[0] }; }
  const s = it.status || "done";
  if(s === "done") return it.short ? { text: it.short === 1 ? "one piece missing" : it.short + " pieces missing" } : null;
  if(s === "failed") return { failed:true, text:"failed" };
  return { text: s === "stopped" ? "stopped" : s === "interrupted" ? "interrupted" : "unfinished" };
}
/* The list shows the first FOLD primers; the rest wait behind "more". A
   search shows every match. The search box is made once and kept, so
   typing in it survives the repaints that live primers cause. */
const FOLD = 15, FIND_FROM = 6;
let libQuery = "", libOpen = false;
function renderLibrary(){
  const lib = $("#library");
  if(!lib) return;
  const states = index.map(it => { const s = shelfState(it); return s ? (s.live ? "·" : "") + s.text : ""; });
  const sig = index.map((it, i) => it.id + it.title + states[i] + (it.words == null ? "" : it.words)).join("|") + "\n" + libQuery + (libOpen ? "+" : "");
  if(sig === shelfSig) return;
  shelfSig = sig;
  if(!index.length){ lib.replaceChildren(); return; }
  let head = lib.querySelector(".lib-head");
  if(!head){
    head = el("div", "lib-head");
    head.append(el("span", "lab", "Library"));
  }
  let find = head.querySelector(".find");
  if(index.length >= FIND_FROM && !find){
    find = document.createElement("input");
    find.className = "find"; find.type = "search"; find.placeholder = "Search"; find.setAttribute("aria-label", "Search the library");
    find.autocomplete = "off"; find.value = libQuery;
    find.oninput = () => { libQuery = find.value; renderLibrary(); };
    find.onkeydown = ev => { if(ev.key === "Escape" && find.value){ ev.preventDefault(); find.value = ""; libQuery = ""; renderLibrary(); } };
    head.append(find);
  }else if(index.length < FIND_FROM && find){ find.remove(); libQuery = ""; }
  const q = libQuery.trim().toLowerCase();
  const found = q ? index.filter(it => (it.title || "").toLowerCase().includes(q)) : index;
  const shown = (q || libOpen) ? found : found.slice(0, FOLD);
  const list = el("ol", "shelf");
  if(!shown.length) list.appendChild(el("li", "none", "Nothing matches “" + libQuery.trim() + "”"));
  shown.forEach(it => {
    const li = el("li");
    /* A real link, so it can be opened in a new tab or copied. */
    const open = el("a", "open"); open.href = "/p/" + it.id;
    open.onclick = inPlace(() => openDoc(it.id));
    open.append(el("span", null, it.title));
    const s = shelfState(it);
    if(s){
      const st = el("span", "state" + (s.live ? " live" : "") + (s.failed ? " failed" : ""), s.text);
      if(s.live) st.prepend(el("i", "dot"));
      open.append(st);
    }
    if(it.words) open.append(el("span", "words", it.words.toLocaleString() + (it.words === 1 ? " word" : " words")));
    open.append(el("time", null, shortDate(it.updated)));
    let x;
    if(s && s.live) x = btn("x stop", "Stop", () => stopRun(docs.get(it.id)));
    else{
      x = btn("x", "Delete");
      x.onclick = () => confirmRow(li, it.title, () => deleteDoc(it.id));
    }
    li.append(open, x);
    list.appendChild(li);
  });
  /* The head stays put, so the search box keeps focus while typing. */
  if(head.parentNode !== lib) lib.prepend(head);
  lib.querySelectorAll(".shelf, .more-lib").forEach(x => x.remove());
  lib.append(list);
  if(!q && found.length > FOLD){
    const rest = found.length - FOLD;
    lib.append(btn("more-lib", libOpen ? "Less ↑" : rest + " more ↓", () => { libOpen = !libOpen; renderLibrary(); }));
  }
}
/* Are you sure? In place of whatever `host` holds: the question, a red
   Delete, and Keep, which puts it back. */
function confirmRow(host, title, yes){
  const was = [...host.childNodes], c = el("span", "confirm");
  const keep = btn(null, "Keep", () => host.replaceChildren(...was));
  c.append(el("span", null, "Delete “" + title + "”?"), btn("danger", "Delete", yes), keep);
  host.replaceChildren(c);
  keep.focus();
}

/* ── document ─────────────────────────────── */
function renderDoc(){
  const a = el("article", "doc");
  a.innerHTML = `<header class="doc-head"><h1 class="title"></h1></header>`;
  a.querySelector(".title").textContent = doc.title;
  const head = a.querySelector(".doc-head");
  head.append(barNode(doc), metaNode(doc), docToc(doc), docToc(doc, true));
  if(doc.note){
    const note = el("aside", "pnote");
    note.append(el("span", "lab", "Note from the planner"), el("p", null, doc.note));
    head.append(note);
  }

  let n = 0, m = 0, fi = 0;
  doc.blocks.forEach(b => {
    if(b.kind === "heading"){ n++; m = 0; } else if(b.kind === "subheading") m++;
    const e = blockEl(b, b.kind === "subheading" ? n + "." + m : n);
    if(e.classList.contains("fresh")) e.style.setProperty("--i", fi++);
    a.appendChild(e);
  });
  if(doc.blocks.some(b => b.kind === "heading")){
